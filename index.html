    '<div class="med-circle" id="med-circle">' +
    '<canvas id="med-canvas" width="180" height="180" style="position:absolute;inset:0;border-radius:50%"></canvas>' +
    '<div class="med-timer" id="med-timer">' + mins + ':00</div>' +
    '</div>' +
    '<div class="breath-text" id="breath-text">היכון...</div>' +
    '<div style="margin:20px 0;padding:14px;background:var(--tao-bg2);border-radius:var(--radius-lg);text-align:right">' +
    stepsHtml +
    '</div>' +
    '<button onclick="stopMeditation(false)" style="width:100%;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--tao-line);background:transparent;color:var(--tao-t2);font-size:var(--fs-base)">סיים מוקדם</button>',
    {closeOnOverlay:false, modalStyle:'text-align:center'});

  drawMedCircle(1);

  var pattern = ['שאיפה...', 'עצירה...', 'נשיפה...', 'השהייה...'];
  var breathTimes = [4, 4, 6, 2];
  var breathIdx = 0;
  var breathTimer = 0;

  setTimeout(function() {
    var b = document.getElementById('breath-text');
    if (b) b.textContent = pattern[0];
  }, 1500);

  medInterval = setInterval(function() {
    medSeconds--;
    var m = Math.floor(medSeconds / 60);
    var s = medSeconds % 60;
    var timer = document.getElementById('med-timer');
    if (timer) timer.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    drawMedCircle(medSeconds / medTotal);
    breathTimer++;
    if (breathTimer >= breathTimes[breathIdx]) {
      breathTimer = 0;
      breathIdx = (breathIdx + 1) % 4;
      var b = document.getElementById('breath-text');
      if (b) b.textContent = pattern[breathIdx];
      if (breathIdx === 0 && typeof window._onBreathCycle === 'function') window._onBreathCycle();
    }
    if (medSeconds <= 0) stopMeditation(true);
  }, 1000);
}


function drawMedCircle(ratio) {
  const canvas = document.getElementById('med-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=180, cx=W/2, cy=W/2, r=W/2-4;
  ctx.clearRect(0,0,W,W);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=TAO_CANVAS.track; ctx.lineWidth=3; ctx.stroke();
  if(ratio>0) {
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(1-ratio)*Math.PI*2);
    ctx.strokeStyle=TAO_CANVAS.ring; ctx.lineWidth=3; ctx.stroke();
  }
}

function stopMeditation(completed) {
  if(medInterval) { clearInterval(medInterval); medInterval = null; }
  window._onBreathCycle = null;
  document.getElementById('modal-container').innerHTML = '';
  try { stopAmbientMusic(); } catch(e) { console.log('stopAmbientMusic err:', e); }
  try { stopVoice(); } catch(e) { console.log('stopVoice err:', e); }
  if(completed) { playFx('done'); showRipple(); haptic('success'); logEvent('meditation_completed', {}); }
}

// scattered, because that is when "just pick one task" does not work yet —
// the body has to come down first. It reuses the meditation bowl and the
// haptics, but deliberately NOT startMeditation(): that one is a dark-screen

// the drop: where the chosen tab is, and a short spring to get there
function placeNavInd(animate) {
  var nav = document.getElementById('nav'), ind = nav && nav.querySelector('.nav-ind')
  if(!ind) return
  var btn = nav.querySelector('.nav-btn.active')
  if(!btn || nav.style.display === 'none') { ind.classList.add('off'); return }
  ind.classList.remove('off')
  var nr = nav.getBoundingClientRect(), br = btn.getBoundingClientRect()
  if(!nr.width) return
  // kept inside the bar's rounded ends
  var x = Math.max(8, Math.min(nr.width - 66, br.left - nr.left + (br.width - 58) / 2))
  var old = navIndX == null ? x : navIndX; navIndX = x
  if(ind.__a) { try { ind.__a.cancel() } catch(e) {} ind.__a = null }
  if(!animate || reducedMotion() || old === x || !ind.animate) { ind.style.transform = 'translateX(' + x + 'px)'; return }
  var dx = x - old, k = Math.min(Math.abs(dx) / 300, .34), sx = 1 + k, sy = 1 / Math.sqrt(sx) * .98
  ind.__a = ind.animate([
    {transform: 'translateX(' + old + 'px) scale(1,1)', easing: 'cubic-bezier(.3,.6,.4,1)'},
    {transform: 'translateX(' + (old + dx * .55) + 'px) scale(' + sx + ',' + sy + ')', offset: .4, easing: 'cubic-bezier(.3,.6,.4,1)'},
    {transform: 'translateX(' + (x + dx * .05) + 'px) scale(' + (1 / Math.sqrt(sx) * 1.03) + ',1.08)', offset: .74, easing: 'ease-out'},
    {transform: 'translateX(' + x + 'px) scale(1,1)'}
  ], {duration: 420, fill: 'forwards'})
  ind.__a.onfinish = function(){ ind.style.transform = 'translateX(' + x + 'px)'; try { ind.__a.cancel() } catch(e) {} ind.__a = null }
}

// ── JUNGLE: a ring of water where a card, a main button or the nav is pressed. A thin light ring spreads from the
// point of the press and is gone in 350ms, clipped to the shape pressed. Only cards, the main action buttons and the
// bottom nav; a press on any other control inside a card makes none. It never takes the press (pointer-events: none),
// never runs on what is off screen or in a hidden page, and not at all with reduced motion or reduced transparency.
const JG_RIP_MAIN = '.btn-primary, .nh-ask, .gn-btn.hot, .site-hbtn-add, .btn-add, .screen-header button[style*="--bamboo"]'
const JG_RIP_CARD = '.card, .site-card, .nh-garden, .nh-peek'
function jgRipple(e) {
  if(currentTheme !== 'jungle' || e.button > 0 || document.visibilityState !== 'visible') return
  if(reducedMotion() || (window.matchMedia && matchMedia('(prefers-reduced-transparency: reduce)').matches)) return
  const t = e.target; if(!(t instanceof Element)) return
  const ctl = t.closest('button, a, input, select, textarea, label, [contenteditable="true"]')
  let host = null
  if(ctl) { if(ctl.matches('.nav-btn')) host = ctl.closest('#nav') || ctl; else if(ctl.matches(JG_RIP_MAIN)) host = ctl; else return }
  else host = t.closest(JG_RIP_CARD)
  if(!host) return
  const r = host.getBoundingClientRect()
  if(!r.width || r.bottom <= 0 || r.top >= innerHeight || r.right <= 0 || r.left >= innerWidth) return
  const x = e.clientX - r.left, y = e.clientY - r.top, R = Math.min(140, Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)))
  const box = document.createElement('span'); box.className = 'jg-rip'; box.setAttribute('aria-hidden', 'true')
  box.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;border-radius:' + getComputedStyle(host).borderRadius
  const ring = document.createElement('i')
  ring.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + 2 * R + 'px;height:' + 2 * R + 'px;margin:' + (-R) + 'px 0 0 ' + (-R) + 'px'
  box.appendChild(ring); document.body.appendChild(box)
  setTimeout(() => box.remove(), 400)

// ── RIVER GARDEN (Nachal only) ────────────────────
// Finishing a task drops water into the tasks icon; sometimes the river also
// brings a small surprise, kept in a collection reachable from Home. A closed
// day adds a stone to a pile on Home, a good week adds a leaf. Nothing here is
// ever taken away, there are no points, sounds or streaks, and a quiet day
// costs nothing. The collection lives in this browser (localStorage) only.
//
// The table is by id. Each id points at a file in assets/rewards/; the art is
// meant to be replaced later by files with the same names (tools/cut_reward_sheet.py
// cuts a 3x3 magenta sheet into exactly these files), with nothing else to change.
// Weights add up to 100. Rarity is 0 common .. 3 very rare.
const REWARDS = {
  'pebble':          {file: 'pebble.png',          weight: 30, rarity: 0},
  'leaf':            {file: 'leaf.png',            weight: 16, rarity: 0},
  'water-lily-bud':  {file: 'water-lily-bud.png',  weight: 12, rarity: 1},
  'river-fish':      {file: 'river-fish.png',      weight: 9,  rarity: 1},
  'water-lily':      {file: 'water-lily.png',      weight: 9,  rarity: 1},
  'dragonfly-teal':  {file: 'dragonfly-teal.png',  weight: 7,  rarity: 1},
  'koi':             {file: 'koi.png',             weight: 6,  rarity: 2},
  'dragonfly-amber': {file: 'dragonfly-amber.png', weight: 4,  rarity: 2},
  'frog':            {file: 'frog.png',            weight: 4,  rarity: 2},
  'fireflies':       {file: 'fireflies.png',       weight: 2,  rarity: 3},
  'glowing-ripple':  {file: 'glowing-ripple.png',  weight: 1,  rarity: 3}
}
const REWARD_DIR = 'assets/rewards/'
const GARDEN_RULES = {
  minAgeMs: 20000,     // a task closed sooner than this after it was created never counts
  dailyCap: 5,         // surprises a day, at most
  pAfterFirst: 0.40,   // the first valid close of the day always brings one; later ones with this chance
  dayMinTasks: 3,      // a day is closed once this many valid tasks were closed in it (or with "done for today")
  weekMinDays: 3       // a week (Sunday to Saturday) brings a leaf when at least this many of its days were closed
}
const GARDEN_KEY = 'fieldy_garden_v1'
function rewardName(id) { return tr('rw_' + id.replace(/-/g, '_')) }
function rewardSrc(id) { return REWARD_DIR + REWARDS[id].file }
function pickReward(rnd) {
  const ids = Object.keys(REWARDS), total = ids.reduce((n, k) => n + REWARDS[k].weight, 0)
  let x = (rnd || Math.random)() * total
  for(const k of ids) { x -= REWARDS[k].weight; if(x < 0) return k }
  return ids[0]
}
function gardenDayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
function gardenWeekKey(d) { d = new Date(d || Date.now()); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return gardenDayKey(d) }
function gardenFresh() { return {v: 1, items: {}, cairn: [], leaves: 0, days: {}, weeks: {}} }
let garden = (function(){
  try { const g = JSON.parse(localStorage.getItem(GARDEN_KEY)); if(g && g.v === 1 && g.items) return g } catch(e) {}
  return gardenFresh()
})()
function saveGarden() {
  // only the last 60 days of day records are needed (for the weekly leaf)
  const keep = gardenDayKey(new Date(Date.now() - 60 * 86400000))
  Object.keys(garden.days).forEach(k => { if(k < keep) delete garden.days[k] })
  try { localStorage.setItem(GARDEN_KEY, JSON.stringify(garden)) } catch(e) {}
}
function gardenDay(k) { k = k || gardenDayKey(); return (garden.days[k] = garden.days[k] || {rewards: 0, valid: 0, paid: [], closed: false}) }
// when a task was created: tasks carry it in their id (m…, rq…, p… + milliseconds);
// one without a readable time counts as old
function taskCreatedAt(t) {
  if(t && t.createdAt) return +new Date(t.createdAt)
  const m = String(t && t.id || '').match(/(\d{13})/)
  return m ? +m[1] : 0
}
// the rules: returns the id of the surprise, or null
function gardenRoll(task, now) {
  now = now || Date.now()
  const d = gardenDay()
  if(now - taskCreatedAt(task) < GARDEN_RULES.minAgeMs) return null      // closed straight after creating it: nothing, silently
  if(d.paid.indexOf(String(task.id)) !== -1) return null                    // un-ticked and ticked again: nothing more
  d.paid.push(String(task.id)); d.valid++
  if(d.rewards >= GARDEN_RULES.dailyCap) return null
  if(d.rewards > 0 && Math.random() >= GARDEN_RULES.pAfterFirst) return null
  d.rewards++
  const k = pickReward()
  garden.items[k] = (garden.items[k] || 0) + 1
  return k
}
function gardenStone() { return {p: 1 + Math.floor(Math.random() * 12), rot: Math.round(Math.random() * 26 - 13)} }
// a week that has ended brings a leaf when enough of its days were closed
function gardenWeekRollover() {
  const cur = gardenWeekKey(), per = {}; let got = 0
  Object.keys(garden.days).forEach(k => { if(garden.days[k].closed) { const w = gardenWeekKey(new Date(k + 'T00:00:00')); per[w] = (per[w] || 0) + 1 } })
  Object.keys(per).forEach(w => { if(w < cur && !garden.weeks[w] && per[w] >= GARDEN_RULES.weekMinDays) { garden.weeks[w] = 1; garden.leaves++; got++ } })
  if(got) saveGarden()
  return got
}
// called from toggleTask when a task becomes done
let gardenChain = Promise.resolve()
function gardenOnComplete(task) {
  if(!nachalLike()) return
  const k = gardenRoll(task)
  const d = gardenDay()
  const closeDay = d.valid >= GARDEN_RULES.dayMinTasks && !d.closed
  if(closeDay) { d.closed = true; garden.cairn.push(gardenStone()); garden.freshStone = true }
  saveGarden()
  gardenChain = gardenChain.then(async function(){
    await gardenDropFx()
    if(k) await gardenFlyFx(rewardSrc(k), tr('garden_found').replace('{n}', rewardName(k)) + (REWARDS[k].rarity >= 2 ? ' · ' + tr('rarity_' + REWARDS[k].rarity) : ''), REWARDS[k].rarity >= 3)
    if(closeDay) { await gardenFlyFx('assets/pebbles/pebble-' + String(garden.cairn[garden.cairn.length - 1].p).padStart(2, '0') + '.png', tr('garden_day_closed')); if(currentScreen === 'home') renderHome() }
  }).catch(function(e){ console.warn('garden fx:', e) })
}
// "Done for today": closes the day by hand, once; a stone joins the pile
function gardenDoneToday(e) {
  if(e) e.stopPropagation()
  if(!nachalLike()) return
  const d = gardenDay()
  if(d.closed) return
  d.closed = true; garden.cairn.push(gardenStone()); garden.freshStone = true; saveGarden()
  if(currentScreen === 'home') renderHome()
  gardenChain = gardenChain.then(function(){
    return gardenFlyFx('assets/pebbles/pebble-' + String(garden.cairn[garden.cairn.length - 1].p).padStart(2, '0') + '.png', tr('garden_day_closed'))
  }).catch(function(err){ console.warn('garden fx:', err) })

// ── RIGHT NOW (single-focus ranking) ──────────────
// One ranked answer to "what should I look at right now?", built only from
// data the app already collects: the AI focus headline, open tasks (bucket,
// priority, clock time, context), sites flagged stuck, and today's timed
// events. The current mood changes both the order — tired → things that can
// be closed by phone first, site visits last — and how many items are shown

function moodLimit(mood) { return (mood && MOOD_LIB[mood] && MOOD_LIB[mood].taskLimit) || null }

  }

// Light task triage: open tasks that share a site (or an explicit future date)
// but are scattered across buckets get one suggestion — "batch them?" — which
// moves them next to each other in the most urgent of their buckets. Purely
// rule-based, no AI call; a dismissed suggestion stays dismissed until that
// group of tasks changes.
const BUCKET_TR = {now:'bucket_now', today:'task_bucket_today', later:'task_bucket_later'}
function bucketLabel(b) { return tr(BUCKET_TR[b] || b) }
function triageSuggestions() {
  const today = getToday(), open = [], groups = {}
  ;['now','today','later'].forEach(b => (state.tasks[b]||[]).forEach((t,i) => { if(!t.done) open.push({t, b, i}) }))
  open.forEach(o => {
    if(o.t.site) (groups['site:' + o.t.site] = groups['site:' + o.t.site] || []).push(o)
    if(o.t.date && o.t.date !== today) (groups['date:' + o.t.date] = groups['date:' + o.t.date] || []).push(o)
  })
  const dismissed = state.triageDismissed || {}
  return Object.keys(groups).map(key => {
    const items = groups[key]
    if(items.length < 2) return null
    const signature = items.map(o => o.t.id).sort().join(',')
    if(dismissed[key] === signature) return null
    const buckets = [...new Set(items.map(o => o.b))]
    // already side by side in one bucket → nothing to suggest
    if(buckets.length === 1) { const idx = items.map(o => o.i).sort((a,b)=>a-b); if(idx[idx.length-1] - idx[0] === idx.length - 1) return null }
    const target = ['now','today','later'].find(b => buckets.includes(b))
    const what = key.startsWith('site:') ? tr('triage_site').replace('{x}', key.slice(5)) : tr('triage_date').replace('{x}', key.slice(5))
    return {key, signature, items, target, label: tr('triage_label').replace('{n}', items.length).replace('{what}', what).replace('{where}', buckets.length > 1 ? tr('triage_scattered').replace('{b}', buckets.map(bucketLabel).join(' / ')) : tr('triage_not_adjacent'))}
  }).filter(Boolean).slice(0, 2)
}
function batchTasks(key) {
  const sug = triageSuggestions().find(s => s.key === key)
  if(!sug) return
  const ids = new Set(sug.items.map(o => o.t.id))
  const ordered = sug.items.map(o => o.t)   // now → today → later, each in list order
  const prev = state.tasks
  const stripped = {now: prev.now.filter(t=>!ids.has(t.id)), today: prev.today.filter(t=>!ids.has(t.id)), later: prev.later.filter(t=>!ids.has(t.id))}
  const firstInTarget = sug.items.find(o => o.b === sug.target)
  const at = firstInTarget ? prev[sug.target].slice(0, firstInTarget.i).filter(t=>!ids.has(t.id)).length : stripped[sug.target].length
  stripped[sug.target] = stripped[sug.target].slice(0, at).concat(ordered, stripped[sug.target].slice(at))
  haptic('light')
  taskBucket = sug.target
  setState({tasks: stripped})
  offerUndo(tr('undo_batched').replace('{b}', bucketLabel(sug.target)), function(){ setState({tasks: prev}) })
}
function dismissTriage(key) {
  const sug = triageSuggestions().find(s => s.key === key)
  if(!sug) return
  setState({triageDismissed: {...(state.triageDismissed||{}), [key]: sug.signature}})
}
function triageHtml() {
  const sugs = triageSuggestions()
  if(!sugs.length) return ''
  return sugs.map(s => `<div class="triage-card card" data-key="${esc(s.key)}" style="border:1px solid var(--blue-line);border-right:3px solid var(--blue);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px">

      </div>

        <button class="triage-batch" onclick="batchTasks(${jsArg(s.key)})" style="background:var(--blue);color:#fff;border-radius:var(--radius-sm);padding:6px 10px;font-size:var(--fs-sm);font-weight:700">${icon('layers')} ${tr('triage_batch').replace('{b}', bucketLabel(s.target))}</button>
        <button class="triage-dismiss" onclick="dismissTriage(${jsArg(s.key)})" style="background:var(--surface-2);color:var(--t2);border-radius:var(--radius-sm);padding:5px 10px;font-size:var(--fs-sm)">${tr('triage_dismiss')}</button>

// mood bar, same completeFromFocus() — only tasks have a done state, so only
// they get a tick; a focus line, a stuck site or an event shows its own icon.
function rightNowNachalHtml(mood, heading) {
  const all = rankRightNow(mood)
  if(!all.length) return ''
  const limit = moodLimit(mood)
  const cap = (limit && !rightNowExpanded) ? limit : 6
  const shown = all.slice(0, cap), hidden = all.length - shown.length
  const row = (it, first) => {
    const lead = it.kind === 'task'
      ? `<button class="nh-tick" onclick="completeFromFocus(${jsArg(it.id)}, event)" aria-label="${tr('rn_mark_done')}"><span>${icon('check')}</span></button>`
      : `<span class="nh-kind" style="color:${it.color}">${icon(it.icon)}</span>`
    return `<div class="nh-row${first ? ' first' : ''}"${it.go ? ` onclick="${it.go}" role="button" tabindex="0"` : ''}>
      ${lead}
      <div class="nh-rt"><div class="nh-rt1">${esc(it.title)}</div>${it.sub ? `<div class="nh-rt2">${it.sub}</div>` : ''}</div>
    </div>`
  }
  const bar = limit ? moodLimitBarHtml(mood, hidden, 'margin:6px 0 0') : ''
  const more = (!limit && hidden > 0) ? `<div class="nh-rt2" style="padding:6px 2px 0">${tr('rn_more').replace('{n}', hidden)}</div>` : ''
  return `<div class="nh-sec">${heading || icon('target') + ' ' + tr('rn_title')}</div>

}

// ── THE GNOME (jungle): tells the morning briefing ──
// In the jungle Home a small leaf-robed gnome stands in the corner of the
// briefing card and tells it one bubble at a time, at most two lines each:
// the most important thing, a site or two, the week's habit, the AI note.
// Tapping the bubble brings the next; small dots show where you are; "tell me
// more" opens the full briefing, exactly as it was (its own card, with
// "review tasks" and "refresh" in it). "Review tasks", "refresh", editing the
// focus line and the server note all stay (see the table in the commit
// message). He waves once on the first visit of the day, reads while telling,
// points at a site, thinks while the briefing is written, is glad when the
// day is complete, sleeps after 22:00 or when there is nothing to tell.
// Calm motion only, and none off-screen or with reduced motion. A switch in
// Settings turns him off and the briefing is the card it used to be.
// Alignment table: [width, height, hat-top y, foot y, head-centre x, staff-glow x, y], in the file's pixels.
const GN_TAB = {"stand":[120,251,0,250,58.5,61,158],"stand-blink":[119,250,0,250,57.4,59,159],"idle-halfclosed":[148,247,0,247,78.6,13,89],"wave":[182,248,1,247,93.2,28,85],"wave-low":[201,229,0,229,91.3,14,79],"wave-mid":[185,229,0,229,91.7,8,76],"wave-high":[254,248,3,246,103.8,12,89],"read":[163,245,1,241,88.5,24,79],"point":[138,248,2,247,62.5,null,null],"think":[135,229,1,228,61.9,125,77],"joy":[163,229,0,226,80.4,null,null],"sleep":[265,230,0,199,116.2,null,null],"portrait":[168,233,1,231,83.5,null,null],"portrait-blink":[245,222,4,222,87.8,null,null]}
const GN_SIZE = {w: 124, h: 118, body: 100}          // the stage, and the height of a standing body in it
const GN_SCALE = {sleep: .8, portrait: .84, 'portrait-blink': .84}
const GN_BLINK = {stand: 'stand-blink', wave: 'idle-halfclosed', portrait: 'portrait-blink'}
let gnIdx = 0, gnFull = false, gnVisible = true, gnBlinkTimer = null, gnObs = null, gnGreet = null, gnWaved = false
const GN_DEBUG = (function(){ try { const q = new URLSearchParams(location.search); return {hour: q.has('gnomeHour') ? +q.get('gnomeHour') : null, idx: q.has('gnomeIdx') ? +q.get('gnomeIdx') : null, pose: q.get('gnomePose'), greet: q.get('gnomeGreet') === '1'} } catch(e) { return {} } })()
function gnomeOn() { return currentTheme === 'jungle' && localStorage.getItem('fieldy_jungle_gnome') !== '0' }
function setGnome(on) { try { localStorage.setItem('fieldy_jungle_gnome', on ? '1' : '0') } catch(e) {} renderCurrentScreen() }
function gnHour() { return GN_DEBUG.hour !== null && GN_DEBUG.hour !== undefined ? GN_DEBUG.hour : new Date().getHours() }
const GN_PAD = 16     // clear margin around the lit copy of a drawing
function gnPadBox(left, top, w, h) { return 'left:' + (left - GN_PAD).toFixed(1) + 'px;top:' + (top - GN_PAD).toFixed(1) + 'px;width:' + w.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px;box-sizing:content-box;padding:' + GN_PAD + 'px' }
function gnPoseHtml(key, extra) {
  if(LK_POSE[key]) {   // Loki's own twelve: one scale for all, head centred, bottom of the file on the foot line
    const t = LK_POSE[key], w = t[0] * LK_K, h = t[1] * LK_K, left = GN_SIZE.w / 2 - t[2] * LK_K, top = GN_SIZE.h - 3 - h
    const box = 'left:' + left.toFixed(1) + 'px;top:' + top.toFixed(1) + 'px;width:' + w.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px'
    // the fishing line did not survive in the drawing: it is drawn here, a thin light line with a small hook from the tip of the staff to the water, swaying gently
    const line = key === 'fishing' ? '<svg class="gn-line" aria-hidden="true" viewBox="0 0 279 262" style="' + box + '"><g class="gn-line-g"><path d="M234 38 L234 239 M234 239 v7 q0 7 -5 6 q-3 -1 -3 -4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></g></svg>' : ''
    // lamps: a copy of the drawing, masked to the lamp, lit by drop-shadow (or darkened when put out): the glow is on the picture itself, nothing is painted behind it
    let lamp = ''
    if(LK_GLOW[key] && ((extra && extra.lamp) || LK_AUTO[key])) {
      const off = extra && extra.lamp === 'off', tones = {}
      LK_GLOW[key].forEach(g => (tones[g[3] || 'w'] = tones[g[3] || 'w'] || []).push(g))
      Object.keys(tones).forEach(function(tn) {
        // the copy has a margin of clear picture around it (GN_PAD), so the light can spread past the edge of the drawing without being cut
        const masks = tones[tn].map(function(g) { const R = (g[2] + (off ? 3 : 16)) * LK_K; return 'radial-gradient(circle ' + R.toFixed(1) + 'px at ' + (GN_PAD + g[0] * LK_K).toFixed(1) + 'px ' + (GN_PAD + g[1] * LK_K).toFixed(1) + 'px,#000 0,#000 ' + (R * (off ? .85 : .55)).toFixed(1) + 'px,transparent ' + R.toFixed(1) + 'px)' }).join(',')
        lamp += '<img class="gn-glow' + (tn === 'c' ? ' cool' : '') + (off ? ' off' : '') + '" alt="" src="assets/gnome/loki/poses/' + key + '.webp" style="' + gnPadBox(left, top, w, h) + ';-webkit-mask-image:' + masks + ';mask-image:' + masks + '">'
      })
    }
    return '<img class="gn-img lk-img" alt="" data-pose="' + key + '" src="assets/gnome/loki/poses/' + key + '.webp" style="' + box + '">' + lamp + line
  }

// Everything the AI returns used to go straight into state in one setState().
// When it guessed a site wrong, invented a task or re-created something that was
// already there, the only fix was to go and clean it up by hand. buildPreview()
// turns the same parsed JSON — no extra AI call, no change to the prompt or its
// shape — into a plan the user approves first. It is a pure function: it reads
// state but never writes, so "cancel" is genuinely free.
//
// Three groups, decided per item:
//   new     — nothing like it exists. Checked by default.
//   update  — it exists and the AI brought a different value. Shown as old -> new
//             and UNCHECKED, because silently replacing something Uri typed is
//             the failure this whole screen exists to prevent.
//   skip    — looks like something already there. Unchecked.
// A site whose name matches several directory entries (same place, different
// years) is never guessed at: it is flagged and left for him to decide.
let previewPlan = null

// "Duplicate" for a task means the wording is the same or near enough — that is
// the case that actually happens, pasting a WhatsApp thread that overlaps one
// pasted earlier. Dice coefficient over character bigrams, which tolerates a
// changed word or ending without matching two genuinely different asks.

    for(let i = 0; i < str.length - 1; i++) { const g = str.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1) }
    return m }
  const ga = grams(x), gb = grams(y)
  let shared = 0
  ga.forEach((n, g) => { if(gb.has(g)) shared += Math.min(n, gb.get(g)) })

}

}

  openTasks().forEach(t => {
    const sim = textSimilarity(text, t.text)
    if(sim >= DUP_THRESHOLD && (!best || sim > best.sim)) best = {task: t, sim}
  })
  return best
}
// Which incoming fields actually differ from what is already stored. An empty
// incoming value is never a difference — it must not be able to erase anything.
function fieldDiffs(existing, incoming, skipKeys) {
  const out = []
  Object.keys(incoming || {}).forEach(k => {
    if((skipKeys || []).indexOf(k) >= 0) return
    const nv = incoming[k]
    if(nv === null || nv === undefined || nv === '') return
    const ov = existing ? existing[k] : undefined
    if(String(ov == null ? '' : ov) !== String(nv)) out.push({field: k, from: ov == null ? '' : String(ov), to: String(nv)})
  })
  return out
}
function buildPreview(p, sourceText) {
  const items = []
  let n = 0
  const add = o => { items.push({key: 'p' + (n++), checked: o.group === 'new', ...o}) }   // an explicit `checked` in o overrides the default

  ;['now','today','later'].forEach(bucket => {
    ;(p[bucket] || []).forEach(t => {
      if(!t || !t.text) return
      const dup = findDuplicateTask(t.text)
      add({kind: 'task', bucket, payload: t, title: t.text,
           sub: [t.site, t.assignee, t.time].filter(Boolean).join(' · '),
           group: dup ? 'skip' : 'new',
           because: dup ? tr('prev_same_as').replace('{t}', dup.task.text) : ''})
    })
  })

  ;(p.sites || []).forEach(site => {
    if(!site || !site.name) return
    const existing = state.sites.find(x => x.name === site.name)
    if(existing) {
      const diffs = fieldDiffs(existing, site, ['name'])
      add({kind: 'site', payload: site, title: site.name, diffs,
           group: diffs.length ? 'update' : 'skip',
           because: diffs.length ? '' : tr('prev_already_same')})
      return
    }
    const dir = (typeof findInSiteDirectory === 'function') ? findInSiteDirectory(site.name) : []
    if(dir.length > 1) {
      // It belongs in "new" — it does not exist yet, and ticking it creates it
      // under exactly the name the AI gave, touching no directory entry. What it
      // must not be is ticked by default, because which of the matches he means
      // is precisely what nobody here knows.
      add({kind: 'site', payload: site, title: site.name, group: 'new', needsChoice: true, checked: false,
           because: tr('prev_many_matches').replace('{n}', dir.length)
                    .replace('{list}', dir.slice(0, 3).map(d => d.name + (d.year ? ' (' + d.year + ')' : '')).join(' · '))})
      return
    }
    add({kind: 'site', payload: site, title: site.name, group: 'new',
         because: dir.length === 1 ? tr('prev_dir_match').replace('{n}', dir[0].name) : ''})
  })

  ;(p.people || []).forEach(person => {
    if(!person || !person.name) return
    const existing = (state.people || []).find(x => x.name === person.name)
    if(!existing) { add({kind: 'person', payload: person, title: person.name, group: 'new'}); return }
    const diffs = fieldDiffs(existing, person, ['name'])
    add({kind: 'person', payload: person, title: person.name, diffs,
         group: diffs.length ? 'update' : 'skip',
         because: diffs.length ? '' : tr('prev_already_same')})
  })

  ;(p.events || []).forEach(ev => {
    if(!ev || !ev.title) return
    const same = (state.events || []).find(e =>
      normForMatch(e.title) === normForMatch(ev.title) && (e.date || '') === (ev.date || getToday()))
    add({kind: 'event', payload: ev, title: ev.title,
         sub: [ev.date || getToday(), ev.time].filter(Boolean).join(' · '),
         group: same ? 'skip' : 'new',
         because: same ? tr('prev_already_in_calendar') : ''})
  })

  if(p.focus && p.focus !== state.focus) {
    add({kind: 'focus', payload: p.focus, title: p.focus,
         group: state.focus ? 'update' : 'new',
         diffs: state.focus ? [{field: 'focus', from: state.focus, to: p.focus}] : []})
  }
  return {items, raw: p, text: sourceText || ''}
}

// Applies only what is ticked, in a single setState — so either the whole
// approved set lands or nothing does. Anything unticked is simply dropped;
// it was never written anywhere to begin with.
function confirmPreview() {
  if(!previewPlan) return
  const on = previewPlan.items.filter(i => i.checked)
  if(!on.length) { cancelPreview(); return }
  const ts = Date.now(), today = getToday()
  let seq = 0
  const patch = {}

  const byBucket = {now: [], today: [], later: []}
  on.filter(i => i.kind === 'task').forEach(i => {
    byBucket[i.bucket].push({...i.payload, id: 'p' + ts + (seq++), done: false})
  })
  if(byBucket.now.length || byBucket.today.length || byBucket.later.length) {
    patch.tasks = {now: [...state.tasks.now, ...byBucket.now],
                   today: [...state.tasks.today, ...byBucket.today],
                   later: [...state.tasks.later, ...byBucket.later]}
  }

  const sites = on.filter(i => i.kind === 'site').map(i => i.payload)
  if(sites.length) {
    const known = new Set(state.sites.map(x => x.name))
    patch.sites = mergeSites(state.sites, sites.map(x => known.has(x.name) ? x : {...x, createdAt: new Date().toISOString()}))
  }
  const people = on.filter(i => i.kind === 'person').map(i => i.payload)
  if(people.length) patch.people = mergePeople(state.people || [], people)

  const evs = on.filter(i => i.kind === 'event').map((i, k) => ({
    id: 'ev' + ts + k, title: i.payload.title || '', date: i.payload.date || today,
    time: i.payload.time || '', note: i.payload.note || '', recurring: i.payload.recurring || '',
    notify: i.payload.notify || '60', color: 'var(--bamboo)', site: i.payload.site || null}))
  if(evs.length) patch.events = [...(state.events || []), ...evs]

  const focusItem = on.find(i => i.kind === 'focus')
  if(focusItem) { patch.focus = focusItem.payload; patch.focusDate = today }

  setState(patch)

  sites.filter(x => !state.sites.some(e => e.name === x.name))
    .forEach(x => logEvent('site_created', {name: x.name, contractor: x.contractor || null, status: x.status || 'open'}))
  const p2 = previewPlan.raw
  if(p2 && p2.moodGuess && MOOD_LIB[p2.moodGuess]) logMood(p2.moodGuess, 'auto')
  logEvent('analysis_applied', {applied: on.length, offered: previewPlan.items.length})

  previewPlan = null
  playFx('add'); haptic('success')
  navigateTo('home')
}

// Images are downsized client-side before being stored (localStorage has a
// hard size ceiling per origin), so a phone photo becomes a small JPEG
// thumbnail rather than a multi-MB original.
let pendingPhoto = null
function readImageAsThumbnail(file, cb) {
  const reader = new FileReader()
  reader.onload = function(e) {
    const img = new Image()
    img.onload = function() {
      const maxW = 720
      const scale = Math.min(1, maxW / img.width)
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale)
      const canvas = document.createElement('canvas')
      canvas.width = w; canvas.height = h
      canvas.getContext('2d').drawImage(img, 0, 0, w, h)
      cb(canvas.toDataURL('image/jpeg', 0.6))
    }
    img.src = e.target.result
  }
  reader.readAsDataURL(file)
}
function handlePhotoPick(input, previewId) {
  const f = input.files && input.files[0]; if(!f) return
  readImageAsThumbnail(f, function(dataUrl) {
    pendingPhoto = dataUrl
    renderPhotoPreview(previewId)
  })
}
function removePendingPhoto(previewId) {
  pendingPhoto = null
  renderPhotoPreview(previewId)
}

function doAddTask() {
  const text = document.getElementById('add-task-text').value.trim()
  if(!text) return
  const context = document.getElementById('add-task-context').value || null
  const assignee = document.getElementById('add-task-assignee').value
  const color = document.getElementById('add-task-color').value
  const bucket = document.getElementById('add-task-bucket').value
  const note = document.getElementById('add-task-note').value.trim() || null
  const photo = pendingPhoto

  if(editingTaskId) {
    const id = editingTaskId
    const strip = arr => arr.filter(x=>x.id!==id)
    const original = [...state.tasks.now,...state.tasks.today,...state.tasks.later].find(x=>x.id===id) || {}
    const updated = {...original, text, assignee, color, context, note, photo}
    const next = {now:strip(state.tasks.now),today:strip(state.tasks.today),later:strip(state.tasks.later)}
    next[bucket] = [...next[bucket], updated]
    setState({tasks:next})
    editingTaskId = null
  } else {
    const task = {id:`m${Date.now()}`,text,assignee,color,done:false,site:null,context,note,photo}
    setState({tasks:{...state.tasks,[bucket]:[...state.tasks[bucket],task]}})
    playFx('add'); haptic('light')
  }
  closeModal()
}

// ── CHARTS (inline SVG, no dependencies) ──────────
// Quiet marks, one hue for magnitude, text in text colours, a legend or a
// list next to every chart so nothing depends on colour alone.
function niceCeil(v) {
  if(!(v > 0)) return 1
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p
}
function fmtPeso(n) { return '₱' + Math.round(n).toLocaleString() }
// Last N days of mood, one tile per day (the last mood logged that day),
// plus a legend with counts — the legend doubles as the table view.
function moodTrendHtml(days) {
  days = days || 30
  const moods = state.moods || []
  if(moods.length < 3) return ''
  const byDay = {}; moods.forEach(m => { byDay[m.date] = m.mood })
  const today = new Date(getToday() + 'T00:00:00')
  const W = 360, H = 22, gap = 2, w = (W - gap * (days - 1)) / days
  let rects = ''; const counts = {}
  for(let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i)
    const key = dateKey(d), mood = byDay[key], x = ((days - 1 - i) * (w + gap)).toFixed(2)
    if(mood && MOOD_LIB[mood]) { counts[mood] = (counts[mood] || 0) + 1
      rects += `<rect class="mood-day" x="${x}" y="2" width="${w.toFixed(2)}" height="${H - 4}" rx="3" fill="${MOOD_LIB[mood].color}"><title>${key} · ${tr('mood_'+mood)}</title></rect>`
    } else rects += `<rect x="${x}" y="${H / 2 - 1}" width="${w.toFixed(2)}" height="2" rx="1" fill="var(--line)"/>`
  }
  const legend = MOOD_ORDER.filter(m => counts[m]).map(m => `<span style="display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sm);color:var(--t2)"><span style="width:8px;height:8px;border-radius:50%;background:${MOOD_LIB[m].color}"></span>${icon(MOOD_LIB[m].icon)} ${tr('mood_'+m)} · ${counts[m]}</span>`).join('')
  return `<div id="mood-trend">
    <div class="panel-label" style="margin-bottom:6px">${icon('bar-chart-2')} ${tr('trend_title').replace('{n}', days)}</div>
    <div style="display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--t3);margin-bottom:4px;direction:ltr"><span>${tr('trend_start').replace('{n}', days)}</span><span>${tr('trend_today')}</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;direction:ltr" role="img" aria-label="${tr('trend_aria')}">${rects}</svg>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">${legend}</div>
  </div>`
}
function monthKeyOffset(n) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') }
function pettyCashForMonth(mk) { return (state.pettyCash || []).filter(e => (e.date || '').slice(0, 7) === mk) }
// Six months of totals as thin columns; the current month is the emphasis,
// earlier months recede. Value labels only on the current and the highest.
function pettyCashMonthChartHtml() {
  const months = 6
  const rows = []
  for(let i = months - 1; i >= 0; i--) { const mk = monthKeyOffset(i); rows.push({mk, total: pettyCashForMonth(mk).reduce((s, e) => s + (parseFloat(e.amount) || 0), 0)}) }
  if(!rows.some(r => r.total > 0)) return ''
  const W = 360, H = 130, padT = 16, padB = 18, top = niceCeil(Math.max(...rows.map(r => r.total)))
  const base = H - padB, plotH = base - padT
  const band = W / months, barW = Math.min(24, band * 0.5)
  const maxIdx = rows.reduce((bi, r, i) => r.total > rows[bi].total ? i : bi, 0)
  const y = v => base - (v / top) * plotH
  const grid = [0.5, 1].map(f => `<line x1="0" y1="${y(top * f).toFixed(1)}" x2="${W}" y2="${y(top * f).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="2" y="${(y(top * f) - 3).toFixed(1)}" font-size="9" fill="var(--t3)">${fmtPeso(top * f)}</text>`).join('')
  const bars = rows.map((r, i) => {
    const x = band * i + (band - barW) / 2, h = Math.max(r.total > 0 ? 3 : 0, (r.total / top) * plotH), yy = base - h
    const rx = Math.min(4, h / 2), cur = i === months - 1
    const path = h > 0 ? `<path class="cash-bar" d="M${x} ${base} V${yy + rx} a${rx} ${rx} 0 0 1 ${rx} -${rx} H${x + barW - rx} a${rx} ${rx} 0 0 1 ${rx} ${rx} V${base} Z" fill="var(--gold)" opacity="${cur ? 1 : 0.45}"><title>${r.mk} · ${fmtPeso(r.total)}</title></path>` : ''
    const label = (cur || i === maxIdx) && r.total > 0 ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(yy - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--t1)">${fmtPeso(r.total)}</text>` : ''
    const m = parseInt(r.mk.slice(5), 10) - 1
    return path + label + `<text x="${(band * i + band / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="10" fill="${cur ? 'var(--t1)' : 'var(--t3)'}" font-weight="${cur ? 700 : 400}">${MONTHS_HE[m].slice(0, 4)}</text>`
  }).join('')
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;direction:ltr" role="img" aria-label="${tr('petty_by_month')}">${grid}<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--t4)" stroke-width="1"/>${bars}</svg>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;margin-top:8px;font-size:var(--fs-xs);color:var(--t3)">${rows.map(r => `<span>${r.mk} · <b style="color:var(--t2)">${fmtPeso(r.total)}</b></span>`).join('')}</div>`
}
// This month's spend by vendor (the closest thing to a category the data has).
function pettyCashVendorHtml() {
  const byV = {}
  pettyCashThisMonth().forEach(e => { const k = (e.vendor || '—').trim(); byV[k] = (byV[k] || 0) + (parseFloat(e.amount) || 0) })
  const rows = Object.keys(byV).map(k => ({k, v: byV[k]})).sort((a, b) => b.v - a.v)
  if(!rows.length) return ''
  const top = rows.slice(0, 5), rest = rows.slice(5).reduce((s, r) => s + r.v, 0)
  if(rest > 0) top.push({k: tr('petty_other').replace('{n}', rows.length - 5), v: rest})
  const max = Math.max(...top.map(r => r.v))
  return top.map(r => `<div class="cash-vendor" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="width:120px;flex-shrink:0;font-size:var(--fs-sm);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.k)}">${esc(r.k)}</span>
      <div style="flex:1;height:8px;background:var(--surface-2);border-radius:var(--radius-pill);overflow:hidden;direction:ltr"><div style="width:${(r.v / max * 100).toFixed(1)}%;height:100%;background:var(--gold);border-radius:var(--radius-pill)"></div></div>
      <span style="min-width:56px;text-align:left;font-size:var(--fs-sm);color:var(--t1);font-weight:600;direction:ltr">${fmtPeso(r.v)}</span>
    </div>`).join('')
}

function addPettyCashEntry() {
  const date = document.getElementById('pc-date').value || getToday()
  const vendor = document.getElementById('pc-vendor').value.trim()
  const amount = document.getElementById('pc-amount').value
  const note = document.getElementById('pc-note').value.trim()
  if(!vendor || !amount) { alert('נא למלא ספק וסכום'); return }
  const entry = {id: 'pc_'+Date.now(), date, vendor, amount, note}
  setState({pettyCash: [...(state.pettyCash||[]), entry]})

}
function deletePettyCashEntry(id) {
  setState({pettyCash: (state.pettyCash||[]).filter(function(e){ return e.id!==id })})

function copyPettyCashSummary() {
  const entries = pettyCashThisMonth().slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||'') })

  const lines = entries.map(function(e){ return e.date+' | '+(e.vendor||'-')+' | ₱'+(parseFloat(e.amount)||0).toLocaleString()+(e.note?' | '+e.note:'') })
  const text = 'ליקוידציה - '+currentMonthKey()+'\n'+lines.join('\n')+'\n\nסה"כ: ₱'+total.toLocaleString()

async function runSpisDiagnosis() {
  const desc = (document.getElementById('diagnose-desc') || {}).value || ''
  if(!desc.trim() && !diagnosePhotos.length) { alert('תאר את התקלה או צרף תמונה'); return }
  diagnoseBusy = true
  diagnoseResult = null
  showSpisModal()
  const sys = 'אתה עוזר טכני לאורי, מנהל אזורי SPIS בפיליפינים, לאבחון תקלות בשטח במערכות השקיה סולאריות. ' +
    'התבסס קודם כל על הידע האמיתי הבא ממדריכי היצרן (VASCO Solar/Nastec, Caprari, Rovatti, SAER, ופאנלים סולאריים) - זה המקור העיקרי והאמין ביותר שלך:\n\n' +
    buildSpisKnowledgeContext() +
    '\n\nאם התיאור או התמונה לא מתאימים לשום דבר ברשימה - השתמש בידע הנדסי כללי שלך על מערכות שאיבה סולאריות, אבל ציין בבירור שזו הערכה כללית ולא מתוך מדריך ספציפי. אם יש תמונה - תסתכל עליה בעיון (קודי שגיאה על מסך, סימני שריפה/חלודה, מצב חיווט וכו׳). תן תשובה מסודרת וממוקדת בעברית: מה כנראה הבעיה, ומה לבדוק/לנסות קודם. אל תמציא קוד שגיאה שלא ראית בפועל.'
  const content = []
  if(desc.trim()) content.push({type:'text', text: desc.trim()})
  diagnosePhotos.forEach(function(p){
    const parts = p.split(',')
    const mediaType = (parts[0].match(/data:(.*?);/) || [,'image/jpeg'])[1]
    content.push({type:'image', source:{type:'base64', media_type: mediaType, data: parts[1]}})
  })
  try {
    const reply = await callClaude([{role:'user', content}], sys)
    diagnoseResult = reply.trim()
  } catch(e) {
    diagnoseResult = '✕ שגיאה: ' + e.message
  }
  diagnoseBusy = false
  showSpisModal()
}

// ── SITE SEARCH ───────────────────────────────────
// One box that looks through everything written on a site — name, province,
// municipality, the issue (where codes like "A08" live), contractor, REMO,
// year, case notes, and any pump/manufacturer field the Monday directory
// carries — plus its status in Hebrew and English. Every word typed has to
// match somewhere; a word of 4+ letters also matches with one typo (two from
// 7 letters). The status and province chips narrow the same list, and the
// Monday directory is searched too, below the sites Uri tracks.
const SITE_STATUS_CHIPS = [['all','הכל'],['open','פתוחים'],['stuck','תקועים'],['pending','ממתינים'],['resolved','נפתרו']]
const SITE_PROVINCES = [['isabela','Isabela'],['cagayan','Cagayan'],['nueva vizcaya','Nueva Vizcaya'],['car','CAR']]
const CAR_PROVINCES = ['car','cordillera','abra','apayao','benguet','ifugao','kalinga','mountain province']
const SITE_STATUS_WORDS = {open:'פתוח open', pending:'ממתין waiting pending', resolved:'נפתר done resolved'}
const SITE_SEARCH_SKIP = {id:1, photo:1, casePhotos:1, mondayLink:1, location:1, createdAt:1, stuckSince:1, status:1, updated:1}
let siteQuery = '', siteProvinces = [], siteSearchTimer = null
function normSearch(str) {
  return String(str == null ? '' : str).toLowerCase().normalize('NFKD')
    .replace(/[̀-֑ͯ-ׇ]/g, '')
    .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ')
    .replace(/[^\p{L}\p{N}]+/gu, ' ').trim()
}
function searchTokens(q) { return normSearch(q).split(' ').filter(Boolean) }
// optimal-string-alignment distance, stopping early once it passes max
function editDistance(a, b, max) {
  if(Math.abs(a.length - b.length) > max) return max + 1
  let prev2 = null, prev = Array.from({length: b.length + 1}, (_, j) => j)
  for(let i = 1; i <= a.length; i++) {
    const cur = [i]; let rowMin = i
    for(let j = 1; j <= b.length; j++) {
      let v = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1))
      if(prev2 && i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) v = Math.min(v, prev2[j-2] + 1)
      cur.push(v); if(v < rowMin) rowMin = v
    }
    if(rowMin > max) return max + 1
    prev2 = prev; prev = cur
  }
  return prev[b.length]
}
// does one typed word match one word of the text? 2 = contains it, 1 = a typo away, 0 = no
function wordMatch(tok, word) {
  if(word.includes(tok)) return 2
  if(tok.length < 4) return 0
  const max = tok.length >= 7 ? 2 : 1
  if(editDistance(tok, word, max) <= max) return 1
  if(word.length > tok.length && editDistance(tok, word.slice(0, tok.length), max) <= max) return 1
  return 0
}
function siteHaystack(o) {
  const parts = []
  Object.keys(o).forEach(k => { if(!SITE_SEARCH_SKIP[k] && (typeof o[k] === 'string' || typeof o[k] === 'number')) parts.push(o[k]) })
  if(o.status) parts.push(SITE_STATUS_WORDS[o.status] || o.status)
  if(o.stuckSince) parts.push('תקוע stuck')
  return normSearch(parts.join(' ')).split(' ').filter(Boolean)
}
function matchesQuery(o, toks) {
  if(!toks.length) return true
  const words = siteHaystack(o)
  return toks.every(t => words.some(w => wordMatch(t, w)))
}
function matchesProvince(o, provs) {
  if(!provs || !provs.length) return true
  return provs.some(prov => inProvince(o, prov))
}
function inProvince(o, prov) {
  const p = normSearch((o.province || '') + ' ' + (o.municipality || ''))

// ── SITES MAP (dependency-free, works offline) ────
// A pin map drawn as inline SVG from the coordinates already stored on each
// site — no tile server, so it works with no signal in the field. Accepts
// decimal "16.9754, 121.8107" or DMS like 18°17'50.89"N 121°24'1.57"E.
let sitesMapOn = false, mapSelected = null

function selectMapSite(name) { mapSelected = (mapSelected === name) ? null : name; renderSites() }
function parseLatLon(str) {
  if(!str) return null
  const s = String(str).trim()
  const dec = s.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/)
  if(dec) { const lat = +dec[1], lon = +dec[2]; return (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) ? {lat, lon} : null }
  function collect(re, hemFirst) {
    re.lastIndex = 0
    const parts = []; let d
    while((d = re.exec(s))) {
      const hem = hemFirst ? d[1] : d[4]
      const deg = hemFirst ? d[2] : d[1]
      const min = hemFirst ? d[3] : d[2]
      const sec = hemFirst ? d[4] : d[3]
      parts.push({v: (+deg) + (+min) / 60 + ((+sec) || 0) / 3600, h: hem.toUpperCase()})
    }
    return parts
  }
  // Try "hemisphere after the numbers" (16°58'34.49"N) first, then fall back
  // to "hemisphere before the numbers" (N 16°58'34.49") — Uri's actual format.
  let parts = collect(/(\d{1,3})[°\s]+(\d{1,2})['′\s]+(\d{1,2}(?:\.\d+)?)?["″\s]*([NSEW])/gi, false)
  if(parts.length < 2) parts = collect(/([NSEW])\s*(\d{1,3})[°\s]+(\d{1,2})['′\s]+(\d{1,2}(?:\.\d+)?)?["″\s]*/gi, true)
  if(parts.length < 2) return null
  let lat = null, lon = null
  parts.forEach(pt => { if(pt.h === 'N' || pt.h === 'S') lat = pt.h === 'S' ? -pt.v : pt.v; else lon = pt.h === 'W' ? -pt.v : pt.v })
  return (lat != null && lon != null) ? {lat, lon} : null
}
function sitesMapHtml(sites) {
  const pts = sites.map(s => ({s, p: parseLatLon(s.location)})).filter(x => x.p)
  const missing = sites.filter(s => !parseLatLon(s.location))
  if(!pts.length) return `<div class="card" style="text-align:center;color:var(--t3);font-size:var(--fs-base);padding:24px 16px;line-height:1.6">${icon('map')} אין עדיין אתרים עם קואורדינטות ברשימה הזו.<br>הוסף מיקום (עשרוני או DMS) בעריכת האתר.</div>`
  const W = 400, H = 300, PAD = 30
  let minLat = Math.min(...pts.map(x => x.p.lat)), maxLat = Math.max(...pts.map(x => x.p.lat))
  let minLon = Math.min(...pts.map(x => x.p.lon)), maxLon = Math.max(...pts.map(x => x.p.lon))
  if(maxLat - minLat < 0.02) { minLat -= 0.05; maxLat += 0.05 }
  if(maxLon - minLon < 0.02) { minLon -= 0.05; maxLon += 0.05 }
  const kx = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180)   // equirectangular with latitude correction
  const spanX = (maxLon - minLon) * kx, spanY = maxLat - minLat
  const scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY)
  const ox = (W - spanX * scale) / 2, oy = (H - spanY * scale) / 2
  const X = lon => ox + (lon - minLon) * kx * scale, Y = lat => H - (oy + (lat - minLat) * scale)
  const kmPerPx = 111.32 / scale                     // 1° latitude ≈ 111.32 km
  const barKm = [0.5, 1, 2, 5, 10, 20, 50, 100].find(k => k / kmPerPx >= 50) || 100
  const barPx = barKm / kmPerPx
  let grid = ''
  for(let x = 60; x < W; x += 60) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${H}"/>`
  for(let y = 60; y < H; y += 60) grid += `<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`
  const pins = pts.slice().sort((a, b) => b.p.lat - a.p.lat).map(({s, p}) => {
    const x = X(p.lon).toFixed(1), y = Y(p.lat).toFixed(1)
    const col = STATUS_HEX[s.status] || 'var(--t3)'
    const sel = mapSelected === s.name
    return `<g class="map-pin" onclick="selectMapSite(${jsArg(s.name)})" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="16" fill="transparent"/>
      ${sel ? `<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="var(--gold)" stroke-width="2"/>` : ''}
      <circle cx="${x}" cy="${y}" r="9" fill="var(--surface)"/>
      <circle cx="${x}" cy="${y}" r="7" fill="${col}"/>
      ${currentTheme === 'jungle' ? `<circle cx="${(+x) - 2.4}" cy="${(+y) - 2.6}" r="2.2" fill="#fff" opacity=".85"/>` : ''}
      ${s.stuckSince ? `<circle cx="${(+x) + 7}" cy="${(+y) - 7}" r="4" fill="var(--stuck)" stroke="var(--surface)" stroke-width="1.5"/>` : ''}
      <text x="${x}" y="${(+y) + 22}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--t1)" stroke="var(--surface-3)" stroke-width="3" paint-order="stroke" style="font-family:inherit">${esc(s.name)}</text>
      <title>${esc(s.name)} · ${STATUS_LABEL[s.status] || esc(s.status)}${s.issue ? ' · ' + esc(s.issue) : ''}</title>
    </g>`
  }).join('')
  const selSite = mapSelected ? pts.find(x => x.s.name === mapSelected) : null
  const info = selSite ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)">
      <div style="min-width:0">
        <div style="font-size:var(--fs-base);font-weight:700;color:var(--t1)">${icon('map-pin')} ${esc(selSite.s.name)}</div>
        <div style="font-size:var(--fs-sm);color:var(--t2);margin-top:2px">${STATUS_LABEL[selSite.s.status] || ''}${selSite.s.issue ? ' · ' + esc(selSite.s.issue) : ''}${selSite.s.stuckSince ? ' · ' + stuckPhrase(daysStuck(selSite.s)) : ''}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <a href="${esc(mapsLinkFor(selSite.s.location))}" target="_blank" class="tag" style="text-decoration:none;color:var(--gold)">${icon('external-link')} ניווט</a>
        ${iconBtnHtml('showAddSite(' + jsArg(selSite.s.name) + ')', icon('edit'), '', 'edit')}
      </div>
    </div>` : ''
  return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--surface-3);direction:ltr" role="img" aria-label="מפת אתרים">
      <g stroke="var(--line)" stroke-width="1">${grid}</g>
      ${pins}
      <g transform="translate(${W - PAD - barPx}, ${H - 14})"><line x1="0" y1="0" x2="${barPx.toFixed(1)}" y2="0" stroke="var(--t2)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="var(--t2)" stroke-width="2"/><line x1="${barPx.toFixed(1)}" y1="-4" x2="${barPx.toFixed(1)}" y2="4" stroke="var(--t2)" stroke-width="2"/><text x="${(barPx / 2).toFixed(1)}" y="-6" text-anchor="middle" font-size="10" fill="var(--t2)">${barKm} ק״מ</text></g>
    </svg>
    ${info}
    <div style="display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--t3)">
      ${['open','pending','resolved'].map(st => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${STATUS_HEX[st]}"></span>${STATUS_LABEL[st]}</span>`).join('')}
      <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--stuck)"></span>תקוע</span>
      ${missing.length ? `<span style="margin-right:auto">${missing.length} בלי קואורדינטות</span>` : ''}
    </div>
  </div>`
}

function mapsLinkFor(loc) {
  if(!loc) return ''
  const coordMatch = loc.trim().match(/^-?\d{1,3}\.\d+\s*,\s*-?\d{1,3}\.\d+$/)
  return coordMatch
    ? 'https://www.google.com/maps?q=' + encodeURIComponent(loc.trim())
    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc.trim())
}

const STUCK_ALERT_DAYS = 5
let TAO_CANVAS = {ring:'#b8860b', track:'rgba(196,146,42,0.15)'}   // canvas ignores var(); refreshed by applyTheme()
let STATUS_HEX = {open:'#ef4444',pending:'#f59e0b',resolved:'#4ade80'}   // refreshed by applyTheme(); real hex because call sites append alpha

function stuckPhrase(n) {
  if(uiLang === 'en') return n === 1 ? 'stuck 1 day' : tr('rn_stuck_days').replace('{n}', n)
  if(n === 0) return 'תקוע מהיום'
  if(n === 1) return 'תקוע יום'
  if(n === 2) return 'תקוע יומיים'
  return tr('rn_stuck_days').replace('{n}', n)
}

// A site card shows only what is needed at a glance: the name, one line of
// where/what (province · issue, where codes like A08 live), one status tag,
// "stuck X days" when it applies, and the navigate icon. Tapping the card

// small ochre dot with its word, done a soft teal one, both quiet. Other

  if(!nachalLike()) return `<button ${base} wc" data-wc="${SITE_WC[st]||'rose'}" data-v="${v}" ${common}>${label}</button>`

}

async function suggestSiteFix(siteName, force) {
  const s = state.sites.find(x=>x.name===siteName)
  if(!s || (!s.issue && !s.caseDetail)) return
  const key = siteSuggestionKey(s)
  if(!force && s.aiSuggestion && s.aiSuggestionFor === key) return
  const box = document.getElementById('site-suggestion-box')
  if(box) box.innerHTML = `<div style="font-size:var(--fs-md);color:var(--t3)">...טוען הצעה</div>`
  const sys = 'אתה עוזר טכני לאורי, מנהל אזורי SPIS בפיליפינים, לאבחון תקלות בשטח במערכות השקיה סולאריות. ' +
    'התבסס קודם כל על מדריכי היצרן האמיתיים הבאים (VASCO Solar/Nastec, Caprari, Rovatti, SAER, ופאנלים סולאריים):\n\n' +
    buildSpisKnowledgeContext() +
    '\n\nאם התיאור לא מתאים לשום דבר ברשימה - השתמש בידע הנדסי כללי ותציין זאת. תן תשובה קצרה וממוקדת בעברית (3-5 שורות): הערכה של מה כנראה קורה, ומה לבדוק/לנסות קודם. אל תמציא קוד שגיאה שלא נאמר.'
  const content = []
  const text = 'אתר: ' + s.name + (s.province?(' ('+s.province+')'):'') + '\nבעיה: ' + (s.issue||'-') + (s.caseDetail?('\nתיאור מקרה: '+s.caseDetail):'')
  content.push({type:'text', text})
  ;(s.casePhotos||[]).forEach(function(p){
    const parts = p.split(',')
    const mediaType = (parts[0].match(/data:(.*?);/) || [,'image/jpeg'])[1]
    content.push({type:'image', source:{type:'base64', media_type: mediaType, data: parts[1]}})
  })
  try {
    const reply = await callClaude([{role:'user', content}], sys)
    const trimmed = reply.trim()
    setState({sites: state.sites.map(function(x){ return x.name===siteName ? Object.assign({}, x, {aiSuggestion: trimmed, aiSuggestionFor: key}) : x })})
    const boxNow = document.getElementById('site-suggestion-box')
    if(boxNow) {
      boxNow.style.textAlign = 'left'
      boxNow.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:var(--fs-md);font-weight:700;color:var(--gold)">${icon('search')} הצעת Fieldy</span>
        <button onclick="suggestSiteFix(${jsArg(siteName)}, true)" style="background:none;color:var(--t3);font-size:var(--fs-sm)">${icon('refresh')} רענן</button>
      </div>
      <div style="font-size:var(--fs-base);color:var(--t1);line-height:1.6;white-space:pre-line">${esc(trimmed)}</div>`
    }
  } catch(e) {
    if(box) box.innerHTML = `<div style="font-size:var(--fs-md);color:var(--red)">✕ ${esc(e.message)}</div>`
  }
}

function doAddSite() {

  if(!name) return
  const site = {
    name,
    province:document.getElementById('add-site-province').value,
    issue:document.getElementById('add-site-issue').value,
    caseDetail:document.getElementById('add-site-case').value.trim(),
    casePhotos:siteCasePhotos.slice(),
    location:document.getElementById('add-site-location').value.trim(),
    mondayLink:document.getElementById('add-site-monday').value.trim(),
    remo:document.getElementById('add-site-remo').value.trim(),
    year:document.getElementById('add-site-year').value,
    contractor:document.getElementById('add-site-contractor').value,
    status:document.getElementById('add-site-status').value,
    photo:pendingPhoto
  }
  if(editingSiteName) {
    const prev = state.sites.find(x=>x.name===editingSiteName) || {}
    site.id = prev.id || Date.now()
    if(prev.aiSuggestion && siteSuggestionKey(prev) === siteSuggestionKey(site)) {
      site.aiSuggestion = prev.aiSuggestion
      site.aiSuggestionFor = prev.aiSuggestionFor
    }
    setState({sites:state.sites.map(x=>x.name===editingSiteName?site:x)})
    editingSiteName = null
  } else {
    site.id = Date.now()
    site.createdAt = new Date().toISOString()
    siteOpenKey = siteKey(site)
    setState({sites:[...state.sites, site]})
    logEvent('site_created', {name: site.name, contractor: site.contractor||null, status: site.status})
  }
  closeModal()
}

async function doAction(type) {
  document.getElementById('action-buttons').style.display='none'
  document.getElementById('action-loading').style.display='block'
  const prompts = {
    whatsapp:`Write a short WhatsApp message in English from Uri (Regional Manager, IAI Philippines) to ${actionCtx?.assignee||'team member'} about: ${actionCtx?.text}. Max 3 sentences, direct.`,
    email:`Write a professional email in English from Uri (Regional Manager, Innovative Agro Industry) about: ${actionCtx?.text}. Include subject line. Concise.`,
    monday:`Write a Monday.com task update in English for: ${actionCtx?.text}. Format: Status / Issue / Next Action / Owner.`
  }
  try {
    const result = await callClaude([{role:'user',content:prompts[type]}], withContext(null))
    document.getElementById('action-loading').style.display='none'
    document.getElementById('action-result').textContent=result
    document.getElementById('action-result-container').style.display='block'
  } catch(e) {
    document.getElementById('action-loading').style.display='none'
    document.getElementById('action-buttons').style.display='block'
    alert('שגיאה: ' + e.message)
  }
}

function copyResult() {
  const text = document.getElementById('action-result').textContent
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('action-copy-btn')
    btn.innerHTML=icon('check') + ' הועתק!'
    btn.style.background='var(--gold-deep)'
    setTimeout(()=>{btn.innerHTML=icon('clipboard') + ' העתק';btn.style.background='linear-gradient(135deg,var(--gold),var(--gold2))'},2000)
  })
}

function copyToClipboard(text, btnId) {
  if(!text) return
  navigator.clipboard.writeText(text).then(()=>{ flashBtn(document.getElementById(btnId), icon('check') + ' הועתק') })
}

function dedupeEvents() {
  const btn = document.getElementById('dedupe-btn')
  const allTasks = [...state.tasks.now,...state.tasks.today,...state.tasks.later]
  const norm = s => (s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'').trim()
  const taskTexts = new Set(allTasks.map(t=>norm(t.text)).filter(Boolean))
  const before = state.events.length
  const kept = state.events.filter(e => !taskTexts.has(norm(e.title)))
  const removed = before - kept.length
  setState({events:kept})
  flashBtn(btn, removed>0 ? `נוקו ${removed} כפילויות ${icon('check')}` : 'לא נמצאו כפילויות', 2500, 'נקה כפילויות')
}

async function forceRefreshApp() {
  const btn = document.getElementById('refresh-app-btn')
  if (btn) { btn.innerHTML = icon('hourglass') + ' מרענן...' }
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations()
      for (const r of regs) await r.unregister()
    }
    if ('caches' in window) {
      const keys = await caches.keys()
      for (const k of keys) await caches.delete(k)
    }
  } catch(e) { console.log('refresh cleanup error:', e) }
  location.href = location.pathname + '?v=' + Date.now()
}

// the backup also carries the river garden (kept in its own localStorage key,

function exportBackup() {

  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = 'fieldy-backup-' + getToday() + '.json'
  document.body.appendChild(a)
  a.click()

function importBackup(file) {
  if(!file) return
  const reader = new FileReader()
  reader.onload = function(e) {
    var imported
    try { imported = JSON.parse(e.target.result) }
    catch(err) {
      alert('הקובץ לא נטען — זה לא קובץ JSON תקין (' + err.message + ').\nהנתונים הנוכחיים לא שונו.')
      return
    }
    var gardenIn = imported && typeof imported === 'object' ? imported.gardenBackup : null
    if(imported && typeof imported === 'object') delete imported.gardenBackup
    var problems = validateState(imported)
    if(problems.length) {
      console.error('Fieldy: backup import rejected —', problems)
      alert('הקובץ לא נטען — המבנה לא תואם לגיבוי של Fieldy:\n• ' + problems.join('\n• ') + '\n\nהנתונים הנוכחיים לא שונו.')
      return
    }
    if(!confirm('זה יחליף את כל הנתונים הנוכחיים באפליקציה בנתונים מהקובץ. להמשיך?')) return
    state = applyStateDefaults(imported)
    save()
    // an older backup has no garden: the current one is kept as it is
    if(gardenIn && gardenIn.v === 1 && gardenIn.items && typeof gardenIn.items === 'object' && Array.isArray(gardenIn.cairn)) { garden = gardenIn; saveGarden() }
    alert('הנתונים נטענו בהצלחה ✓')
    refreshBadges()
    renderCurrentScreen()
  }
  reader.readAsText(file)
}

// ── SITE DIRECTORY (from Monday.com export) ───────
// A reference table of known sites (name, province, coordinates, contractor,
// REMO id) imported once from an exported spreadsheet, used to auto-fill new
// site entries and to give Ask Fieldy answers about sites Uri hasn't
// manually added to Fieldy yet. This merges additively — it never touches
// state.sites (the sites Uri is actually tracking day to day).
function importSiteDirectory(file) {
  if(!file) return
  const reader = new FileReader()
  reader.onload = function(e) {
    var imported
    try { imported = JSON.parse(e.target.result) }
    catch(err) {
      alert('הקובץ לא נטען — זה לא JSON תקין (' + err.message + ').')
      return
    }
    if(!Array.isArray(imported) || !imported.every(function(x){ return x && typeof x.name === 'string' })) {
      alert('הקובץ לא נטען — צריך להיות רשימה של אתרים, כל אחד עם לפחות שדה name.')
      return
    }
    // Key by name+year+siteNumber, not name alone — sites with the same name
    // in different contract years are different physical sites with
    // different coordinates, not the same site updated.
    const keyOf = function(s){ return [s.name, s.year||'', s.siteNumber||''].join('|') }
    const byKey = {}
    ;(state.siteDirectory || []).forEach(function(s){ byKey[keyOf(s)] = s })
    imported.forEach(function(s){ byKey[keyOf(s)] = s })
    setState({siteDirectory: Object.values(byKey)})
    alert('נטענו ' + imported.length + ' אתרים לספרייה ✓ (סה"כ בספרייה: ' + Object.values(byKey).length + ')')
  }
  reader.readAsText(file)
}

function showDirectoryDiffModal(siteName, match) {
  const site = state.sites.find(x => x.name === siteName)
  if(!site) return
  const fields = [
    ['province', 'מחוז'],
    ['location', 'מיקום / קואורדינטות'],
    ['contractor', 'קבלן'],
    ['remo', 'מספר Remo'],
    ['year', 'שנת חוזה'],
  ]
  const rows = fields.map(function(f){
    const key = f[0], label = f[1]
    const current = site[key] || ''
    const proposed = key === 'year' ? String(match.year || '') : (match[key] || '')
    if(!proposed || String(proposed) === String(current)) return ''
    const differs = current && String(current) !== String(proposed)
    return `<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer">
      <input type="checkbox" class="dir-diff-check" data-field="${key}" data-value="${esc(proposed)}" ${differs ? '' : 'checked'} style="width:18px;height:18px;accent-color:var(--gold);margin-top:2px;flex-shrink:0"/>
      <div style="flex:1">
        <div style="font-size:var(--fs-sm);color:var(--t2)">${label}</div>
        ${differs ? `<div style="font-size:var(--fs-base);color:var(--red);text-decoration:line-through">${esc(current)}</div>` : ''}
        <div style="font-size:var(--fs-base);color:var(--t1);font-weight:600">${esc(String(proposed))}</div>
      </div>
    </label>`
  }).join('')
  window.__dirDiffSite = siteName
  openModal(`
    <div style="font-size:var(--fs-xl);font-weight:700;margin-bottom:6px">${icon('search')} התאמה מהספרייה</div>
    <div style="font-size:var(--fs-base);color:var(--t2);margin-bottom:4px">${esc(match.name)}</div>
    <div style="font-size:var(--fs-sm);color:var(--t3);margin-bottom:14px">שנה בספרייה: ${esc(match.year||'-')} · סמן מה לעדכן. שדות שכבר שונים מסומנים באדום — בטל סימון אם אתה לא רוצה לדרוס אותם.</div>
    ${rows || `<div style="text-align:center;color:var(--t3);font-size:var(--fs-base);padding:16px 0">אין הבדלים — האתר כבר תואם את הספרייה.</div>`}
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-primary" style="flex:1" onclick="applyDirectoryDiff()">עדכן אתר</button>
      <button class="btn-secondary" onclick="showAddSite(${jsArg(siteName)})">ביטול</button>
    </div>
  `)
}
function applyDirectoryDiff() {
  const siteName = window.__dirDiffSite
  const checks = document.querySelectorAll('.dir-diff-check:checked')
  const patch = {}
  checks.forEach(function(c){ patch[c.getAttribute('data-field')] = c.getAttribute('data-value') })
  if(Object.keys(patch).length) {
    setState({sites: state.sites.map(function(x){ return x.name === siteName ? Object.assign({}, x, patch) : x })})
  }
  showAddSite(siteName)
}
function findInSiteDirectory(name) {
  if(!name || !(state.siteDirectory || []).length) return []
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9א-ת]/g, '')
  const target = norm(name)
  if(!target) return []
  return state.siteDirectory.filter(function(s){
    const n = norm(s.name)
    return n === target || n.includes(target) || target.includes(n)
  })
}
function autofillFromDirectory() {
  if(editingSiteName) return
  const nameEl = document.getElementById('add-site-name')
  const hint = document.getElementById('directory-match-hint')
  if(!nameEl) return
  let matches = findInSiteDirectory(nameEl.value.trim())
  if(!matches.length) { if(hint) hint.style.display = 'none'; return }
  // Same name can be genuinely different sites in different contract years
  // (different coordinates) — never guess between them. If the year field
  // already narrows it to one, use that; otherwise ask instead of autofilling.
  const yearEl = document.getElementById('add-site-year')
  if(matches.length > 1 && yearEl && yearEl.value) {
    const narrowed = matches.filter(function(m){ return String(m.year) === String(yearEl.value) })
    if(narrowed.length) matches = narrowed
  }
  if(matches.length > 1) {
    if(hint) { hint.style.display = 'block'; hint.innerHTML = icon('alert-triangle') + ' ' + matches.length + ' אתרים בשם דומה נמצאו בשנים שונות (מיקומים שונים!) — בחר שנת חוזה כדי לצמצם, לא מילאתי אוטומטית' }
    return
  }
  const match = matches[0]
  const setIfEmpty = function(id, val){ const el = document.getElementById(id); if(el && !el.value && val) el.value = val }
  setIfEmpty('add-site-province', match.province)
  setIfEmpty('add-site-location', match.location)
  setIfEmpty('add-site-remo', match.remo)
  const contractorEl = document.getElementById('add-site-contractor')
  if(contractorEl && !contractorEl.value && (match.contractor === 'asc' || match.contractor === '11-16')) contractorEl.value = match.contractor
  if(yearEl && !yearEl.value && match.year) yearEl.value = String(match.year)
  if(hint) { hint.style.display = 'block'; hint.innerHTML = icon('check') + ' נמצא ב-Monday — פרטים מולאו אוטומטית' }
}

async function askFieldy() {
  const input = document.getElementById('ask-fieldy-input')
  const btn = document.getElementById('ask-fieldy-btn')
  const answerEl = document.getElementById('ask-fieldy-answer')
  const mapsWrap = document.getElementById('ask-fieldy-maps-wrap')
  const question = input.value.trim()
  if(!question) return
  btn.textContent = 'חושב...'
  btn.disabled = true
  answerEl.innerHTML = skeletonHtml(3, 'עובר על האתרים והמשימות שלך…')
  answerEl.style.display = 'block'
  if(mapsWrap) mapsWrap.innerHTML = ''
  try {
    const openSites = state.sites.filter(s=>s.status!=='resolved')
    const siteLines = openSites.map(s=>{
      let l = '- '+s.name+(s.province?' ('+s.province+')':'')+' | סטטוס: '+(s.status||'?')+' | קבלן: '+(s.contractor||'-')+' | בעיה: '+(s.issue||'-')
      if(s.location) l += ' | מיקום: '+s.location
      return l
    }).join('\n')
    const taskLines = [...state.tasks.now,...state.tasks.today].filter(t=>!t.done).slice(0,25)
      .map(t=>'- ['+(t.color||'')+'] '+t.text+(t.site?(' (אתר: '+t.site+')'):'')).join('\n')
    const peopleLines = state.people.map(p=>'- '+p.name+' ('+(p.role||'')+(p.company?', '+p.company:'')+')'+(p.pending?(' — ממתין: '+p.pending):'')).join('\n')
    // Site-directory search stays local to Ask Fieldy (open-ended "what's near
    // X" questions) rather than folding into assistantContext() — every AI
    // call getting a keyword-matched slice of a few hundred Monday entries
    // would add real prompt weight for no benefit outside this one feature.
    // Date/mood are NOT rebuilt here: withContext() below already supplies
    // them (plus focus/stuck sites/leadership theme) to every AI call.
    const dirEntries = (state.siteDirectory || [])
    let dirMatches = []
    if(dirEntries.length) {
      const qWords = question.toLowerCase().split(/\s+/).filter(w => w.length >= 3)
      dirMatches = dirEntries.filter(function(s){
        const hay = (s.name + ' ' + (s.province||'') + ' ' + (s.municipality||'')).toLowerCase()
        return qWords.some(function(w){ return hay.includes(w) })
      })
      if(!dirMatches.length) dirMatches = dirEntries.slice(0, 80)
      dirMatches = dirMatches.slice(0, 150)
    }
    const dirLines = dirMatches.map(function(s){
      return '- ' + s.name + (s.province?' ('+s.province+(s.municipality?', '+s.municipality:'')+')':'') + (s.contractor?' | קבלן: '+s.contractor:'') + (s.remo?' | REMO: '+s.remo:'') + (s.year?' | שנה: '+s.year:'')
    }).join('\n')
    const context = 'אתרים פתוחים:\n'+(siteLines||'(אין)') +
      '\n\nמשימות פתוחות:\n'+(taskLines||'(אין)') +
      '\n\nאנשי קשר:\n'+(peopleLines||'(אין)') +
      (dirLines ? ('\n\nספריית אתרים מ-Monday (רפרנס בלבד, לא בהכרח פעילים כרגע — יכול להיות רשימה חלקית):\n'+dirLines) : '')
    const prompt = 'אתה עוזר תכנון שטח לאורי, מנהל אזורי (Region II, Cagayan Valley, פיליפינים, מתקיני SPIS). להלן המצב הנוכחי שלו:\n\n' + context +
      '\n\nהשאלה של אורי: ' + question +
      '\n\nענה בעברית, בקצרה ובאופן מעשי (2-5 משפטים, לא יותר). אם השאלה נוגעת לתכנון סיור/מסלול/סדר עדיפויות באזור מסוים, תבסס את התשובה רק על האתרים שברשימה למעלה שרלוונטיים לאזור שהוזכר, ותזכיר את שמות האתרים בדיוק כפי שהם מופיעים למעלה (כדי שאפשר יהיה לזהות אותם). הסבר בקצרה למה סדר כזה הגיוני (למשל דחיפות, קבלן משותף, בעיה פתוחה זמן רב). אם אין מספיק מידע לענות במדויק — תגיד את זה בכנות במקום לנחש.'
    const answer = (await callClaude([{role:'user', content: prompt + aiLangInstruction()}], withContext(null))).trim()
    answerEl.style.color = 'var(--t1)'
    answerEl.textContent = answer || 'לא התקבלה תשובה.'
    answerEl.style.display = 'block'
    // If the answer names specific sites that have a known location, offer a ready-made route
    const mentioned = openSites.filter(s => s.location && answer.indexOf(s.name) !== -1)
      .sort((a,b) => answer.indexOf(a.name) - answer.indexOf(b.name))
    if(mapsWrap && mentioned.length >= 1) {
      const pts = mentioned.map(s => encodeURIComponent(s.location))
      const dest = pts[pts.length-1]
      const wps = pts.slice(0,-1).join('|')
      let url = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving'
      if(wps) url += '&waypoints=' + wps
      mapsWrap.innerHTML = '<a href="'+url+'" target="_blank" style="display:inline-block;margin-top:10px;background:#1a73e8;color:#fff;padding:8px 14px;border-radius:var(--radius-sm);font-size:var(--fs-md);font-weight:600;text-decoration:none">' + icon('map-pin') + ' פתח מסלול בגוגל מפות ('+mentioned.length+' תחנות)</a>'
    }
  } catch(e) {
    answerEl.style.color = 'var(--red-dark)'
    answerEl.innerHTML = icon('x') + ' שגיאה: ' + esc(e.message)
    answerEl.style.display = 'block'
  }
  btn.textContent = 'שאל'
  btn.disabled = false
}

// ── PUSH NOTIFICATIONS ────────────────────────────
// Real phone notifications even when the app is closed. The browser gives
// this device a push subscription; it is stored on the Worker, whose cron
// sends the reminders (calendar events, stuck sites, the evening leadership
// reflection). sw.js shows them and opens the right screen on tap.
const NOTIFY_DEFAULTS = {events:true, stuckSites:true, leadership:true, stuckTime:'08:00', leadershipTime:'20:00'}
function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window }
let pushSub = undefined      // undefined = not checked yet · null = none on this device · object = active
// Thin wrappers around the browser APIs, kept separate so the flow can be
// exercised in tests without a real push service.
async function getPushSubscription() {
  if(!pushSupported()) return null
  const reg = await navigator.serviceWorker.ready
  return reg.pushManager.getSubscription()
}
async function createPushSubscription(publicKey) {
  const reg = await navigator.serviceWorker.ready
  return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: b64uToBytes(publicKey)})
}
function b64uToBytes(s) {
  s = String(s).replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4)
  const bin = atob(s), out = new Uint8Array(bin.length)
  for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i)
  return out
}
function deviceLabel() {
  const ua = navigator.userAgent
  const os = (/Android|iPhone|iPad|Windows|Mac OS/.exec(ua) || ['מכשיר'])[0]
  const br = /Chrome\/(\d+)/.test(ua) ? 'Chrome ' + RegExp.$1 : (/Safari/.test(ua) ? 'Safari' : 'דפדפן')
  return os + ' · ' + br
}

  let d = null; try { d = await r.json() } catch(e) {}
  if(!r.ok) throw new Error((d && d.error && (d.error.message || d.error)) || ('שגיאת שרת ' + r.status))
  return d
}

async function enablePush() {

    const perm = await Notification.requestPermission()
    if(perm !== 'granted') throw new Error('ההרשאה לא ניתנה')
    const vapid = await serverJson('GET', '/api/push/vapid-public-key')
    const sub = await createPushSubscription(vapid.key)
    await serverJson('POST', '/api/push/subscribe', {subscription: sub.toJSON ? sub.toJSON() : sub, device: deviceLabel()})
    if(!state.notifyPrefs) writeNotifyPrefs(NOTIFY_DEFAULTS)   // make sure the server knows this device's timezone
    await refreshPushCard()
    pushMsg(icon('check') + ' ההתראות הופעלו. לחץ "שלח בדיקה" כדי לוודא שהן מגיעות.')
  } catch(e) {

}
async function disablePush() {

    if(sub) { const endpoint = sub.endpoint; await sub.unsubscribe(); await serverJson('POST', '/api/push/unsubscribe', {endpoint}) }
    await refreshPushCard()

}
