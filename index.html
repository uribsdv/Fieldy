<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#f6efdb"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fieldy"/>
<link rel="manifest" href="/Fieldy/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Fieldy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;background:#f6efdb;color:#211d17;direction:rtl;height:100vh;overflow:hidden;font-weight:400;font-size:15px}
.font-display{font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-0.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea,select,input{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.hidden{display:none!important}
/* Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#f0e7cf;border-top:1px solid var(--line);display:grid;grid-template-columns: repeat(6, 1fr);align-items:start;padding:8px 0 24px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:6px 2px;cursor:pointer;background:none;border:none;position:relative;min-width:0}
.nav-icon{display:flex;align-items:center;justify-content:center;line-height:1}
.nav-label{font-size:10.5px;color:#948a7a;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-btn.active .nav-label{color:var(--gold);font-weight:700}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:#e8940c;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
/* Cards */
.card{background:#ffffff;border-radius:14px;padding:14px;margin-bottom:8px}
.card-red{border:1.5px solid #ef444460;background:#fdeaea}
.card-orange{border:1.5px solid #f59e0b60;background:#f59e0b18}
.card-green{border:1.5px solid #4ade8060;background:#4ade8018}
/* Buttons */
.btn-primary{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-size:16px;font-weight:700;display:block;border:none;cursor:pointer}
.btn-secondary{padding:14px 18px;border-radius:12px;border:1px solid #b0a68f;background:transparent;color:#6b6255;font-size:14px;cursor:pointer}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:#000d;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#ffffff;width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:22px 16px 40px;max-height:85vh;overflow-y:auto}
/* Form */
.form-label{font-size:14px;color:#6b6255;margin-bottom:4px;display:block}
.form-input{width:100%;background:#f0e7cf;border:1px solid #b0a68f;border-radius:10px;padding:11px 12px;color:#211d17;font-size:14px;outline:none;display:block;margin-bottom:10px;direction:rtl}
.form-select{width:100%;background:#f0e7cf;border:1px solid #b0a68f;border-radius:8px;padding:10px 8px;color:#211d17;font-size:14px;outline:none}
/* Tags */
.tag{font-size:14px;padding:3px 9px;border-radius:99px;background:#f0e7cf;color:#6b6255}
.tag-red{background:#ef444422;color:#ef4444;font-weight:600}
.tag-orange{background:#f59e0b22;color:#f59e0b;font-weight:600}
.tag-green{background:#4ade8022;color:#4ade80;font-weight:600}
.tag-status-open{background:#ef444422;color:#ef4444;font-weight:600}
.tag-status-pending{background:#f59e0b22;color:#f59e0b;font-weight:600}
.tag-status-resolved{background:#4ade8022;color:#4ade80;font-weight:600}
/* Checkbox */
.cb{width:26px;height:26px;border-radius:8px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all 0.15s;border:2px solid}
/* Progress */
.progress-bar{background:#eee3c9;border-radius:99px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.4s;background:linear-gradient(90deg,var(--gold),var(--gold2))}
/* Screens header */
.screen-header{padding:48px 16px 12px;background:linear-gradient(180deg,#fdf9ee,#f6efdb);position:sticky;top:0;z-index:10}
/* Empty state */
.empty{text-align:center;padding:60px 0;color:#b0a68f}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-text{font-size:14px}
/* Action result */
.action-result{background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:#211d17;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;direction:ltr;text-align:left;max-height:300px;overflow-y:auto}

/* Console Palette — warm cream + amber accent (light, reading-app inspired) */
:root{
  --ink:#f6efdb;--ink2:#fdf9ee;--ink3:#ffffff;
  --washi:#211d17;--warm:#3d362c;
  --matcha:#946011;--matcha2:#8a7550;
  --gold:#b8790f;--gold2:#c9930f;
  --terracotta:#8b4513;--rust:#a0522d;
  --cherry:#b8790f;
  --text1:#211d17;--text2:#6b6255;--text3:#948a7a;
  --t1:#211d17;--t2:#6b6255;--t3:#948a7a;--t4:#b0a68f;
  --bamboo:#b8790f;--bamboo2:#946011;--sprout:#b8790f;
  --border:rgba(43,38,32,.14);--glass2:rgba(255,255,255,.92);
  --line:rgba(43,38,32,.09);
}
.tao-screen{background:linear-gradient(180deg,#f6efdb 0%,#f6efdb 100%);min-height:100%}
.tao-card{background:linear-gradient(135deg,#fdf9ee,#fdf9ee);border:1px solid #a8711a;border-radius:16px;padding:20px;position:relative;overflow:hidden}
.tao-verse{font-size:16px;line-height:2.4;color:#211d17;text-align:center;font-weight:300;letter-spacing:0.5px}
.tao-chapter-num{font-size:14px;color:#b8790f;font-weight:600;letter-spacing:2px;margin-bottom:12px;text-align:center}
.tao-title{font-size:14px;color:#6b6255;text-align:center;margin-bottom:16px;font-style:italic}
.med-timer{font-size:48px;font-weight:200;color:#211d17;text-align:center;letter-spacing:4px}
.med-circle{width:180px;height:180px;border-radius:50%;border:2px solid #a8711a;display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;background:radial-gradient(circle,rgba(196,146,42,0.08),transparent)}
.breath-text{font-size:18px;color:#e8c15c;text-align:center;margin-top:16px;font-weight:300;letter-spacing:1px}
.brush{position:absolute;opacity:0.06;font-size:120px;pointer-events:none;user-select:none;color:#a8711a}
@keyframes ripple{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.5);opacity:0}}
.success-ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:2px solid #a8711a;pointer-events:none;z-index:999;animation:ripple 0.7s ease-out forwards}


/* === CONSOLE ATMOSPHERE === */

body {
  background: #f6efdb;
}

/* Flat header, no wash gradient */
.screen-header {
  background: #f6efdb !important;
  border-bottom: 1px solid var(--line) !important;
}

/* Flat cards — thin hairline border, no blur, no glow */
.card {
  background: var(--ink3) !important;
  border: 1px solid var(--line) !important;
  transition: border-color 0.15s;
}

/* Flat nav, no blur */
#nav {
  background: #fdf9ee !important;
  border-top: 1px solid var(--line) !important;
}

/* Active nav: flat accent color + underline, no glow */
.nav-btn.active .nav-icon svg { stroke: var(--gold); }
.nav-btn .nav-icon svg { stroke: var(--t3); transition: stroke .15s; }
.nav-btn.active::after {
  content:'';
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:20px; height:2px; background:var(--gold); border-radius:2px;
}

.success-ring {
  border-color: var(--gold) !important;
}

/* Flat modal, thin top rule */
.modal {
  background: #fffdf6 !important;
  border-top: 1px solid var(--line) !important;
}

.screen {
  transition: opacity 0.15s ease;
}

/* Tao screen keeps its own quiet, separate dark atmosphere on purpose */
#screen-tao {
  background: linear-gradient(180deg, #f6efdb 0%, #f6efdb 100%);
}

.form-input, .form-select {
  background: #fffdf6 !important;
  border: 1px solid var(--line) !important;
  color: var(--text1) !important;
}

::-webkit-scrollbar { width: 2px; }
::-webkit-scrollbar-thumb { background: rgba(201,162,39,0.25); border-radius: 99px; }

/* Signature: a single quiet topographic contour, not a bamboo garden —
   ties back to the actual subject (field survey / terrain), used once, faint. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20430%20800'%20opacity='0.05'%3E%3Cstyle%3Epath%7Bfill:none;stroke:%23c9a227;stroke-width:1%7D%3C/style%3E%3Cpath%20d='M-20%20120%20Q100%2080%20220%20130%20Q320%20170%20460%20110'/%3E%3Cpath%20d='M-20%20180%20Q110%20145%20230%20190%20Q330%20225%20460%20170'/%3E%3Cpath%20d='M-20%20560%20Q120%20520%20240%20565%20Q330%20600%20460%20545'/%3E%3Cpath%20d='M-20%20620%20Q130%20585%20250%20625%20Q340%20655%20460%20605'/%3E%3Cpath%20d='M-20%20680%20Q140%20648%20260%20685%20Q350%20712%20460%20665'/%3E%3C/svg%3E");
  background-size: cover;
  background-position: center;
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
}

#screen-tao::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20430%20800%27%20opacity%3D%270.05%27%3E%0A%20%20%3Cstyle%3Eellipse%7Bfill%3Anone%3Bstroke%3A%23c9a227%3Bstroke-width%3A1%7D%3C/style%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2720%27%20ry%3D%278%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2750%27%20ry%3D%2720%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2790%27%20ry%3D%2736%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%27140%27%20ry%3D%2756%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%27200%27%20ry%3D%2780%27/%3E%0A%3C/svg%3E");
  background-size: cover;
  pointer-events: none;
  z-index: 0;
}

#screen-tao > * {
  position: relative;
  z-index: 1;
}

.cal-header{padding:52px 18px 12px;background:#f6efdb;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--t2);font-size:18px;cursor:pointer}
.cal-month-title{font-size:18px;font-weight:700;color:var(--t1);text-align:center}
.cal-view-tabs{display:flex;gap:4px}
.cal-view-tab{flex:1;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--t3);background:transparent;transition:all .2s}
.cal-view-tab.active{background:rgba(201,162,39,.12);color:var(--gold);border:1px solid rgba(201,162,39,.25)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 2px}
.cal-weekday{font-size:14px;color:var(--t3);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 8px;gap:2px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;border:1px solid transparent}
.cal-day.today{background:rgba(201,162,39,.14);border-color:var(--gold)}
.cal-day.today .cal-dn{color:var(--gold);font-weight:800}
.cal-day.other-month .cal-dn{color:var(--t4)}
.cal-dn{font-size:14px;font-weight:500;color:var(--t2);line-height:1}
.cal-dots{display:flex;gap:2px;margin-top:2px}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.ev-card{background:var(--ink3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-right:3px solid var(--gold);cursor:pointer}
.ev-time{font-size:14px;color:var(--gold);font-weight:700;margin-bottom:3px}
.ev-title{font-size:14px;color:var(--t1);font-weight:600;line-height:1.4}
.ev-note{font-size:14px;color:var(--t2);margin-top:3px;line-height:1.5}
.week-row{display:flex;align-items:flex-start;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);min-height:52px;cursor:pointer}
.week-dlabel{width:36px;flex-shrink:0}
.week-dname{font-size:14px;color:var(--t3);font-weight:600}
.week-dnum{font-size:18px;font-weight:700;color:var(--t2);line-height:1}
.week-dnum.today{color:var(--sprout)}
.week-epill{background:rgba(184,134,11,.15);border:1px solid rgba(184,134,11,.25);border-radius:8px;padding:5px 10px;margin-bottom:4px;font-size:14px;color:var(--t1);font-weight:500}
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen"></div>
  <div id="screen-tasks" class="screen hidden"></div>
  <div id="screen-sites" class="screen hidden"></div>
  <div id="screen-people" class="screen hidden"></div>
  <div id="screen-tao" class="screen hidden"></div>
  <div id="screen-calendar" class="screen hidden"></div>
  <div id="screen-input" class="screen hidden"></div>
  <div id="screen-action" class="screen hidden"></div>
  <div id="screen-settings" class="screen hidden"></div>
  <nav id="nav">
    <button class="nav-btn active" data-screen="home">
      <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>
      <span class="nav-label">בית</span>
    </button>
    <button class="nav-btn" data-screen="tasks">
      <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
      <span class="nav-label">משימות</span>
      <span class="nav-badge hidden" id="badge-tasks">0</span>
    </button>
    <button class="nav-btn" data-screen="sites">
      <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg></span>
      <span class="nav-label">אתרים</span>
      <span class="nav-badge hidden" id="badge-sites">0</span>
    </button>
    <button class="nav-btn" data-screen="people">
      <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.3"/><path d="M2.5 20c.6-3.6 3.2-5.8 6.5-5.8s5.9 2.2 6.5 5.8"/><circle cx="17" cy="7" r="2.6"/><path d="M15.5 14.3c2.6.4 4.4 2.3 4.9 5.2"/></svg></span>
      <span class="nav-label">אנשים</span>
      <span class="nav-badge hidden" id="badge-people">0</span>
    </button>
      <button class="nav-btn" data-screen="calendar"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/></svg></span><span class="nav-label">לוח</span></button><button class="nav-btn" data-screen="tao"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 4.2c3.2 2.8 3.2 12.8 0 15.6"/></svg></span><span class="nav-label">טאו</span></button>
  </nav>
</div>
<div id="modal-container"></div>

<script>var medInterval = null;
var medSeconds = 0;
var medTotal = 0;
var musicMuted = false;
var selectedVoiceIdx = -1;
var ambientNodes = [];
var ambientGain = null;


function getTodayPlus(days) {
  var d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getToday() { return getTodayPlus(0); }
function buildSystemPrompt() {
  var td = getToday();
  return 'You are a field assistant for Uri (IAI Philippines Regional Manager). Today=' + td + '\n' +
    'Dates: tomorrow=' + getTodayPlus(1) + ', in2days=' + getTodayPlus(2) + ', nextweek=' + getTodayPlus(7) + ', in2weeks=' + getTodayPlus(14) + ', in3weeks=' + getTodayPlus(21) + ', nextmonth=' + getTodayPlus(30) + '\n\n' +
    'CRITICAL: Return ONLY this exact JSON structure, nothing else:\n' +
    '{' +
    '"now":[{"id":"n1","text":"max 8 words","site":null,"assignee":"uri/gio/kenneth/asc/11-16 or null","color":"red/orange/green","time":"","date":"","context":"phone/office/site or null","note":"short side-remark attached to this task, or null"}],' +
    '"today":[],' +
    '"later":[],' +
    '"sites":[{"name":"","province":"","issue":"","contractor":"asc or 11-16 or null","status":"open/pending/resolved","location":"coordinates or address if mentioned, else null","mondayLink":"a literal monday.com URL if one appears in the text, else null","remo":"REMO number if mentioned, else null","year":"2024/2025/2026 contract year if mentioned or inferable, else null"}],' +
    '"people":[{"name":"","role":"contractor/engineer/nia/other","company":"","pending":""}],' +
    '"events":[{"title":"ENGLISH title","date":"' + td + '","time":"","note":"","recurring":"","notify":"60","site":"matching site name or null"}],' +
    '"focus":"Hebrew sentence",' +
    '"moodGuess":"overwhelmed/scattered/tired/focused/neutral"' +
    '}\n\n' +
    'RULES:\n' +
    '0. MOOD: infer "moodGuess" from the tone/phrasing/pace of the pasted text itself (not from task content) — rushed, dense, anxious phrasing with many urgent items and little structure -> "overwhelmed"; jumping between unrelated topics with no clear thread -> "scattered"; short, low-energy, or mentions of tiredness/no sleep -> "tired"; calm, clear, organized phrasing -> "focused"; anything else or unclear -> "neutral". Default to "neutral" unless the tone clearly signals one of the others — do not over-diagnose from a short or neutral message.\n' +
    '1. now=urgent max 3 (red), today=do today (orange), later=future no date (green)\n' +
    '2. EVENTS: put ONLY genuinely date/time-bound items in events[] — a meeting, a deadline, an appointment, something that belongs on a calendar. Do NOT create an events[] entry for every plain task; a task that\'s just "do X" with no specific date/meeting stays ONLY in now/today/later. Calculate exact dates:\n' +
    '   - "in 2 weeks" or "בעוד שבועיים" -> date=' + getTodayPlus(14) + '\n' +
    '   - "tomorrow" or "מחר" -> date=' + getTodayPlus(1) + '\n' +
    '   - "next week" or "שבוע הבא" -> date=' + getTodayPlus(7) + '\n' +
    '   - "in 3 weeks" or "בעוד 3 שבועות" -> date=' + getTodayPlus(21) + '\n' +
    '   - specific date "19.07" -> date=' + td.slice(0,4) + '-07-19\n' +
    '3. Tasks and events[] are separate and NOT duplicates of each other — a task should appear in events[] only if it is ALSO a real calendar appointment/meeting/deadline, never just to "make sure it\'s visible somewhere". If an event is clearly about one of the sites in sites[] (existing or new), set its "site" field to that exact site name so tapping the calendar item can jump to that site.\n' +
    '4. notify always "60" (1 hour before)\n' +
    '5. events[] can be empty — that\'s normal when a message has no actual appointments/deadlines\n' +
    '6. If a now/today/later item names a specific clock time (e.g. "בעוד דקות ב-10:03", "פגישה ב-14:00"), also fill that item\'s "time" (HH:MM 24h) and "date" (default ' + td + ' if unstated) — this lets the app auto-detect once that time has passed.\n' +
    '7. NEXT-ACTION WRITING: write each task.text as ONE concrete, physically-doable next step, not a vague label. Bad: "לטפל בבאר בקלוריה". Good: "להתקשר לדייב על באר קלוריה". This applies WITHIN a single task that has several sequential steps — put only the very next step in text (the rest belongs in the site/event, not the task). It does NOT mean collapsing several separate tasks into one — see rule 9.\n' +
    '8. CONTEXT: set "context" to the situation needed to actually do the task — "phone" (call/text/email from anywhere), "office" (needs computer/files/Monday.com), "site" (must be physically at the location), or null if unclear. Infer from verbs: "להתקשר/לשלוח הודעה"->phone, "לעדכן את מאנדיי/לכתוב דוח"->office, "לבדוק/לתקן/לבקר"->site.\n' +
    '9. SPLITTING: one pasted message can contain several genuinely separate, independent action items — different people, different sites, or clearly unrelated asks, even in a single paragraph or sentence (e.g. "תתקשר לדייב על הבאר בקלוריה ותעדכן את נובי שהגנרטור בסטה קרוז מוכן" is TWO tasks, not one). Create a separate now/today/later entry for EACH distinct item — never merge unrelated asks into one, and never silently drop one because you only kept "the next" one. Likewise if a message mentions more than one site or contractor issue, create a separate entry in sites[] for each one. A numbered list (1. 2. 3...) in the message is a strong signal that each number is its own separate item — do not collapse a numbered list into one task. When in doubt about whether something is one task or two, prefer splitting.\n' +
    '10. SITE DETAILS: when a message gives coordinates (any format: decimal "16.9754, 121.8107" or DMS like 18°17\'50.89"N 121°24\'1.57"E) or a written address for a site, put that exact text in that site\'s "location". If the raw message text contains a literal monday.com URL, put that exact URL in that site\'s "mondayLink". If the message mentions a contract/project year (e.g. "2026 project", "פרויקט 2025") or a REMO number for a site, fill "year"/"remo" accordingly — these often distinguish otherwise-identical site names across different contract years.\n' +
    '11. TASK ≠ SUBSTITUTE FOR SITE: a task that talks about a site is NOT a substitute for a sites[] entry — if a specific site name, coordinates, or "site name -" label appears anywhere in the message, ALWAYS ALSO create or update a sites[] entry for it (with whatever of name/location/year/remo/issue was given), even though the same message also produced a task in now/today/later. Emitting only the task and skipping the site is wrong.\n\n' +
    'WORKED EXAMPLE — input:\n' +
    '"For tomorrow\n1. Need to check and get panelli pump and motor at cauayan wh. (Warehouse)\n2. check 2026 project (still waiting for engr junell to send the well report)\n- 18°17\'50.89"N 121°24\'1.57"E\n- site name - San Francisco, Luna, Apayao\n3. We will go to the NIA in charge to this 2026 project to ask them if this is really 2026 project."\n' +
    'Expected shape of the output (values illustrative, keep your own concise Hebrew task text):\n' +
    '- today: THREE separate entries, one per numbered item — a pump/motor pickup task, a "waiting on engr junell\'s well report" task, and a "visit NIA to confirm 2026 project" task. Not two, not one merged item.\n' +
    '- sites: ONE entry — {"name":"San Francisco, Luna, Apayao","location":"18°17\'50.89"N 121°24\'1.57"E","year":"2026","issue":"waiting for engr junell well report","status":"pending"} — created even though item 2 also produced a task above.\n' +
    '- events: empty, unless a real deadline/meeting time was given (there isn\'t one here).\n\n' +
    '12. NOTES vs SEPARATE TASKS: a short aside that only makes sense attached to one specific task (a reminder, a payment to make about it, a detail to not forget) goes in that task\'s "note" field — small print under the main task, not a task of its own. Example: main task "פגישה עם איגור בשישי ב-20:30" with note "לשלם על מפגש רביעי". This is different from rule 9 splitting: rule 9 is for independent action items that stand on their own; "note" is for a remark that is meaningless without its parent task.';
}

// Optional: if a server URL + passcode are set (Settings screen), the app
// syncs `state` to a Cloudflare Worker + D1 instead of staying purely local.
// localStorage remains a fast local cache either way, so the app still opens
// instantly and still works if the network/server is briefly unavailable —
// the server is an addition, not a replacement for offline function.
let serverUrl = (localStorage.getItem('fieldy_server_url') || '').replace(/\/+$/, '')
let serverPasscode = localStorage.getItem('fieldy_passcode') || ''
function serverConfigured() { return !!(serverUrl && serverPasscode) }
let _syncTimer = null
function syncStateToServer() {
  if(!serverConfigured()) return
  clearTimeout(_syncTimer)
  _syncTimer = setTimeout(function() {
    fetch(serverUrl + '/api/state', {
      method: 'PUT',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+serverPasscode},
      body: JSON.stringify(state)
    }).catch(function(e){ console.log('server sync failed (kept locally):', e) })
  }, 1200)
}
// Appends a permanent event to the server's history log — separate from the
// state snapshot above, this is what survives being overwritten and is what
// later analysis ("how long does a site usually stay open") is built from.
function logEvent(type, payload) {
  if(!serverConfigured()) return
  fetch(serverUrl + '/api/log', {
    method: 'POST',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+serverPasscode},
    body: JSON.stringify({type, payload, ts: new Date().toISOString()})
  }).catch(function(e){ console.log('history log failed (non-critical):', e) })
}

function getCurrentMood() {

  var recent = state.moods[state.moods.length-1]
  var cutoff = Date.now() - 4*60*60*1000 // active for 4h after logging

  return recent
}

function logMood(mood, source) {

  var now = new Date()

  var moods = [...(state.moods||[]), entry]
  if(moods.length > 500) moods = moods.slice(moods.length - 500)

// Looks for a mood that keeps recurring in the same weekday + time-of-day
// slot (morning/afternoon/evening), so patterns like "Sunday afternoons
// tend to be overwhelming" surface on their own instead of staying invisible.
function getMoodPatterns() {
  if(!state.moods || state.moods.length < 5) return []
  var blocks = {}
  state.moods.forEach(function(m) {
    var wd = (m.weekday != null) ? m.weekday : new Date(m.ts).getDay()
    var hr = (m.hour != null) ? m.hour : new Date(m.ts).getHours()
    var block = hr < 12 ? 'בבוקר' : (hr < 17 ? 'אחה"צ' : 'בערב')
    var key = wd + '|' + block
    if(!blocks[key]) blocks[key] = {}
    blocks[key][m.mood] = (blocks[key][m.mood] || 0) + 1
  })
  var insights = []
  Object.keys(blocks).forEach(function(key) {
    var parts = key.split('|'), wd = parseInt(parts[0]), block = parts[1]
    var counts = blocks[key]
    var top = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a] })[0]
    if(top && top !== 'focused' && counts[top] >= 3) {
      insights.push({wd: wd, block: block, mood: top, count: counts[top]})
    }
  })
  return insights.sort(function(a,b){ return b.count - a.count }).slice(0,2)
}

// ── CHRONOLOGY ────────────────────────────────────
// The app previously had no concept of "today" resetting: a task or focus
// headline set at 10am would still show as if it were current the next day
// or next week. This keeps the app connected to the actual clock:
// - "now" tasks are, by definition, only relevant on the day they were added.
//   Once the day rolls over, unfinished ones move to "today" instead of
//   staying flagged as urgent-right-now forever.
// - The "focus" headline (e.g. a specific meeting time) is scoped to the
//   day it was generated and clears itself once that day has passed.
// - Individual tasks/events that carry a real time are flagged overdue once
//   that time has passed, instead of silently staying in an "upcoming" state.
function isOverdue(t) {
  if(!t || t.done || !t.time) return false
  var d = t.date || getToday()
  var dt = new Date(d + 'T' + t.time)
  return !isNaN(dt) && dt.getTime() < Date.now()
}
function checkChronology() {
  var today = getToday()
  var changed = false
  if(state.focus && state.focusDate && state.focusDate !== today) {
    state.focus = ''; state.focusDate = null; changed = true
  }
  if(state.lastSeenDate && state.lastSeenDate !== today) {
    var stale = (state.tasks.now || []).filter(t => !t.done)
    if(stale.length) {
      state.tasks.today = [...state.tasks.today, ...stale]
      state.tasks.now = state.tasks.now.filter(t => t.done)
      changed = true
    }
    // Completed tasks used to sit in their bucket forever until deleted one
    // by one. Anything finished 3+ days ago is cleared out automatically.
    var cutoff = Date.now() - 3*24*60*60*1000
    var purge = arr => arr.filter(t => !(t.done && t.completedAt && t.completedAt < cutoff))
    var before = state.tasks.now.length + state.tasks.today.length + state.tasks.later.length
    state.tasks.now = purge(state.tasks.now)
    state.tasks.today = purge(state.tasks.today)
    state.tasks.later = purge(state.tasks.later)
    if(state.tasks.now.length + state.tasks.today.length + state.tasks.later.length !== before) changed = true
  }
  if(state.lastSeenDate !== today) { state.lastSeenDate = today; changed = true }
  if(changed) save()
  return changed
}

nאם ישמע אדם בינוני על הטאו\nלשעה ישמרהו ולשעה יאבדהו\nאם ישמע שוטה על הטאו\nיפרוץ בצחוק גדול\nאם לא היה צוחק\nלא היה זה טאו\nעל כן יש האומרים\nהנאור בטאו\nנראה חשוך\nהמתקדם בטאו\nנראה נסוג\nהמישיר בטאו\nנראה אובד דרך", "הטאו\nכמו נהר\nחזק\nרחב\nועמוק\nכמו עיגול\nאבל\nלבן\nיותר\nמהירח\nכמו\nריבוע גדול\nאבל\nבלי זוויות\nכמו תינוק\nהרך מכל\nחווה את הקשה מכל\nיוצא מתוך חום בלי חלל\nאל חלל נטול חום\nמתוך כך למדתי\nאת יתרונה של\nהזרימה הטבעית\nאת כל הנחוץ\nכוח החיים כבר יעשה\nיש הרבה חכמה וכוח\nבמקומות\nשאין בהם מילים\nאבל\nמי יצליח\nלטפל\nבדאגות\nכמו\nתינוק", "יין ויאנג\nטאו הוא אחד\nאחד הוליד\nוהנה שניים\nשניים הם ניגוד\nניגוד שווה שלושה\nכשיש שלושה\nעולים מיד\nעוד רבבה\nאבל היין והיאנג\nכמו הצל והאור\nאחד מלפנים\nשני מאחור\nההרמוניה בין הניגודים\nהיא נשמת החיים\nהמחבל\nבסדר הטוב\nגם\nיחיה\nוימות\nאבל לא\nבסדר\nהנכון", "שלוש שאלות\nשמך או עצמך\nמה קרוב אליך יותר\nעצמך או רכושך\nמה יקר לך יותר\nרכושך או בריאותך\nהיכן כואב לך יותר\nשים לב\nמרבה התלהבות\nמרבה הוצאות\nמרבה אגירה\nמרבה הפסדים\nלכן\nדע לשמוח בחלקך\nולא תדע בושה\nדע מתי די\nולא תדע סכנה\nכך ללא דאגות\nנעים\nלהאריך ימים\nהחכם יו פו הוסיף כאן הערה:", "המליאות הריקה\nהנמרץ אל האושר\nנראה כעצל\nצח הלשון\nנשמע מגמגם\nהשלימות נראית\nכהעדר שלמות\nהישרות העילאית\nרק נראית עקומה\nאם יש בעולם דבר\nשתשתמש בו\nולא יחסר\nהרי זו\nהמלאות\nהריקה\nטוהר\nושלוות רוח\nקובעים\nאת\nסדר\nהעולם", "המכשולים\nכאשר יש טאו בממלכה\nסוסי המרוץ\nנשלחים לזיבול השדות\nכאשר אין הטאו מושל\nלוקחים את הסוסים\nלרעות בגבולות\nאין אסון גדול\nמחוסר שקט פנימי", "אין טפשות גדולה יותר\nמהליכה עיוורת אחר התשוקות\nאין אומללות גדולה\nמהעדרה של מידת ההסתפקות\nאין מכשול גדול יותר\nמאשר החמדנות\nהיודע\nמתי די\nתמיד\nיש לו די\nדעת עולם\nמבלי לצאת מפתח ביתו\nיודע החכם עולם ומלואו", "הממעיט\nהעוסק בלימוד\nמוסיף ידיעה מיום ליום\nהעוסק בטאו\nממעיט עשייה מיום ליום\nממעיט וחוזר וממעיט\nעד שהוא מגיע אל אי-העשיה\nוהעשיה אז זורמת דרכו\nכך\nבאי-עשיה\nאין דבר שאינו נעשה\nבלא מאמץ\nאפשר לכבוש עולם\nמי\nשמתאמץ\nלא יוכל\nלאורך\nזמן\nלהחזיק", "לב ישר\nאני\nאין לי לב שהוא מי  משגשגת\nהמפיץ טאו בתבל\nגבורתו חסד עולם\nחקור את גופך\nולמד מה זה גוף\nחקור עצמך\nודע זולתך\nחקור משפחתך\nולמד מה זו משפחה\nלמד כפר\nותדע מה זו מדינה\nאם תרצה להבין עם שלם\nלמד להכיר את היחיד\nלמד ארץ אחת\nותדע את כל העולם", "שב\nבשקט\nותדע\nמהו\nטאו\nכתב עמוס עוז:\nהסירו דאגה\nתינוק הוא מבורך\nבהשגחה העליונה\nולא יקרה לו כל רע\nלא יעקוץ אותו עקרב\nלא צרעה ולא אפעה\nלא יפחד מחיות פרא\nולא מעופות טרף דורסים\nהתינוק\nעצמותיו חלשות וגידיו רכים\nאך אחיזתו בחיים איתנה\nונטולת חרדה\nשרביטו הקטון ניעור\nעוד בטרם ידע בין נקבה וזכר\nהוא מסוגל כל היום לצרוח\nגרונו חזק ואינו נצרד\nיש בו און\nהוא יודע להתמיד\nוהוא מתואם עם העולם", "דע\nאת הקבוע\nואל\nתדאג\nיתר\nעל\nהמידה\nחלק מטכניקות המדיטציה של מנזרי הזן מלמדות סוג מסויים של התמקדות בנשימות\nובמקביל ,הקשבה אל הנעשה בסביבה.\nבדידות החכמים\nזה שמדבר לא יודע\nזה שיודע לא מדבר\nהוא חוסם פתחיו\nסוגר דלתותיו\nמקהה חודו\nמרכך זוהרו\nשומר על מסתורין\nמתאחד עם אבקו\nבלתי ניתן לקרבה\nאבל לא ניתן לריחוק\nאף אחד\nלא יאמר לו מה לעשות\nאבל גם אין ממנו נזק\nאין הוא מבקש כבוד\nוללא מאמץ\nהוא מוקף בו\nבעיני\nכזה הוא\nאיש טאו", "המלצות למעצבי אומה\nביושר משול במדינה\nבערמה עשה לך מלחמה\nבישוב דעת זכה במנוחה\nככל שירבו האיסורים וההגבלות\nכן ירבה עוניו של העם\nככל שירבו חוקים ותקנות\nכן ירבו שודדי המשפט\nומומחי החוק\nככל שירבו כלי הנשק\nכן תרבה האלימות\nככל שירבו המפעלים\nכך יהיו יותר דברים\nשלא צריכים\nלכן אמר החכם\nנוקט אני באפס מעשה\nוהדברים מסתדרים על הדרך\nלא מתערב\nוהשינוי נעשה מעצמו\nכאשר אני ישר עם עצמי\nגם האחרים\nשומרים איתי על יושר\nגם אם אני בטלן\nולא עושה הרבה\nהברכה תמיד איתי\nועם אלה שסביבי", "בריא\nממחלת\nהקינאה\nהייתי\nרוצה\nשוב\nלהגיד\nשאין\nברכה\nכמו\nהפשטות\nאושר ועצב\nהאושר\nעל גבי העצב נישא\nהצער\nתחת כנפי האושר שוכן\nהמזל הטוב סמוך אל הרע\nבמזל הרע אורב הטוב\nמי ידע גבולם\nלכן החכם תמיד זהיר\nאנשים טועים כל הזמן\nחיים שלמים\nימים ארוכים\nשל טעויות\nישר\nולא פוגע\nצודק\nולא מעליב\nמאיר\nאבל לא\nמסנוור בעין\nגדולה של ממש היא להיות צודק ולא לצעוק.", "מתינות\nעם בני אדם\nכמו בעבודת האדמה\nאין טוב\nממתינות\nבמתינות\nהכל קורה במהירות\nהמתון מקדם בגבורה\nגם את הצרה\nוממתין הוא\nשגם היא תעבור\nאיש\nטאו\nשורש\nעמוק\nגזע\nאיתן", "רוחות רפאים\nלשלוט\nבארץ הגדולה\nמצריך\nמידת אומנות\nכמו לטגן דג קטן\nכאשר יש טאו בממלכה\nלא מהלכים בה רוחות רפאים\nכאשר אין טאו בממלכה\nמכתירים את המתים\nלהיות אלים\nלא שאני מזלזל\nברוחות הרפאים\nאבל יותר טוב\nשהם לא יתערבבו\nעם האנשים\nלא\nהם\nולא\nהחכמים", "מדיניות האגן\nמדינה גדולה\nצריכה להיות\nמקום מפגש\nכמו אגן ניקוז\nאליו זורמים\nכל הנהרות\nכדי שיזרמו אליה\nחייבת היא\nלהיות למטה\nנשית יותר\nשלווה יותר\nועמוקה\nהנקבה בדממתה\nשמה עצמה למטה\nובכך תמיד גוברת\nעל הזכר\nהתאחדות\nהיא\nחוק\nהטבע\nיחד\nיותר טוב\nלכולם", "מטמון ומקלט\nמקלט הטאו\nהוא מטמונו\nשל האדם הטוב\nתכשיטים\nאבירים", "סוסים\nגם הקיסר\nושלושת ילדיו\nהם כאין וכאפס\nלעומת\nתפארתו\nשל\nהטאו\nכלכלה נכונה\nעסוק באפס מעשה\nעשה באפס עיסוק\nטעם את החסר טעם\nלמד את הבלתי ניתן ללמידה\nמדוד את הבלתי ניתן למדידה\nהשג את הבלתי ניתן להשגה\nהגה במה שאנשים זנחו\nזכור את מה שאנשים שכחו\nואל תמהר\nהגדל את הקטן\nהרבה את המועט\nטפל בקשה בעודו קל\nטפל בגדול בעודו קטן\nכל הדברים המורכבים בעולם\nהיו בתחילתם רק עניין קטן\nגמול על איבה בחסד\nמי שלא מפחד להיות למטה\nתמיד יהיה למעלה\nמי שמרבה להבטיח\nודאי לא ירבה לקיים\nהרגיל להקל ראש בדברים רבים\nודאי שיתקל בקשיים\nטפל בקטן ותשיג גדולות\nהחכם יטפל בקשה בעודו קל\nאצלו הקשיים\nלא מספיקים להתקשות", "להצליח בהתחלה\nאת הנייח קל לאחוז\nאת חסר הסימן ניתן לחזות\nהגדול לבסוף נשבר\nאבל הזעיר רק מתפזר\nעשה תיקון עוד לפני שהתחלת\nמשול בדברים לפני שיתבלבלו\nכשאין סדר\nיש חוסר סדר\nוהשאנן סופו להכשל\nעל סף ההצלחה\nדאג לסוף\nכמו שאתה דואג להתחלה\nולא תראה כשלון בדרכך\nלפיכך החכם\nרואה דברים קשים\nולבסוף אין לו קשיים\nמגדל של תשע קומות\nמתחיל מדלי של עפר\nעץ גדול\nמתחיל כשתיל דק אחד", "מסע\nשל\nאלף לי\nמתחיל\nבצעד\nאחד\nצפוף בראש\nבימי קדם\nהטובים שבאנשים למדו\nכדי להיות נכונים\nלא כדי להיות משכילים\nהיום האנשים מתווכחים\nכי צפוף להם\nיותר מדי בראש\nלפיכך\nהשליטה רק מדעת היא אסון\nאבל אם אפשר בהיסח הדעת\nיבואו ברכה וביטחון\nהזוכר תמיד את שני אלה\nידע את סגולת המופת\nשמה האחר של סגולת המופת const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

const getAudio = () => { if(!audioCtx) audioCtx = new AudioCtx(); return audioCtx; };

const playTone = (freq, dur, type='sine', vol=0.3) => {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = type;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
};

// Water sound (gentle stream)
const playWater = () => {
  try {
    const ctx = getAudio();
    const bufferSize = ctx.sampleRate * 0.8;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    // Pink noise filtered to sound like water
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0; i<bufferSize; i++) {
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.08;
      b6=w*0.115926;
    }
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=800; filter.Q.value=0.5;
    src.buffer=buffer;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
    src.start(); src.stop(ctx.currentTime+0.8);
  } catch(e) {}
};

function startMeditation(idx) {
  const med = MEDITATIONS[idx];
  medTotal = med.duration * 60;
  medSeconds = medTotal;

  // Stop any existing timer first
  if(medInterval) { clearInterval(medInterval); medInterval = null; }

  playTibetanBowl();

  const stepsHtml = med.steps.map(function(s, i) {
    return '<div style="font-size:12px;color:#b3a077;padding:4px 0;border-bottom:' +
      (i < med.steps.length - 1 ? '1px solid #241b0d' : 'none') + '">' + s + '</div>';
  }).join('');

  const mins = med.duration.toString();
  const modal = document.getElementById('modal-container');
  modal.innerHTML =
    '<div class="modal-overlay">' +
    '<div class="modal" style="text-align:center">' +
    '<div style="font-size:13px;color:#cf9d2e;font-weight:600;margin-bottom:4px">' + med.icon + ' ' + med.title + '</div>' +
    '<div style="font-size:12px;color:#b3a077;margin-bottom:20px">' + med.desc + '</div>' +
    '<div class="med-circle" id="med-circle">' +
    '<canvas id="med-canvas" width="180" height="180" style="position:absolute;inset:0;border-radius:50%"></canvas>' +
    '<div class="med-timer" id="med-timer">' + mins + ':00</div>' +
    '</div>' +
    '<div class="breath-text" id="breath-text">היכון...</div>' +
    '<div style="margin:20px 0;padding:14px;background:#120d06;border-radius:12px;text-align:right">' +
    stepsHtml +
    '</div>' +
    '<button onclick="stopMeditation(false)" style="width:100%;padding:14px;border-radius:12px;border:1px solid #241b0d;background:transparent;color:#b3a077;font-size:14px">סיים מוקדם</button>' +
    '</div></div>';

  drawMedCircle(1);

  var pattern = ['שאיפה...', 'עצירה...', 'נשיפה...', 'השהייה...'];
  var breathTimes = [4, 4, 6, 2];
  var breathIdx = 0;
  var breathTimer = 0;

  setTimeout(function() {
    var b = document.getElementById('breath-text');
    if (b) b.textContent = pattern[0];
  }, 1500);

  medInterval = setInterval(function() {
    medSeconds--;
    var m = Math.floor(medSeconds / 60);
    var s = medSeconds % 60;
    var timer = document.getElementById('med-timer');
    if (timer) timer.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    drawMedCircle(medSeconds / medTotal);
    breathTimer++;
    if (breathTimer >= breathTimes[breathIdx]) {
      breathTimer = 0;
      breathIdx = (breathIdx + 1) % 4;
      var b = document.getElementById('breath-text');
      if (b) b.textContent = pattern[breathIdx];
      if (breathIdx === 0 && typeof window._onBreathCycle === 'function') window._onBreathCycle();
    }
    if (medSeconds <= 0) stopMeditation(true);
  }, 1000);
}


function drawMedCircle(ratio) {
  const canvas = document.getElementById('med-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=180, cx=W/2, cy=W/2, r=W/2-4;
  ctx.clearRect(0,0,W,W);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(196,146,42,0.15)'; ctx.lineWidth=3; ctx.stroke();
  if(ratio>0) {
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(1-ratio)*Math.PI*2);
    ctx.strokeStyle='#b8860b'; ctx.lineWidth=3; ctx.stroke();
  }
}

function stopMeditation(completed) {
  if(medInterval) { clearInterval(medInterval); medInterval = null; }
  window._onBreathCycle = null;
  document.getElementById('modal-container').innerHTML = '';
  try { stopAmbientMusic(); } catch(e) { console.log('stopAmbientMusic err:', e); }
  try { stopVoice(); } catch(e) { console.log('stopVoice err:', e); }
  if(completed) { playTibetanBowl(); showRipple(); logEvent('meditation_completed', {}); }
}

async function doAnalyze() {
  const text = document.getElementById('input-text')?.value?.trim()
  const btn = document.getElementById('input-btn')
  const err = document.getElementById('input-error')
  if(!text || !apiKey) return
  btn.textContent = '⚙️ מסדר...'
  btn.style.background = '#ffffff'
  btn.style.color = '#7a6f5c'
  err.style.display = 'none'
  try {
    const parsed = await callClaude([{role:'user',content:text}], SYSTEM_PROMPT)
    console.log('AI raw:', parsed.slice(0,500))
    const p = JSON.parse(parsed.replace(/```json|```/g,'').trim())
    console.log('Events from AI:', JSON.stringify(p.events))
    const s = Date.now()
    const tag = (arr,pfx) => (arr||[]).map((t,i)=>({...t,id:`${pfx}${s}${i}`,done:false}))
    const existingSiteNames = new Set(state.sites.map(x=>x.name))
    const newAiSites = (p.sites||[]).filter(x=>x.name && !existingSiteNames.has(x.name))
    const taggedSites = (p.sites||[]).map(x => existingSiteNames.has(x.name) ? x : {...x, createdAt: new Date().toISOString()})
    setState({
      tasks:{now:[...state.tasks.now,...tag(p.now,'n')],today:[...state.tasks.today,...tag(p.today,'d')],later:[...state.tasks.later,...tag(p.later,'l')]},
      sites: mergeSites(state.sites, taggedSites),
      people: mergePeople(state.people, p.people||[]),
      events: (function(){
        var ts = Date.now(), td = getToday();
        // events[] is only for genuinely calendar-worthy items (meetings,
        // deadlines, appointments) per SYSTEM_PROMPT rules 2-3. It used to
        // mirror EVERY task too — that meant deleting or finishing a task in
        // the Tasks screen left a duplicate "ghost" entry behind on the
        // calendar forever, since the two had no link back to each other.
        var aiEvs = (p.events||[]).map(function(e,i){
          return {id:'ev'+ts+i,title:e.title||'',date:e.date||td,time:e.time||'',
                  note:e.note||'',recurring:e.recurring||'',notify:e.notify||'60',color:'var(--bamboo)',site:e.site||null};
        });
        var existing = state.events || [];
        return [...existing,...aiEvs];
      })(),
      focus: p.focus || state.focus,
      focusDate: p.focus ? getToday() : state.focusDate
    })
    newAiSites.forEach(x => logEvent('site_created', {name: x.name, contractor: x.contractor||null, status: x.status||'open'}))
    if(p.moodGuess && MOOD_LIB[p.moodGuess]) logMood(p.moodGuess, 'auto')
    if((p.events||[]).length > 0) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(184,134,11,0.95);color:#211d17;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:999;backdrop-filter:blur(8px)';
      toast.textContent = '📅 ' + (p.events||[]).length + ' אירועים נוספו ללוח';
      document.body.appendChild(toast);
      setTimeout(function(){toast.style.opacity='0';setTimeout(function(){toast.remove();},300);},2500);
    }

function deleteTask(id) {
  const strip = arr => arr.filter(t=>t.id!==id)
  setState({tasks:{now:strip(state.tasks.now),today:strip(state.tasks.today),later:strip(state.tasks.later)}})
}

function toggleTask(id) {
  const wasUndone = [...state.tasks.now,...state.tasks.today,...state.tasks.later].find(t=>t.id===id&&!t.done)
  const now = Date.now()
  const toggle = arr => arr.map(t=>t.id===id?{...t,done:!t.done,completedAt:!t.done?now:null}:t)
  const patch = {tasks:{now:toggle(state.tasks.now),today:toggle(state.tasks.today),later:toggle(state.tasks.later)}}
  if(wasUndone) {
    const today = getToday()
    if(state.lastStreakDate !== today) {
      const y = getTodayPlus(-1)
      patch.streak = (state.lastStreakDate === y) ? (state.streak||0) + 1 : 1
      patch.lastStreakDate = today
    }
  }
  setState(patch)
  if(wasUndone){
    playTaskComplete();showRipple();
    logEvent('task_completed', {id, text: wasUndone.text, assignee: wasUndone.assignee||null, context: wasUndone.context||null})
  }
}

// Images are downsized client-side before being stored (localStorage has a
// hard size ceiling per origin), so a phone photo becomes a small JPEG
// thumbnail rather than a multi-MB original.
let pendingPhoto = null
function readImageAsThumbnail(file, cb) {
  const reader = new FileReader()
  reader.onload = function(e) {
    const img = new Image()
    img.onload = function() {
      const maxW = 720
      const scale = Math.min(1, maxW / img.width)
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale)
      const canvas = document.createElement('canvas')
      canvas.width = w; canvas.height = h
      canvas.getContext('2d').drawImage(img, 0, 0, w, h)
      cb(canvas.toDataURL('image/jpeg', 0.6))
    }
    img.src = e.target.result
  }
  reader.readAsDataURL(file)
}
function handlePhotoPick(input, previewId) {
  const f = input.files && input.files[0]; if(!f) return
  readImageAsThumbnail(f, function(dataUrl) {
    pendingPhoto = dataUrl
    renderPhotoPreview(previewId)
  })
}
function removePendingPhoto(previewId) {
  pendingPhoto = null
  renderPhotoPreview(previewId)
}
function renderPhotoPreview(previewId) {
  const prev = document.getElementById(previewId); if(!prev) return
  prev.innerHTML = pendingPhoto
    ? '<div style="position:relative"><img src="'+pendingPhoto+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px;display:block"/>'+
      '<button onclick="event.stopPropagation();removePendingPhoto(\''+previewId+'\')" style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:8px;padding:4px 8px;font-size:14px">✕ הסר</button></div>'
    : '<div style="text-align:center;color:#948a7a;font-size:14px">📷 הוסף תמונה</div>'
}
function photoInputHtml(inputId, previewId, existingPhoto) {
  pendingPhoto = existingPhoto || null
  return '<div style="margin-bottom:14px">'+
    '<label class="form-label">תמונה (רשות)</label>'+
    '<input type="file" accept="image/*" id="'+inputId+'" onchange="handlePhotoPick(this,\''+previewId+'\')" style="display:none"/>'+
    '<div id="'+previewId+'" onclick="document.getElementById(\''+inputId+'\').click()" style="border:1.5px dashed var(--line);border-radius:10px;padding:14px;cursor:pointer;background:#ffffff">'+
    (existingPhoto ? '<img src="'+existingPhoto+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px;display:block"/>' : '<div style="text-align:center;color:#948a7a;font-size:14px">📷 הוסף תמונה</div>')+
    '</div></div>'
}
function viewPhoto(src) {
  document.getElementById('modal-container').innerHTML =
    '<div class="modal-overlay" onclick="closeModal()" style="align-items:center;justify-content:center;padding:20px">'+
    '<img src="'+src+'" style="max-width:100%;max-height:80vh;border-radius:14px"/>'+
    '</div>'

function doAddTask() {
  const text = document.getElementById('add-task-text').value.trim()
  if(!text) return
  const context = document.getElementById('add-task-context').value || null
  const assignee = document.getElementById('add-task-assignee').value
  const color = document.getElementById('add-task-color').value
  const bucket = document.getElementById('add-task-bucket').value
  const note = document.getElementById('add-task-note').value.trim() || null
  const photo = pendingPhoto

  if(editingTaskId) {
    const id = editingTaskId
    const strip = arr => arr.filter(x=>x.id!==id)
    const original = [...state.tasks.now,...state.tasks.today,...state.tasks.later].find(x=>x.id===id) || {}
    const updated = {...original, text, assignee, color, context, note, photo}
    const next = {now:strip(state.tasks.now),today:strip(state.tasks.today),later:strip(state.tasks.later)}
    next[bucket] = [...next[bucket], updated]
    setState({tasks:next})
    editingTaskId = null
  } else {
    const task = {id:`m${Date.now()}`,text,assignee,color,done:false,site:null,context,note,photo}
    setState({tasks:{...state.tasks,[bucket]:[...state.tasks[bucket],task]}})
    playTaskAdd()
  }
  closeModal()
}

function dedupeEvents() {
  const btn = document.getElementById('dedupe-btn')
  const allTasks = [...state.tasks.now,...state.tasks.today,...state.tasks.later]
  const norm = s => (s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'').trim()
  const taskTexts = new Set(allTasks.map(t=>norm(t.text)).filter(Boolean))
  const before = state.events.length
  const kept = state.events.filter(e => !taskTexts.has(norm(e.title)))
  const removed = before - kept.length
  setState({events:kept})
  if(btn) { btn.textContent = removed>0 ? `נוקו ${removed} כפילויות ✓` : 'לא נמצאו כפילויות'; setTimeout(()=>{if(btn)btn.textContent='נקה כפילויות'},2500) }
}

async function forceRefreshApp() {
  const btn = document.getElementById('refresh-app-btn')
  if (btn) { btn.textContent = '⏳ מרענן...' }
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations()
      for (const r of regs) await r.unregister()
    }
    if ('caches' in window) {
      const keys = await caches.keys()
      for (const k of keys) await caches.delete(k)
    }
  } catch(e) { console.log('refresh cleanup error:', e) }
  location.href = location.pathname + '?v=' + Date.now()
}

const SYSTEM_PROMPT = buildSystemPrompt()


async function callClaude(messages, system=null) {
  if(serverConfigured()) {
    const r = await fetch(serverUrl + '/api/claude', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+serverPasscode},
      body:JSON.stringify({messages, system})
    })
    const d = await r.json()
    if(d.error) throw new Error(typeof d.error === 'string' ? d.error : (d.error.message || 'server error'))
    return d.content?.find(b=>b.type==='text')?.text || ''
  }
  const body = {model:'claude-sonnet-4-6',max_tokens:1500,messages}
  if(system) body.system = system
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)
  })
  const d = await r.json()
  if(d.error) throw new Error(d.error.message)
  return d.content?.find(b=>b.type==='text')?.text || ''
}

function mergeSites(ex, inc) {
  const m={}; ex.forEach(s=>m[s.name]=s);
  inc.forEach(s=>{
    const prev = m[s.name]||{}
    const clean = {}
    Object.keys(s).forEach(k=>{ if(s[k]!==null && s[k]!=='' && s[k]!==undefined) clean[k]=s[k] })
    m[s.name] = {...prev, ...clean}
  });
  return Object.values(m)
}
function mergePeople(ex, inc) {
  const m={}; ex.forEach(p=>m[p.name]=p); inc.forEach(p=>m[p.name]={...(m[p.name]||{}),...p}); return Object.values(m)
}

const DAYS_FULL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const RECUR_HE={daily:'יומי',weekly:'שבועי',monthly:'חודשי',yearly:'שנתי'};

function getEvents(){return state.events||[];}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return dateKey(new Date());}

function getEventsForDate(dk){
  const [y,m,day]=dk.split('-').map(Number);
  const dow=new Date(y,m-1,day).getDay();
  return getEvents().filter(e=>{
    if(e.date===dk)return true;
    if(!e.recurring)return false;
    const ed=new Date(e.date);
    if(e.recurring==='daily')return true;
    if(e.recurring==='weekly')return ed.getDay()===dow;
    if(e.recurring==='monthly')return ed.getDate()===day;
    if(e.recurring==='yearly')return ed.getMonth()===m-1&&ed.getDate()===day;
    return false;
  });
}

function renderMonthCal(){
  var y=calDate.getFullYear(),m=calDate.getMonth();
  var first=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var prev=new Date(y,m,0).getDate();
  var tk=todayKey();
  var days='';
  // prev month
  for(var i=first-1;i>=0;i--){
    var d=prev-i,dk=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    days+='<div class="cal-day other-month" data-date="'+dk+'"><span class="cal-dn">'+d+'</span></div>';
  }
  // current month
  for(var d=1;d<=dim;d++){
    var dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var evs=getEventsForDate(dk);
    var cls=dk===tk?' today':'';
    days+='<div class="cal-day'+cls+'" data-date="'+dk+'">'+
      '<span class="cal-dn">'+d+'</span>'+
      (evs.length?'<div class="cal-dots">'+evs.slice(0,3).map(function(e){return '<div class="cal-dot" style="background:'+(e.color||'var(--bamboo)')+'"></div>';}).join('')+'</div>':'')+
      '</div>';
  }
  // next month fill
  var total=first+dim,next=total%7===0?0:7-(total%7);
  for(var d=1;d<=next;d++){
    var dk=y+'-'+(m+2)+'-'+d;
    days+='<div class="cal-day other-month" data-date="'+dk+'"><span class="cal-dn">'+d+'</span></div>';
  }
  var tk=todayKey();
  // Show all events this month
  var monthEvs = [];
  for(var d=1;d<=dim;d++){
    var dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    getEventsForDate(dk).forEach(function(e){ 
      if(!monthEvs.find(function(x){return x.id===e.id;})) monthEvs.push(e);
    });
  }
  monthEvs.sort(function(a,b){return a.date>b.date?1:a.date<b.date?-1:0;});
  
  return '<div class="cal-weekdays">'+DAYS_HE.map(function(d){return '<div class="cal-weekday">'+d+'</div>';}).join('')+'</div>'+
    '<div class="cal-grid">'+days+'</div>'+
    '<div style="padding:10px 18px 0">'+
    (monthEvs.length?
      '<div style="font-size:14px;color:var(--t3);font-weight:700;letter-spacing:1.5px;margin-bottom:10px">📅 אירועי החודש</div>'+
      monthEvs.map(function(e){
        var dayNum = parseInt((e.date||'').split('-')[2]||'0');
        var monthNum = parseInt((e.date||'').split('-')[1]||'0');
        var dateLabel = dayNum ? dayNum+'.'+monthNum : '';
        var col = e.color||'var(--bamboo)';
        return '<div style="background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px;border-right:3px solid '+col+'" id="evc-'+e.id+'">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
          '<div style="flex:1">'+
          '<div style="font-size:14px;color:var(--gold);font-weight:700;margin-bottom:2px">'+dateLabel+(e.time?' · '+e.time:'')+'</div>'+
          '<div style="font-size:14px;color:var(--t1);font-weight:600">'+e.title+(e.site?' <span style="color:var(--gold);font-size:14px">🔗 '+e.site+'</span>':'')+'</div>'+
          (e.note?'<div style="font-size:14px;color:var(--t2);margin-top:2px">'+e.note+'</div>':'')+
          '</div>'+
          '<button id="del-ev-'+e.id+'" style="background:none;border:none;color:var(--t4);font-size:14px;padding:2px 6px;cursor:pointer">✕</button>'+

    '</div>';

// Clicking an event card jumps to whatever it's actually about: a linked
// site if one was set, otherwise a best-effort match to an existing task
// with the same text, otherwise nothing (there's no board to jump to).
function openEventLink(id){
  var ev = getEvents().find(function(e){return e.id===id;});
  if(!ev) return;
  if(ev.site && state.sites.some(function(s){return s.name===ev.site;})) {
    siteFilter='all';
    navigateTo('sites');
    return;
  }
  var norm = function(s){return (s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'').trim();};
  var allTasks = [...state.tasks.now,...state.tasks.today,...state.tasks.later];
  var match = allTasks.find(function(t){return norm(t.text)===norm(ev.title);});
  if(match) {
    taskBucket = state.tasks.now.some(function(t){return t.id===match.id;}) ? 'now' :
                 state.tasks.today.some(function(t){return t.id===match.id;}) ? 'today' : 'later';
    navigateTo('tasks');
  }
}

function requestNotificationPermission(){
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}

function scheduleNotification(ev){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!ev.notify&&ev.notify!==0)return;
  var parts=ev.date.split('-').map(Number);
  var tp=ev.time?ev.time.split(':').map(Number):[9,0];
  var evTime=new Date(parts[0],parts[1]-1,parts[2],tp[0],tp[1]);
  var notTime=new Date(evTime.getTime()-parseInt(ev.notify)*60*1000);
  var delay=notTime.getTime()-Date.now();
  if(delay>0&&delay<7*24*60*60*1000){
    setTimeout(function(){
      if(Notification.permission==='granted'){
        new Notification('Fieldy 📅 '+ev.title,{
          body:ev.notify==='0'?'עכשיו':'בעוד '+ev.notify+' דקות',
          icon:'/Fieldy/icon-192-1.png',tag:ev.id
        });
        playZenBell();
      }
    },delay);
  }
}

function scheduleAllNotifications(){
  getEvents().forEach(function(ev){if(ev.notify)scheduleNotification(ev);});
}

// ── AMBIENT MEDITATION MUSIC ──────────────────────────────────
var ambientNodes = [];
var ambientGain = null;
var musicMuted = false;

function startAmbientMusic() {
  stopAmbientMusic();
  try {
    var ctx = getAudio();
    ambientGain = ctx.createGain();
    ambientGain.gain.setValueAtTime(0, ctx.currentTime);
    ambientGain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 3);
    ambientGain.connect(ctx.destination);

    // Drone frequencies - calm and meditative
    var freqs = [110, 164.8, 220, 329.6];
    freqs.forEach(function(freq) {
      var osc = ctx.createOscillator();
      var oscGain = ctx.createGain();
      var filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.value = freq;
      // Very slow vibrato
      var lfo = ctx.createOscillator();
      var lfoGain = ctx.createGain();
      lfo.frequency.value = 0.08 + Math.random() * 0.05;
      lfoGain.gain.value = 0.3;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start();

      filter.type = 'lowpass';
      filter.frequency.value = 800;
      filter.Q.value = 0.5;

      oscGain.gain.value = freq > 200 ? 0.4 : 0.7;
      osc.connect(filter);
      filter.connect(oscGain);
      oscGain.connect(ambientGain);
      osc.start();

      ambientNodes.push(osc);
      ambientNodes.push(lfo);
    });

    // Add gentle noise layer (like distant wind)
    var bufSize = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    var data = buf.getChannelData(0);
    var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0;
    for(var i=0;i<bufSize;i++){
      var w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5)*0.05;
    }
    var noise = ctx.createBufferSource();
    var noiseGain = ctx.createGain();
    var noiseFilter = ctx.createBiquadFilter();
    noise.buffer = buf;
    noise.loop = true;
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 400;
    noiseFilter.Q.value = 0.3;
    noiseGain.gain.value = 0.06;
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ambientGain);
    noise.start();
    ambientNodes.push(noise);

    // Continuous water trickle (bubbling stream) — a second, higher, brighter
    // noise layer whose amplitude wobbles slowly and randomly so it reads as
    // moving water rather than flat static.
    var wBufSize = ctx.sampleRate * 2;
    var wBuf = ctx.createBuffer(1, wBufSize, ctx.sampleRate);
    var wData = wBuf.getChannelData(0);
    var wb0=0,wb1=0,wb2=0;
    for (var wi = 0; wi < wBufSize; wi++) {
      var ww = Math.random() * 2 - 1;
      wb0 = 0.95 * wb0 + ww * 0.15;
      wb1 = 0.90 * wb1 + ww * 0.25;
      wb2 = 0.80 * wb2 + ww * 0.40;
      wData[wi] = (wb0 + wb1 + wb2) * 0.18;
    }
    var water = ctx.createBufferSource();
    var waterFilter = ctx.createBiquadFilter();
    var waterGain = ctx.createGain();
    var waterWobble = ctx.createGain();
    water.buffer = wBuf;
    water.loop = true;
    waterFilter.type = 'bandpass';
    waterFilter.frequency.value = 1400;
    waterFilter.Q.value = 0.7;
    waterGain.gain.value = 0.05;
    // Slow, irregular LFO on the gain so the trickle bubbles rather than hisses evenly
    var waterLfo1 = ctx.createOscillator();
    var waterLfo1Gain = ctx.createGain();
    waterLfo1.type = 'sine';
    waterLfo1.frequency.value = 0.35;
    waterLfo1Gain.gain.value = 0.4;
    var waterLfo2 = ctx.createOscillator();
    var waterLfo2Gain = ctx.createGain();
    waterLfo2.type = 'sine';
    waterLfo2.frequency.value = 1.7;
    waterLfo2Gain.gain.value = 0.25;
    waterWobble.gain.value = 0.6;
    waterLfo1.connect(waterLfo1Gain); waterLfo1Gain.connect(waterWobble.gain);
    waterLfo2.connect(waterLfo2Gain); waterLfo2Gain.connect(waterWobble.gain);
    waterLfo1.start(); waterLfo2.start();
    water.connect(waterFilter);
    waterFilter.connect(waterWobble);
    waterWobble.connect(waterGain);
    waterGain.connect(ambientGain);
    water.start();
    ambientNodes.push(water, waterLfo1, waterLfo2);

  } catch(e) { console.log('Audio error:', e); }
}

function stopAmbientMusic() {
  ambientNodes.forEach(function(n) { try { n.stop(); } catch(e) {} });
  ambientNodes = [];
  if(ambientGain) {
    try { ambientGain.disconnect(); } catch(e) {}
    ambientGain = null;
  }
}

function toggleMusicMute() {
  musicMuted = !musicMuted;
  if(ambientGain) {
    var ctx = getAudio();
    ambientGain.gain.linearRampToValueAtTime(
      musicMuted ? 0 : 0.12,
      ctx.currentTime + 0.5
    );
  }
  var btn = document.getElementById('music-toggle-btn');
  if(btn) {
    btn.textContent = musicMuted ? '🔇 מוסיקה' : '🎵 מוסיקה';
    btn.style.color = musicMuted ? 'var(--t4)' : 'var(--sprout)';
  }
}

function toggleVoiceMute() {
  var btn = document.getElementById('voice-toggle-btn');
  if(window.speechSynthesis.speaking || window._voiceEnabled !== false) {
    window._voiceEnabled = false;
    window.speechSynthesis.cancel();
    if(btn) { btn.textContent = '🔇 הדרכה'; btn.style.color = 'var(--t4)'; }
  } else {
    window._voiceEnabled = true;
    if(btn) { btn.textContent = '🎤 הדרכה'; btn.style.color = 'var(--sprout)'; }
  }
}


var selectedVoiceIdx = -1;
function setMedVoice(idx) {
  selectedVoiceIdx = parseInt(idx);
}

function speakText(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  var utt=new SpeechSynthesisUtterance(text);
  var voices=window.speechSynthesis.getVoices();
  var v=voices.find(function(v){return v.lang.startsWith('he');})||
        voices.find(function(v){return v.lang.startsWith('en')&&v.name.toLowerCase().includes('female');})||
        voices[0];
  if(v)utt.voice=v;
  utt.rate=0.75;utt.pitch=0.9;utt.volume=0.85;
  window.speechSynthesis.speak(utt);
}

function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}

function startMeditationWithVoice(idx){
  window._voiceEnabled = true;
  musicMuted = false;
  try { startAmbientMusic(); } catch(e) { console.log('ambient err:', e); }
  startMeditation(idx);
  
  var scripts = MED_SCRIPTS[idx] || MED_SCRIPTS[0];
  var si = 0;

  // Voice selector controls added to modal
  setTimeout(function() {
    var modal = document.querySelector('.modal');
    if(!modal) return;
    var loadVoices = function() {
      var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      var enVoices = voices.filter(function(v){ return v.lang && v.lang.startsWith('en'); });
      var voiceOpts = '<option value="-1">אוטומטי (גבר)</option>';
      enVoices.forEach(function(v,i){
        var g = /female|woman|samantha|karen|moira|tessa|victoria|allison|zoe|fiona|ava|vicki/i.test(v.name) ? '♀' : '♂';
        voiceOpts += '<option value="'+i+'">'+g+' '+v.name.split('(')[0].trim()+'</option>';
      });
      var ctrl = document.createElement('div');
      ctrl.style.cssText = 'margin-top:10px';
      var lowVoiceNote = enVoices.length<=1 ? '<div style="font-size:14px;color:var(--t3);margin-bottom:6px;line-height:1.5">המכשיר שלך מזהה קול הדרכה אחד בלבד — הגוון ישתנה מעט לפי הבחירה, אך לקולות שונים לגמרי צריך להתקין קולות TTS נוספים ב-הגדרות Android ← נגישות ← המרת טקסט לדיבור.</div>' : '';
      ctrl.innerHTML = lowVoiceNote +
        '<select id="voice-select" style="width:100%;background:rgba(13,10,5,.9);border:1px solid rgba(184,134,11,.3);border-radius:10px;padding:9px 12px;color:var(--t1);font-size:14px;font-family:inherit;margin-bottom:7px">'+voiceOpts+'</select>'+
        '<div style="display:flex;gap:7px">'+
        '<button id="music-mute-btn" style="flex:1;padding:8px;border-radius:9px;background:rgba(28,21,8,.8);border:1px solid rgba(184,134,11,.3);color:var(--sprout);font-size:14px;cursor:pointer;font-family:inherit">🎵 מוסיקה</button>'+
        '<button id="voice-mute-btn" style="flex:1;padding:8px;border-radius:9px;background:rgba(28,21,8,.8);border:1px solid rgba(184,134,11,.3);color:var(--sprout);font-size:14px;cursor:pointer;font-family:inherit">🎤 הדרכה</button>'+
        '</div>';
      modal.appendChild(ctrl);
      var vs=document.getElementById('voice-select');
      var savedVoiceName = localStorage.getItem('fieldy_voice_name');
      if (savedVoiceName) {
        var savedIdx = enVoices.findIndex(function(v){ return v.name === savedVoiceName; });
        if (savedIdx >= 0) { selectedVoiceIdx = savedIdx; vs.value = String(savedIdx); }
      }
      if(vs) vs.onchange=function(){
        selectedVoiceIdx=parseInt(this.value);
        var chosen = enVoices[selectedVoiceIdx];
        if (chosen) localStorage.setItem('fieldy_voice_name', chosen.name);
        else localStorage.removeItem('fieldy_voice_name');
      };
      var mb=document.getElementById('music-mute-btn');
      if(mb) mb.onclick=toggleMusicMute;
      var vb=document.getElementById('voice-mute-btn');
      if(vb) vb.onclick=toggleVoiceMute;
    };
    var v=window.speechSynthesis?window.speechSynthesis.getVoices():[];
    if(v.length>0) loadVoices(); else window.speechSynthesis.onvoiceschanged=loadVoices;
  }, 500);

  function speakPhrase() {
    if(si >= scripts.length || !medInterval) return
    if(window._voiceEnabled === false) return
    var text = scripts[si]; si++
    // A brief natural pause before speaking — real guidance doesn't snap in
    // the instant the breath cycle turns over, it follows a beat behind it.
    setTimeout(function() {
      if(!medInterval) return
      window.speechSynthesis.cancel()
      var utt = new SpeechSynthesisUtterance(text)
      var voices = window.speechSynthesis.getVoices()
      var enVoices = voices.filter(function(v){ return v.lang && v.lang.startsWith('en') })
      var voice, vIdx
      if(selectedVoiceIdx >= 0 && selectedVoiceIdx < enVoices.length) {
        voice = enVoices[selectedVoiceIdx]; vIdx = selectedVoiceIdx
      } else {
        var malePref = ['Daniel','David','Oliver','James','Arthur','Aaron','Alex']
        voice = enVoices.find(function(v){ return malePref.some(function(n){ return v.name.indexOf(n)!==-1 }) }) ||
                enVoices.find(function(v){ return !/samantha|karen|moira|tessa|victoria|allison|zoe|fiona|ava|vicki/i.test(v.name) }) ||
                (enVoices.length ? enVoices[0] : null)
        vIdx = voice ? enVoices.indexOf(voice) : 0
      }
      if(voice) { utt.voice = voice; utt.lang = voice.lang }
      // Slower, warmer baseline so it reads as a calm guide rather than a
      // computer reading text — small per-voice variance kept so different
      // voice picks still sound distinct, but centered lower/slower than before.
      var vSeed = (vIdx || 0) + 1
      var pitchOffset = ((vSeed * 37) % 16) / 100 - 0.08 // -0.08..+0.08
      var rateOffset = ((vSeed * 53) % 12) / 100 - 0.06  // -0.06..+0.06
      utt.rate = Math.max(0.62, Math.min(0.86, 0.74 + rateOffset))
      utt.pitch = Math.max(0.7, Math.min(1.05, 0.87 + pitchOffset))
      utt.volume = 0.88
      window.speechSynthesis.speak(utt)
    }, 700 + Math.random() * 500)
  }

  // Speak roughly every 2nd or 3rd full breath cycle (~32-48s) instead of a
  // fixed independent clock — this keeps the narration in step with the
  // actual inhale/hold/exhale rhythm on screen, and the varying gap (rather
  // than a perfectly even one) is what reads as a person guiding, not a timer.
  var cyclesSinceSpoken = 0
  var cyclesUntilNext = 1
  window._onBreathCycle = function() {
    if(window._voiceEnabled === false) return
    cyclesSinceSpoken++
    if(cyclesSinceSpoken >= cyclesUntilNext) {
      cyclesSinceSpoken = 0
      cyclesUntilNext = 2 + Math.round(Math.random())  // next gap: 2 or 3 cycles
      speakPhrase()
    }
  }

  var v = window.speechSynthesis ? window.speechSynthesis.getVoices() : []
  if(v.length > 0) { setTimeout(speakPhrase, 5500) }
  else { window.speechSynthesis.onvoiceschanged = function(){ setTimeout(speakPhrase, 5500) } }
}
