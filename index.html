<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#f6efdb"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fieldy"/>
<link rel="manifest" href="/Fieldy/manifest.json"/>
<link rel="icon" type="image/png" sizes="32x32" href="/Fieldy/icon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/Fieldy/icon-180.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="/Fieldy/icon-152.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Fieldy</title>
<style>
/* ── Design tokens ─────────────────────────────────────────────────────────
   Spacing, radius, shadow and type scale as CSS variables. The values are
   exactly the ones the stylesheet already used, so introducing them changes
   nothing visually; they exist so the visual pass (Phase 4) has one dial per
   property instead of hundreds of scattered literals. Inline styles in the
   render functions still carry literals on purpose — they get migrated in
   that pass, screen by screen, against the snapshot suite.               */
:root{
  /* spacing (4px base) */
  --space-1:4px;--space-1-5:6px;--space-2:8px;--space-2-5:10px;--space-3:12px;--space-3-5:14px;
  --space-4:16px;--space-4-5:18px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  /* corner radius */
  --radius-sm:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:14px;--radius-2xl:16px;--radius-3xl:18px;--radius-pill:99px;
  /* elevation — the app is deliberately flat today; nothing uses these yet */
  --shadow-none:none;--shadow-sm:0 1px 2px rgba(43,38,32,.06);--shadow-md:0 4px 12px rgba(43,38,32,.08);--shadow-lg:0 10px 30px rgba(43,38,32,.12);
  /* type scale */
  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-lg:15px;--fs-xl:16px;--fs-2xl:18px;--fs-3xl:22px;--fs-4xl:26px;
  /* surfaces */
  --surface:#ffffff;--surface-2:#f0e7cf;--surface-3:#fdf9ee;--surface-input:#fffdf6;--accent-soft:#fdf1da;--accent-line:#f0d9a3;--gold-deep:#a8711a;--t5:#e3d9bd;
  /* large-fill colours, themed (see THEMES): stat tiles, the primary CTA, the progress track */
  --tile-a1:#a46908;--tile-a2:#a56108;--tile-a-label:#fde8c4;--tile-b1:#18826f;--tile-b2:#147263;--tile-b-label:#c8ebe3;--tile-c1:#735bac;--tile-c2:#5f4792;--tile-c-label:#dfd3f5;
  --green-rgb:2,134,113;--green-light-rgb:74,222,128;--purple-rgb:107,70,193;--green-ink:#007e69;
  --cta1:#a0690d;--cta2:#956d0b;--progress-track:#eee3c9;--accent-rgb:184,121,15;
  /* status / meaning colours (fixed across themes — they carry meaning) */
  --red:#ef4444;--red-dark:#c0392b;--red-soft:#fdeaea;--orange:#e8940c;--amber:#f59e0b;--amber-line:#f5c877;--green:#028671;--green-light:#4ade80;--purple:#6b46c1;--stuck:#b84600;--stuck-soft:#fdece0;--blue:#3d5a80;--blue-soft:#eef2f7;--blue-line:#cdd9e8;
  /* the Tao screen's quiet dark palette */
  --tao-ink:#9a6a00;--tao-accent-rgb:184,134,11;--tao-bg-rgb:13,10,5;--tao-panel-rgb:28,21,8;
  --tao-bg:#0d0a05;--tao-bg2:#120d06;--tao-panel:#1c1508;--tao-panel2:#1c140a;--tao-line:#241b0d;--tao-line2:#3a2c10;--tao-t1:#f5ecd6;--tao-t1b:#d8c9a3;--tao-t2:#b3a077;--tao-t3:#8a7857;--tao-gold:#e8c15c;--tao-gold2:#cf9d2e;--tao-gold3:#b8860b;
  /* motion */
  --ease-out:cubic-bezier(.2,.8,.2,1);--dur-fast:120ms;--dur-base:180ms;--dur-slow:260ms;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;background:var(--ink);color:var(--t1);direction:rtl;height:100vh;overflow:hidden;font-weight:400;font-size:var(--fs-lg)}
/* English UI mode: swap font order (Latin-first) and let dir=ltr (set on <html>) flip layout; only the interface, never Tao/meditation content or AI output, is ever in English. */
body.lang-en{font-family:'IBM Plex Sans','IBM Plex Sans Hebrew',system-ui,sans-serif;direction:ltr}
.font-display{font-family:'IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-0.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea,select,input{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:120px}
.hidden{display:none!important}
/* Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface-2);border-top:1px solid var(--line);display:grid;grid-template-columns: repeat(6, 1fr);align-items:start;padding:8px 0 24px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:var(--space-1-5) 2px;cursor:pointer;background:none;border:none;position:relative;min-width:0}
.nav-icon{display:flex;align-items:center;justify-content:center;line-height:1}
.nav-label{font-size:10.5px;color:var(--t3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-btn.active .nav-label{color:var(--gold);font-weight:700}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:var(--orange);color:#fff;border-radius:var(--radius-pill);font-size:var(--fs-2xs);font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
/* Cards */
.card{background:var(--surface);border-radius:var(--radius-xl);padding:var(--space-3-5);margin-bottom:var(--space-2)}
.card-red{border:1.5px solid #ef444460;background:var(--red-soft)}
.card-orange{border:1.5px solid #f59e0b60;background:#f59e0b18}
.card-green{border:1.5px solid rgba(var(--green-light-rgb),.38);background:rgba(var(--green-light-rgb),.09)}
/* Buttons */
.btn-primary{width:100%;padding:var(--space-4);border-radius:var(--radius-xl);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-size:var(--fs-xl);font-weight:700;display:block;border:none;cursor:pointer}
.btn-secondary{padding:var(--space-3-5) var(--space-4-5);border-radius:var(--radius-lg);border:1px solid var(--t4);background:transparent;color:var(--t2);font-size:var(--fs-base);cursor:pointer}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:#000d;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:430px;border-radius:var(--radius-3xl) var(--radius-3xl) 0 0;padding:22px var(--space-4) var(--space-10);max-height:85vh;overflow-y:auto}
/* Form */
.form-label{font-size:var(--fs-base);color:var(--t2);margin-bottom:var(--space-1);display:block}
.form-input{width:100%;background:var(--surface-2);border:1px solid var(--t4);border-radius:var(--radius-md);padding:11px var(--space-3);color:var(--t1);font-size:var(--fs-base);outline:none;display:block;margin-bottom:var(--space-2-5);direction:rtl}
.form-select{width:100%;background:var(--surface-2);border:1px solid var(--t4);border-radius:var(--radius-sm);padding:var(--space-2-5) var(--space-2);color:var(--t1);font-size:var(--fs-base);outline:none}
/* Tags */
/* site search and its filter chips (every theme) */
.site-search-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.site-search{position:relative;flex:1;min-width:0}
.site-region-btn .ic{width:16px;height:16px;flex:none}
.region-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 10px;background:none;text-align:start;color:var(--t1)}
.region-row + .region-row{border-top:1px solid var(--line)}
.region-box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--gold);display:grid;place-items:center;color:#fff;font-size:15px}
.region-row[aria-checked="true"] .region-box{background:var(--gold)}
.region-name{flex:1;font-size:var(--fs-lg);font-weight:600}
.region-count{font-size:var(--fs-sm);color:var(--t3)}
.site-search-ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:15px;color:var(--t3);display:flex;pointer-events:none}
.site-search-x{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:4px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:none}
#site-search::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.site-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--space-4));padding:2px var(--space-4)}
.site-chips::-webkit-scrollbar{display:none}
mark.hl{background:rgba(var(--accent-rgb),.2);color:inherit;border-radius:4px;padding:0 1px}
/* selecting sites for a route (every theme) */
.site-check{flex:none;width:44px;height:44px;margin-block:-10px;margin-inline-start:-10px;display:grid;place-items:center;background:none;padding:0}
.site-check span{width:24px;height:24px;border-radius:7px;border:2px solid var(--gold);display:grid;place-items:center;color:#fff;font-size:15px}
.site-check[aria-checked="true"] span{background:var(--gold)}
#screen-sites .card.is-selected{outline:2px solid var(--gold);outline-offset:-2px}
#screen-sites[data-selecting]{padding-bottom:210px}
#screen-sites[data-selecting] .site-actions{display:none!important}
#screen-sites[data-selecting] [data-key]{cursor:pointer}
/* a long-press on a card selects it, so the phone's own long-press (text
   selection, the link callout) is turned off on the cards */
#screen-sites [data-key]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.site-nav-link{display:inline-grid;place-items:center;width:32px;padding:3px 0!important}
.site-selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;box-sizing:border-box;width:calc(100% - 28px);max-width:402px;
  display:flex;align-items:center;gap:8px;padding:7px;padding-inline-start:16px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
/* the screen's enter animation moves it with a transform, which would carry
   a fixed child with it for a moment; the bar stays invisible for that long.
   A one-shot animation of its own rather than hiding it while .enter is set:
   under reduced motion the screen never animates, .enter is never removed,
   and the bar must still appear. */
@keyframes selbar-wait{0%,99%{visibility:hidden}100%{visibility:visible}}
.screen.enter .site-selbar{animation:selbar-wait var(--dur-base) linear}
.site-selbar-n{flex:1;min-width:0;font-size:var(--fs-base);font-weight:700;color:var(--t1)}
.site-selbar-go{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border-radius:14px;padding:10px 16px;min-height:44px;font-size:var(--fs-base);font-weight:700}
.site-selbar-go:disabled{opacity:.45;cursor:default}
.site-selbar-x{background:var(--surface-2);color:var(--t2);border-radius:14px;padding:10px 14px;min-height:44px;font-size:var(--fs-base);font-weight:600}
.site-titlebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;min-height:40px}
.site-hbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;padding:0}
.site-hbtn-add{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff}
/* the site card: compact, the drawer opens on a tap (every theme) */
.site-card{cursor:pointer}
.site-nav{flex:none;width:44px;height:44px;margin:-6px -4px -6px -6px;display:grid;place-items:center;border-radius:50%;color:var(--gold);background:var(--accent-soft);font-size:18px}
.site-status-tag{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:4px 13px;cursor:pointer;font-weight:600}
.site-more{margin-inline-start:auto;color:var(--t3);display:flex;font-size:18px;transition:transform .15s}
.site-card.is-open .site-more{transform:rotate(180deg)}
.st-picker{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2);cursor:default}
.st-picker-l{font-size:var(--fs-sm);color:var(--t3)}
.st-opt{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 14px;cursor:pointer;font-weight:600}
.site-drawer{cursor:default}
.tag{font-size:var(--fs-base);padding:3px 9px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--t2)}
/* Per-kind tint for the small pills on a task card (site/person/context/
   time) — was one flat muted colour for everything, which read as bland. */
.tag-site{background:var(--blue-soft);color:var(--blue)}
.tag-person{background:rgba(var(--purple-rgb),.11);color:var(--purple)}
.tag-context{background:rgba(var(--green-rgb),.11);color:var(--green)}
.tag-time{background:var(--accent-soft);color:var(--gold)}
.tag-red{background:#ef444422;color:var(--red);font-weight:600}
.tag-orange{background:#f59e0b22;color:var(--amber);font-weight:600}
.tag-green{background:rgba(var(--green-light-rgb),.13);color:var(--green-ink);font-weight:600}
.tag-status-open{background:#ef444422;color:var(--red);font-weight:600}
.tag-status-pending{background:#f59e0b22;color:var(--amber);font-weight:600}
.tag-status-resolved{background:rgba(var(--green-light-rgb),.13);color:var(--green-ink);font-weight:600}
/* Checkbox */
.cb{width:26px;height:26px;border-radius:var(--radius-sm);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:var(--fs-base);color:#fff;transition:all 0.15s;border:2px solid}
/* Progress */
.progress-bar{background:var(--progress-track);border-radius:var(--radius-pill);height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:var(--radius-pill);transition:width 0.4s;background:linear-gradient(90deg,var(--gold),var(--gold2))}
/* Screens header */
.screen-header{padding:var(--space-12) var(--space-4) var(--space-3);background:linear-gradient(180deg,var(--surface-3),var(--ink));position:sticky;top:0;z-index:10}
/* Empty state */
.empty{text-align:center;padding:60px 0;color:var(--t4)}
.empty-icon{font-size:40px;margin-bottom:var(--space-2-5)}
.empty-text{font-size:var(--fs-base)}
/* Action result */
.action-result{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:var(--space-4);font-size:var(--fs-lg);color:var(--t1);line-height:1.8;white-space:pre-wrap;margin-bottom:var(--space-3);direction:ltr;text-align:left;max-height:300px;overflow-y:auto}

/* ── NACHAL ────────────────────────────────────────
   A deep teal-green room with near-opaque mint-white cards. The page is dark
   and every surface that carries text is light, so text sits either on a
   light card (the app's normal dark tokens) or on the dark page (white, set
   explicitly below) — never in between. Every rule is scoped to
   :is([data-theme="nachal"],[data-theme="jungle"]), so the other three themes keep their exact pixels.
   There are no photographs: the page is a gradient and four soft shapes, all
   CSS, so nothing here has to be downloaded and nothing sits behind text that
   was not measured. backdrop-filter is used on two large cards, the thin
   server strip, the search pill and the nav bar only. */
:is([data-theme="nachal"],[data-theme="jungle"]){
  --nh-card-a:.95;--nh-nav-a:.70;--nh-nav-blur:22px;
  --nh-on-dark:#ffffff;--nh-on-dark2:#E6F0EA;
  --nh-sage:#4A7760;--nh-sage-deep:#3A6149;--nh-capsule:#BCD9CD}
/* no backdrop-filter, or the device asks for less transparency: denser surfaces */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :is([data-theme="nachal"],[data-theme="jungle"]){--nh-card-a:.99;--nh-nav-a:.97}}
@media (prefers-reduced-transparency:reduce){
  :is([data-theme="nachal"],[data-theme="jungle"]){--nh-card-a:1;--nh-nav-a:.99}}
:is([data-theme="nachal"],[data-theme="jungle"]) body{background:#2A3F3E}
/* the room: deep teal-green with sage light pooling at the left and teal-grey
   on the right. This reuses the page's existing atmosphere layer, so no new
   element is added for any theme. */
:is([data-theme="nachal"],[data-theme="jungle"]) #bg-atmosphere{
  background:
    radial-gradient(64% 30% at 0% 30%,rgba(126,162,100,.58),rgba(126,162,100,0) 74%),
    radial-gradient(58% 34% at 100% 44%,rgba(42,68,68,.80),rgba(42,68,68,0) 76%),
    radial-gradient(70% 20% at 0% 66%,rgba(80,112,84,.50),rgba(80,112,84,0) 76%),
    linear-gradient(168deg,#496A4F 0%,#385844 30%,#304944 62%,#2A3F3E 100%)}
:is([data-theme="nachal"],[data-theme="jungle"]) #bg-atmosphere::before,
:is([data-theme="nachal"],[data-theme="jungle"]) #bg-atmosphere::after{display:none}
/* the four drifting blobs become three still shapes: a pale streak from the
   top, a small leaf, and a soft disc of light that the nav bar floats across */
:is([data-theme="nachal"],[data-theme="jungle"]) .bg-blob{animation:none!important;opacity:1;will-change:auto;right:auto;bottom:auto}
:is([data-theme="nachal"],[data-theme="jungle"]) .bg-blob-gold{width:120px;height:220px;left:calc(50% - 83px);top:-90px;border-radius:50%;
  transform:rotate(8deg);filter:blur(14px);
  background:linear-gradient(180deg,rgba(168,200,182,.34),rgba(168,200,182,0))}
:is([data-theme="nachal"],[data-theme="jungle"]) .bg-blob-teal{width:50px;height:46px;left:calc(50% - 145px);top:84px;
  border-radius:62% 38% 70% 30% / 58% 44% 56% 42%;transform:rotate(-24deg);filter:blur(1.5px);
  background:linear-gradient(150deg,#6F9170,#4C6B50);opacity:.9}
:is([data-theme="nachal"],[data-theme="jungle"]) .bg-blob-terracotta{width:230px;height:200px;left:calc(50% - 135px);top:auto;bottom:-70px;
  border-radius:50%;filter:blur(3px);
  background:radial-gradient(circle at 46% 38%,rgba(172,196,160,.9),rgba(150,182,140,.55) 70%)}
:is([data-theme="nachal"],[data-theme="jungle"]) .bg-blob-purple{display:none}
/* text written straight on the page is white; anything on a light surface
   goes back to the app's dark tokens */
:is([data-theme="nachal"],[data-theme="jungle"]) .screen{color:var(--nh-on-dark)}
:is([data-theme="nachal"],[data-theme="jungle"]) .card,
:is([data-theme="nachal"],[data-theme="jungle"]) .accordion,
:is([data-theme="nachal"],[data-theme="jungle"]) .modal,
:is([data-theme="nachal"],[data-theme="jungle"]) .screen-header,
:is([data-theme="nachal"],[data-theme="jungle"]) .cal-header,
:is([data-theme="nachal"],[data-theme="jungle"]) .ev-card,
:is([data-theme="nachal"],[data-theme="jungle"]) .form-input,
:is([data-theme="nachal"],[data-theme="jungle"]) .form-select{color:var(--t1)}
:is([data-theme="nachal"],[data-theme="jungle"]) .empty{color:var(--nh-on-dark2)}
/* mint-white cards: near-opaque, large radius, the weight inside the glass
   rather than a slab of shadow beneath it */
:is([data-theme="nachal"],[data-theme="jungle"]) .card{
  background:rgba(240,248,243,var(--nh-card-a))!important;
  border-radius:22px;
  box-shadow:0 14px 30px -18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7)}
:is([data-theme="nachal"],[data-theme="jungle"]) .card:not([style*="border"]){border:1px solid rgba(255,255,255,.4)}
:is([data-theme="nachal"],[data-theme="jungle"]) .card.glass{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
:is([data-theme="nachal"],[data-theme="jungle"]) .accordion[data-acc="nh-more"]{
  background:rgba(240,248,243,var(--nh-card-a));border:1px solid rgba(255,255,255,.4);border-radius:22px;
  padding:14px 16px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7)}
/* screen headers (tasks, sites, people, calendar) become a light sheet */
:is([data-theme="nachal"],[data-theme="jungle"]) .screen-header,
:is([data-theme="nachal"],[data-theme="jungle"]) .cal-header{
  background:rgba(240,248,243,var(--nh-card-a))!important;border-bottom:none!important;
  border-radius:0 0 26px 26px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
/* the floating nav capsule: frosted, with the active destination as a pale
   capsule that holds its icon and its label together */
:is([data-theme="nachal"],[data-theme="jungle"]) #nav{
  width:calc(100% - 28px);max-width:402px;bottom:16px;padding:6px 4px;border-radius:99px;align-items:center;
  background:rgba(226,238,231,var(--nh-nav-a))!important;
  -webkit-backdrop-filter:blur(var(--nh-nav-blur)) saturate(1.3);backdrop-filter:blur(var(--nh-nav-blur)) saturate(1.3);
  border:1px solid rgba(255,255,255,.5)!important;
  box-shadow:0 18px 34px -14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.55)!important}
:is([data-theme="nachal"],[data-theme="jungle"]) .nav-btn{padding:8px 2px;border-radius:22px;gap:3px;justify-content:center}

/* ── Enchanted jungle ──
   Built on Nachal (every Nachal rule above also matches the jungle, and the
   nav is untouched), then dressed here: a deep olive-jungle room on every
   screen, light glass cards, a flowering progress vine under the greeting,
   and botanical climbers at a few corners and edges. Their fairy-forest glow
   is a drop-shadow around the drawing only (mint for leaves, warm gold for
   hoya and star flowers), with a few still golden sparkles that breathe
   slowly when motion is allowed. Climbers never take pointer events, never
   sit on text or buttons, and there are at most two on a screen. Status is a
   small glass bead (coral, soft amber, jade) beside an ink word; "stuck" is
   an even coral capsule. The task tick is a leaf. No new backdrop-filter. */
[data-theme="jungle"]{--nh-hdr-rgb:16,38,24;--nh-soft-rgb:236,243,230;--nh-soft-a:.8;
  --jg-mint:rgba(170,255,220,.55);--jg-gold:rgba(255,225,150,.6);
  --coral-1:hsl(6 64% 76%);--coral-2:hsl(6 52% 54%);--amber-1:hsl(38 64% 76%);--amber-2:hsl(38 52% 50%);--jade-1:hsl(162 52% 72%);--jade-2:hsl(162 52% 36%)}
[data-theme="jungle"] body{background:#1B2C20}
[data-theme="jungle"] #bg-atmosphere{background:
  radial-gradient(64% 30% at 0% 26%,rgba(132,164,96,.40),rgba(132,164,96,0) 74%),
  radial-gradient(60% 34% at 100% 50%,rgba(18,40,26,.75),rgba(18,40,26,0) 76%),
  radial-gradient(70% 22% at 8% 72%,rgba(84,118,78,.34),rgba(84,118,78,0) 76%),
  linear-gradient(168deg,#3D5C42 0%,#2F4E37 30%,#243E2D 62%,#1A2F23 100%)}
[data-theme="jungle"] .bg-blob{display:none}

[data-theme="jungle"] :is(#screen-sites,#screen-tasks,#screen-people,#screen-calendar)::before{display:none}
[data-theme="jungle"] #screen-home{padding-bottom:120px}
[data-theme="jungle"] :is(#screen-home,#screen-sites,#screen-tasks,#screen-people,#screen-calendar)::after{
  content:'';position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:50;pointer-events:none;width:100%;max-width:430px;height:112px;
  background:linear-gradient(to bottom,rgba(20,38,26,0) 0,rgba(20,38,26,.6) 30%,rgba(20,38,26,.74) 100%);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%)}

/* climbers */

/* Console Palette — warm cream + amber accent (light, reading-app inspired) */
:root{
  --ink:#f6efdb;--ink2:#fdf9ee;--ink3:#ffffff;
  --washi:#211d17;--warm:#3d362c;
  --matcha:#946011;--matcha2:#8a7550;
  --gold:#b8790f;--gold2:#c9930f;
  --terracotta:#8b4513;--rust:#a0522d;
  --cherry:#b8790f;
  --text1:#211d17;--text2:#6b6255;--text3:#948a7a;
  --t1:#211d17;--t2:#6b6255;--t3:#948a7a;--t4:#b0a68f;
  --bamboo:#b8790f;--bamboo2:#946011;--sprout:#b8790f;
  --border:rgba(43,38,32,.14);--glass2:rgba(255,255,255,.92);
  --line:rgba(43,38,32,.09);
}
.tao-screen{background:linear-gradient(180deg,var(--ink) 0%,var(--ink) 100%);min-height:100%}
.tao-card{background:linear-gradient(135deg,var(--surface-3),var(--surface-3));border:1px solid var(--gold-deep);border-radius:var(--radius-2xl);padding:var(--space-5);position:relative;overflow:hidden}
.tao-verse{font-size:var(--fs-xl);line-height:2.4;color:var(--t1);text-align:center;font-weight:300;letter-spacing:0.5px}
.tao-chapter-num{font-size:var(--fs-base);color:var(--gold);font-weight:600;letter-spacing:2px;margin-bottom:var(--space-3);text-align:center}
.tao-title{font-size:var(--fs-base);color:var(--t2);text-align:center;margin-bottom:var(--space-4);font-style:italic}
.med-timer{font-size:48px;font-weight:200;color:var(--t1);text-align:center;letter-spacing:4px}
.med-circle{width:180px;height:180px;border-radius:50%;border:2px solid var(--gold-deep);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;background:radial-gradient(circle,rgba(var(--accent-rgb),0.08),transparent)}
.breath-text{font-size:var(--fs-2xl);color:var(--tao-ink);text-align:center;margin-top:var(--space-4);font-weight:300;letter-spacing:1px}
/* Quick calm — the 60-second breathing break offered from the home screen when
   the mood is overwhelmed/scattered. Deliberately NOT the Tao meditation: it
   lives on the cream surface, has no narration, no music and no steps to read.
   The ring scales with the breath so the body can follow it without reading. */
.qc-ring{width:150px;height:150px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative;
  border:2px solid var(--gold-deep);background:radial-gradient(circle,rgba(var(--accent-rgb),0.10),transparent);
  transition:transform var(--dur-slow) var(--ease-out)}
.qc-ring[data-phase="0"]{transform:scale(1.14)}
.qc-ring[data-phase="1"]{transform:scale(1.14)}
.qc-ring[data-phase="2"]{transform:scale(0.86)}
.qc-ring[data-phase="3"]{transform:scale(0.86)}
.qc-ring.qc-slow{transition-duration:3.6s;transition-timing-function:linear}
.qc-count{font-size:40px;font-weight:200;color:var(--t1);letter-spacing:2px}
.qc-phase{font-size:var(--fs-2xl);color:var(--gold);text-align:center;margin-top:var(--space-4);font-weight:400;letter-spacing:1px;min-height:26px}
.qc-left{font-size:var(--fs-sm);color:var(--t3);text-align:center;margin-top:var(--space-2)}
@media (prefers-reduced-motion:reduce){.qc-ring,.qc-ring.qc-slow{transition:none!important;transform:none!important}}
.brush{position:absolute;opacity:0.06;font-size:120px;pointer-events:none;user-select:none;color:var(--gold-deep)}
@keyframes ripple{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.5);opacity:0}}
.success-ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:2px solid var(--gold-deep);pointer-events:none;z-index:999;animation:ripple 0.7s ease-out forwards}


/* === WARM ATMOSPHERE ===
   Cards lift softly off the page (a hint of shadow, not a hairline outline)
   so the eye can group content by depth, the way Calm's cards separate from
   its background — while staying in Fieldy's own warm cream/gold palette,
   not switching to a dark theme. */

body {
  background: var(--ink);
}

.screen-header {
  background: linear-gradient(180deg, var(--surface-3), var(--ink)) !important;
  border-bottom: none !important;
}

.card {
  background: var(--surface) !important;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s ease, transform .1s ease;
}
.card:active { box-shadow: none; transform: translateY(1px); }
/* Cards that don't set their own border keep the old hairline; ones that do
   (status-coloured site cards, the right-now list) are left alone — no
   !important here on purpose, so a per-instance border always wins. */
.card:not([style*="border"]) { border: 1px solid var(--line); }

#nav {
  background: var(--surface-3) !important;
  border-top: none !important;
  box-shadow: 0 -4px 16px rgba(43,38,32,.07);
}

/* Active nav: accent colour + a soft pill underline */
.nav-btn.active .nav-icon svg { stroke: var(--gold); }
.nav-btn .nav-icon svg { stroke: var(--t3); transition: stroke .15s; }
.nav-btn.active::after {
  content:'';
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:24px; height:3px; background:var(--gold); border-radius:var(--radius-pill);
}

.success-ring {
  border-color: var(--gold) !important;
}

.modal {
  background: var(--surface-input) !important;
  border-top: none !important;
  box-shadow: var(--shadow-lg);
}

.screen {
  transition: opacity 0.15s ease;
}

/* Circular colour badge behind an identity icon (mood, right-now, personal
   toggles) — the "colourful chip" treatment, kept in-palette per colour. */
.icon-badge { display:inline-flex; align-items:center; justify-content:center; width:2.3em; height:2.3em; border-radius:50%; flex-shrink:0 }
.icon-badge .ic { width:1.15em; height:1.15em }

/* Tao screen keeps its own quiet, separate dark atmosphere on purpose */
#screen-tao {
  background: linear-gradient(180deg, var(--ink) 0%, var(--ink) 100%);
}

.form-input, .form-select {
  background: var(--surface-input) !important;
  border: 1px solid var(--line) !important;
  color: var(--text1) !important;
}

::-webkit-scrollbar { width: 2px; }
::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb),0.25); border-radius:var(--radius-pill); }

/* Signature backdrop: a few soft colour glows (the same accent colours used
   for icon badges elsewhere — gold, teal-green, terracotta, purple) drifting
   very slowly, a faint topographic contour (ties back to the actual subject
   — field survey / terrain), and a fine grain for texture. Replaces the old
   flat single-colour page + one 5%-opacity line pattern, which read as
   dated/empty behind screens with few cards. Purely atmospheric — very low
   opacity, pointer-events:none, sits behind #app — and the drift is skipped
   entirely for reduced-motion users (see prefers-reduced-motion below). */
#bg-atmosphere {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
#bg-atmosphere::before {
  content: '';
  position: absolute;
  inset: -10%;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20430%20800'%20opacity='0.05'%3E%3Cstyle%3Epath%7Bfill:none;stroke:%23c9a227;stroke-width:1%7D%3C/style%3E%3Cpath%20d='M-20%20120%20Q100%2080%20220%20130%20Q320%20170%20460%20110'/%3E%3Cpath%20d='M-20%20180%20Q110%20145%20230%20190%20Q330%20225%20460%20170'/%3E%3Cpath%20d='M-20%20560%20Q120%20520%20240%20565%20Q330%20600%20460%20545'/%3E%3Cpath%20d='M-20%20620%20Q130%20585%20250%20625%20Q340%20655%20460%20605'/%3E%3Cpath%20d='M-20%20680%20Q140%20648%20260%20685%20Q350%20712%20460%20665'/%3E%3C/svg%3E");
  background-size: cover;
  background-position: center;
}
#bg-atmosphere::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 140px 140px;
  opacity: .05;
  mix-blend-mode: overlay;
}
.bg-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .38;
  will-change: transform;
}
.bg-blob-gold { width: 260px; height: 260px; top: -70px; right: -50px; background: radial-gradient(circle, var(--gold), transparent 70%); animation: blob-drift-a 46s ease-in-out infinite alternate; }
.bg-blob-teal { width: 220px; height: 220px; top: 32%; left: -80px; background: radial-gradient(circle, var(--green), transparent 70%); animation: blob-drift-b 52s ease-in-out infinite alternate; }
.bg-blob-terracotta { width: 280px; height: 280px; bottom: -90px; right: 8%; background: radial-gradient(circle, var(--terracotta), transparent 70%); animation: blob-drift-c 60s ease-in-out infinite alternate; }
.bg-blob-purple { width: 200px; height: 200px; bottom: 12%; left: -60px; background: radial-gradient(circle, var(--purple), transparent 70%); animation: blob-drift-d 55s ease-in-out infinite alternate; }
@keyframes blob-drift-a { from { transform: translate(0,0); } to { transform: translate(-26px, 30px); } }
@keyframes blob-drift-b { from { transform: translate(0,0); } to { transform: translate(32px, -22px); } }
@keyframes blob-drift-c { from { transform: translate(0,0); } to { transform: translate(-22px, -28px); } }
@keyframes blob-drift-d { from { transform: translate(0,0); } to { transform: translate(26px, 24px); } }
@media (prefers-reduced-motion: reduce) { .bg-blob { animation: none !important; } }

#app {
  position: relative;
  z-index: 1;
}

#screen-tao::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20430%20800%27%20opacity%3D%270.05%27%3E%0A%20%20%3Cstyle%3Eellipse%7Bfill%3Anone%3Bstroke%3A%23c9a227%3Bstroke-width%3A1%7D%3C/style%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2720%27%20ry%3D%278%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2750%27%20ry%3D%2720%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2790%27%20ry%3D%2736%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%27140%27%20ry%3D%2756%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%27200%27%20ry%3D%2780%27/%3E%0A%3C/svg%3E");
  background-size: cover;
  pointer-events: none;
  z-index: 0;
}

#screen-tao > * {
  position: relative;
  z-index: 1;
}

.cal-header{padding:52px var(--space-4-5) var(--space-3);background:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2-5)}
.cal-nav-btn{background:var(--ink3);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3-5);color:var(--t2);font-size:var(--fs-2xl);cursor:pointer}
.cal-month-title{font-size:var(--fs-2xl);font-weight:700;color:var(--t1);text-align:center}
.cal-view-tabs{display:flex;gap:var(--space-1)}
.cal-view-tab{flex:1;padding:var(--space-2) var(--space-1);border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:var(--fs-base);font-weight:600;cursor:pointer;color:var(--t3);background:transparent;transition:all .2s}
.cal-view-tab.active{background:rgba(var(--accent-rgb),.12);color:var(--gold);border:1px solid rgba(var(--accent-rgb),.25)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:var(--space-2) var(--space-2) 2px}
.cal-weekday{font-size:var(--fs-base);color:var(--t3);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 var(--space-2) var(--space-2);gap:2px}
.cal-day{aspect-ratio:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;border:1px solid transparent}
.cal-day.today{background:rgba(var(--accent-rgb),.14);border-color:var(--gold)}
.cal-day.today .cal-dn{color:var(--gold);font-weight:800}
.cal-day.other-month .cal-dn{color:var(--t4)}
.cal-dn{font-size:var(--fs-base);font-weight:500;color:var(--t2);line-height:1}
.cal-dots{display:flex;gap:2px;margin-top:2px}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.ev-card{background:var(--ink3);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-3-5);margin-bottom:var(--space-2);border-right:3px solid var(--gold);cursor:pointer;box-shadow:var(--shadow-sm)}
.week-epill{box-shadow:var(--shadow-sm)}
.ev-time{font-size:var(--fs-base);color:var(--gold);font-weight:700;margin-bottom:3px}
.ev-title{font-size:var(--fs-base);color:var(--t1);font-weight:600;line-height:1.4}
.ev-note{font-size:var(--fs-base);color:var(--t2);margin-top:3px;line-height:1.5}
.week-row{display:flex;align-items:flex-start;gap:var(--space-2-5);padding:var(--space-2-5) var(--space-4-5);border-bottom:1px solid var(--line);min-height:52px;cursor:pointer}
.week-dlabel{width:36px;flex-shrink:0}
.week-dname{font-size:var(--fs-base);color:var(--t3);font-weight:600}
.week-dnum{font-size:var(--fs-2xl);font-weight:700;color:var(--t2);line-height:1}
.week-dnum.today{color:var(--sprout)}
.week-epill{background:rgba(var(--accent-rgb),.15);border:1px solid rgba(var(--accent-rgb),.25);border-radius:var(--radius-sm);padding:5px var(--space-2-5);margin-bottom:var(--space-1);font-size:var(--fs-base);color:var(--t1);font-weight:500}
/* Component classes shared by the render helpers */
.panel-label{font-size:var(--fs-sm);color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:var(--space-2)}
.tao-label{font-size:var(--fs-xs);color:var(--tao-gold);letter-spacing:1.5px;font-weight:700;margin-bottom:var(--space-3)}
.muted{color:var(--t3)}
/* Screen + sheet motion (kept short; skipped entirely for reduced-motion users) */
@keyframes screen-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sheet-up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.screen.enter{animation:screen-in var(--dur-base) var(--ease-out)}
.modal-overlay{animation:fade-in var(--dur-fast) ease-out}
.modal{animation:sheet-up var(--dur-slow) var(--ease-out)}
.nav-btn .nav-icon{transition:transform var(--dur-fast) var(--ease-out)}
.nav-btn:active .nav-icon{transform:scale(.88)}
button:active{opacity:.85}
@media (prefers-reduced-motion:reduce){.screen.enter,.modal-overlay,.modal{animation:none}*{transition:none!important}}
/* Skeleton placeholder shown while an AI call is in flight */
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel{padding:var(--space-1) 0}
.skel-line{height:12px;border-radius:var(--radius-pill);margin:var(--space-2) 0;background:linear-gradient(90deg,var(--surface-2) 25%,var(--accent-soft) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skel.dark .skel-line{background:linear-gradient(90deg,var(--tao-line) 25%,var(--tao-line2) 50%,var(--tao-line) 75%);background-size:200% 100%}
.skel-note{font-size:var(--fs-sm);color:var(--t3);margin-top:var(--space-1)}
.skel.dark .skel-note{color:var(--tao-t3)}
/* Inline icons */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* Undo toast (shown for a few seconds after any delete) */
#undo-toast,#review-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--t1);color:var(--surface-3);padding:var(--space-2-5) var(--space-4);border-radius:var(--radius-pill);z-index:300;display:flex;gap:var(--space-4);align-items:center;font-size:var(--fs-base);box-shadow:var(--shadow-md);max-width:calc(100% - 32px);white-space:nowrap}
#undo-toast button{color:var(--gold2);font-weight:700;font-size:var(--fs-base);padding:0 var(--space-1)}
/* Voice input row under a text field */
.voice-row{display:flex;align-items:center;gap:var(--space-1-5);margin:-4px 0 var(--space-2-5)}
.voice-btn{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius-pill);padding:var(--space-1-5) var(--space-3);font-size:var(--fs-base);color:var(--gold);font-weight:700}
.voice-btn.recording{background:var(--red-soft);border-color:var(--red);color:var(--red-dark)}
.voice-lang{background:none;border:1px solid var(--line);border-radius:var(--radius-pill);padding:var(--space-1-5) var(--space-2-5);font-size:var(--fs-sm);color:var(--t3)}
.voice-status{font-size:var(--fs-sm);color:var(--t3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

<script>var medInterval = null;
var medSeconds = 0;
var medTotal = 0;
var musicMuted = false;
var selectedVoiceIdx = -1;
var ambientNodes = [];
var ambientGain = null;
var talkMessages = [];
var talkScenario = null;
var talkBusy = false;


function getTodayPlus(days) {
  var d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getToday() { return getTodayPlus(0); }
function buildSystemPrompt() {
  var td = getToday();
  return 'You are a field assistant for Uri (IAI Philippines Regional Manager). Today=' + td + '\n' +
    'Dates: tomorrow=' + getTodayPlus(1) + ', in2days=' + getTodayPlus(2) + ', nextweek=' + getTodayPlus(7) + ', in2weeks=' + getTodayPlus(14) + ', in3weeks=' + getTodayPlus(21) + ', nextmonth=' + getTodayPlus(30) + '\n\n' +
    'CRITICAL: Return ONLY this exact JSON structure, nothing else:\n' +
    '{' +
    '"now":[{"id":"n1","text":"max 8 words","site":null,"assignee":"uri/gio/kenneth/asc/11-16 or null","color":"red/orange/green","time":"","date":"","context":"phone/office/site or null","note":"short side-remark attached to this task, or null"}],' +
    '"today":[],' +
    '"later":[],' +
    '"sites":[{"name":"","province":"","issue":"","contractor":"asc or 11-16 or null","status":"open/pending/resolved","location":"coordinates or address if mentioned, else null","mondayLink":"a literal monday.com URL if one appears in the text, else null","remo":"REMO number if mentioned, else null","year":"2024/2025/2026 contract year if mentioned or inferable, else null"}],' +
    '"people":[{"name":"","role":"contractor/engineer/nia/other","company":"","pending":""}],' +
    '"events":[{"title":"ENGLISH title","date":"' + td + '","time":"","note":"","recurring":"","notify":"60","site":"matching site name or null"}],' +
    '"focus":"Hebrew sentence",' +
    '"moodGuess":"overwhelmed/scattered/tired/focused/neutral"' +
    '}\n\n' +
    'RULES:\n' +
    '0. MOOD: infer "moodGuess" from the tone/phrasing/pace of the pasted text itself (not from task content) — rushed, dense, anxious phrasing with many urgent items and little structure -> "overwhelmed"; jumping between unrelated topics with no clear thread -> "scattered"; short, low-energy, or mentions of tiredness/no sleep -> "tired"; calm, clear, organized phrasing -> "focused"; anything else or unclear -> "neutral". Default to "neutral" unless the tone clearly signals one of the others — do not over-diagnose from a short or neutral message.\n' +
    '1. now=urgent max 3 (red), today=do today (orange), later=future no date (green)\n' +
    '2. EVENTS: put ONLY genuinely date/time-bound items in events[] — a meeting, a deadline, an appointment, something that belongs on a calendar. Do NOT create an events[] entry for every plain task; a task that\'s just "do X" with no specific date/meeting stays ONLY in now/today/later. Calculate exact dates:\n' +
    '   - "in 2 weeks" or "בעוד שבועיים" -> date=' + getTodayPlus(14) + '\n' +
    '   - "tomorrow" or "מחר" -> date=' + getTodayPlus(1) + '\n' +
    '   - "next week" or "שבוע הבא" -> date=' + getTodayPlus(7) + '\n' +
    '   - "in 3 weeks" or "בעוד 3 שבועות" -> date=' + getTodayPlus(21) + '\n' +
    '   - specific date "19.07" -> date=' + td.slice(0,4) + '-07-19\n' +
    '3. Tasks and events[] are separate and NOT duplicates of each other — a task should appear in events[] only if it is ALSO a real calendar appointment/meeting/deadline, never just to "make sure it\'s visible somewhere". If an event is clearly about one of the sites in sites[] (existing or new), set its "site" field to that exact site name so tapping the calendar item can jump to that site.\n' +
    '4. notify always "60" (1 hour before)\n' +
    '5. events[] can be empty — that\'s normal when a message has no actual appointments/deadlines\n' +
    '6. If a now/today/later item names a specific clock time (e.g. "בעוד דקות ב-10:03", "פגישה ב-14:00"), also fill that item\'s "time" (HH:MM 24h) and "date" (default ' + td + ' if unstated) — this lets the app auto-detect once that time has passed.\n' +
    '7. NEXT-ACTION WRITING: write each task.text as ONE concrete, physically-doable next step, not a vague label. Bad: "לטפל בבאר בקלוריה". Good: "להתקשר לדייב על באר קלוריה". This applies WITHIN a single task that has several sequential steps — put only the very next step in text (the rest belongs in the site/event, not the task). It does NOT mean collapsing several separate tasks into one — see rule 9.\n' +
    '8. CONTEXT: set "context" to the situation needed to actually do the task — "phone" (call/text/email from anywhere), "office" (needs computer/files/Monday.com), "site" (must be physically at the location), or null if unclear. Infer from verbs: "להתקשר/לשלוח הודעה"->phone, "לעדכן את מאנדיי/לכתוב דוח"->office, "לבדוק/לתקן/לבקר"->site.\n' +
    '9. SPLITTING: one pasted message can contain several genuinely separate, independent action items — different people, different sites, or clearly unrelated asks, even in a single paragraph or sentence (e.g. "תתקשר לדייב על הבאר בקלוריה ותעדכן את נובי שהגנרטור בסטה קרוז מוכן" is TWO tasks, not one). Create a separate now/today/later entry for EACH distinct item — never merge unrelated asks into one, and never silently drop one because you only kept "the next" one. Likewise if a message mentions more than one site or contractor issue, create a separate entry in sites[] for each one. A numbered list (1. 2. 3...) in the message is a strong signal that each number is its own separate item — do not collapse a numbered list into one task. When in doubt about whether something is one task or two, prefer splitting.\n' +
    '10. SITE DETAILS: when a message gives coordinates (any format: decimal "16.9754, 121.8107" or DMS like 18°17\'50.89"N 121°24\'1.57"E) or a written address for a site, put that exact text in that site\'s "location". If the raw message text contains a literal monday.com URL, put that exact URL in that site\'s "mondayLink". If the message mentions a contract/project year (e.g. "2026 project", "פרויקט 2025") or a REMO number for a site, fill "year"/"remo" accordingly — these often distinguish otherwise-identical site names across different contract years.\n' +
    '11. TASK ≠ SUBSTITUTE FOR SITE: a task that talks about a site is NOT a substitute for a sites[] entry — if a specific site name, coordinates, or "site name -" label appears anywhere in the message, ALWAYS ALSO create or update a sites[] entry for it (with whatever of name/location/year/remo/issue was given), even though the same message also produced a task in now/today/later. Emitting only the task and skipping the site is wrong.\n\n' +
    'WORKED EXAMPLE — input:\n' +
    '"For tomorrow\n1. Need to check and get panelli pump and motor at cauayan wh. (Warehouse)\n2. check 2026 project (still waiting for engr junell to send the well report)\n- 18°17\'50.89"N 121°24\'1.57"E\n- site name - San Francisco, Luna, Apayao\n3. We will go to the NIA in charge to this 2026 project to ask them if this is really 2026 project."\n' +
    'Expected shape of the output (values illustrative, keep your own concise Hebrew task text):\n' +
    '- today: THREE separate entries, one per numbered item — a pump/motor pickup task, a "waiting on engr junell\'s well report" task, and a "visit NIA to confirm 2026 project" task. Not two, not one merged item.\n' +
    '- sites: ONE entry — {"name":"San Francisco, Luna, Apayao","location":"18°17\'50.89"N 121°24\'1.57"E","year":"2026","issue":"waiting for engr junell well report","status":"pending"} — created even though item 2 also produced a task above.\n' +
    '- events: empty, unless a real deadline/meeting time was given (there isn\'t one here).\n\n' +
    '12. NOTES vs SEPARATE TASKS: a short aside that only makes sense attached to one specific task (a reminder, a payment to make about it, a detail to not forget) goes in that task\'s "note" field — small print under the main task, not a task of its own. Example: main task "פגישה עם איגור בשישי ב-20:30" with note "לשלם על מפגש רביעי". This is different from rule 9 splitting: rule 9 is for independent action items that stand on their own; "note" is for a remark that is meaningless without its parent task.';
}



// ── HTML HELPERS ──────────────────────────────────
// Every piece of free text that came from outside the code — a pasted
// WhatsApp message turned into a task, a site name, an AI reply, a backup
// file — ends up in innerHTML. esc() makes sure it is shown as text and can
// never be interpreted as markup or script.
function esc(v) {
  if(v === null || v === undefined) return ''
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}
// For a value passed as an argument inside an inline onclick="..." attribute:
// a JS string literal (quotes, backslashes and newlines escaped), then
// HTML-escaped so it also survives the attribute. Usage:
//   onclick="showAddSite(${jsArg(site.name)})"
function jsArg(v) { return esc(JSON.stringify(v === undefined ? null : v)) }
// Only http(s) links may become an href — a pasted "javascript:" URL must
// never turn into a clickable script.
function safeUrl(u) { return (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : '' }

// ── STATE ─────────────────────────────────────────
const APP_VERSION = '2026.09.10-3'
const KEY = 'fieldy_v2'

// ── STATE VALIDATION (safety net) ─────────────────
// Everything that puts a whole new `state` object into the app — the saved
// copy at boot, an imported backup file, the server snapshot — goes through
// validateState() first. A shape the rest of the code can't handle used to
// be accepted silently and then either crashed the first render (blank app)
// or got written straight back to localStorage over the good data. Now it is
// refused with a message that names the problem, and whatever data was
// already there is left exactly as it was.
function validateState(s) {
  var problems = []
  var isObj = function(v){ return v !== null && typeof v === 'object' && !Array.isArray(v) }
  var allObjects = function(arr){ return arr.every(isObj) }
  if(!isObj(s)) return ['הנתונים אינם אובייקט (התקבל ' + (Array.isArray(s) ? 'מערך' : typeof s) + ')']
  if(!isObj(s.tasks)) problems.push('tasks חסר או אינו אובייקט')
  else ['now','today','later'].forEach(function(b){
    if(!Array.isArray(s.tasks[b])) problems.push('tasks.' + b + ' חסר או אינו רשימה')
    else if(!allObjects(s.tasks[b])) problems.push('tasks.' + b + ' מכיל פריט שאינו משימה')
  })
  ;['sites','people','events'].forEach(function(k){
    if(!Array.isArray(s[k])) problems.push(k + ' חסר או אינו רשימה')
    else if(!allObjects(s[k])) problems.push(k + ' מכיל פריט לא תקין')
  })
  // Optional sections may be missing (older backups — applyStateDefaults
  // fills them in), but if they are present they must have the right type.
  ;['moods','brainDumps','quotes','leadershipLog','pettyCash','siteDirectory'].forEach(function(k){
    if(s[k] != null && !Array.isArray(s[k])) problems.push(k + ' קיים אך אינו רשימה')
  })
  ;['personal','personalInsights','notifyPrefs','briefing','triageDismissed'].forEach(function(k){
    if(s[k] != null && !isObj(s[k])) problems.push(k + ' קיים אך אינו אובייקט')
  })
  if(s.focus != null && typeof s.focus !== 'string') problems.push('focus אינו טקסט')
  if(s.streak != null && typeof s.streak !== 'number') problems.push('streak אינו מספר')
  if(s.taskReviewedDate != null && typeof s.taskReviewedDate !== 'string') problems.push('taskReviewedDate אינו טקסט')
  return problems
}
// Fills in the optional sections an older saved state / backup may not have.
// This is the same back-compat defaulting the app always did at boot, made
// callable from the other two load paths (import, server) as well, so a
// legacy backup can't crash the first render after it is loaded.
function applyStateDefaults(s) {
  if(!s.personal) s.personal = {gymLog:{}, meditationLog:{}, vacationGoal:''}
  if(!s.personal.gymLog) s.personal.gymLog = {}
  if(!s.personal.meditationLog) s.personal.meditationLog = {}
  if(!s.moods) s.moods = []
  if(!s.brainDumps) s.brainDumps = []
  if(!s.personalInsights) s.personalInsights = {text:'', updatedAt:null, basedOnCount:0}
  if(!s.quotes || !s.quotes.length) s.quotes = [{text:"Who's living your life?", addedAt: Date.now()}]
  if(!s.pettyCash) s.pettyCash = []
  if(!s.leadershipLog) s.leadershipLog = []
  if(!s.siteDirectory) s.siteDirectory = []
  if(!s.briefing) s.briefing = {date:null, text:'', generatedAt:null}
  if(!s.triageDismissed) s.triageDismissed = {}
  return s
}
// Reads the saved state from localStorage. Returns the parsed object, or
// null when nothing usable-but-empty is saved yet. Throws (with the raw text
// attached as err.raw) when what is saved cannot be used.
function loadSavedState() {
  var raw = localStorage.getItem(KEY)
  if(raw === null || raw === 'null') return null
  var parsed
  try { parsed = JSON.parse(raw) }
  catch(e) { var err = new Error('הנתונים השמורים אינם JSON תקין (' + e.message + ')'); err.raw = raw; throw err }
  if(parsed === null) return null
  var problems = validateState(parsed)
  if(problems.length) { var err2 = new Error('הנתונים השמורים לא במבנה הצפוי: ' + problems.join(' · ')); err2.raw = raw; throw err2 }
  return parsed
}
// Full-screen, unmissable failure notice shown instead of the app when the
// saved state can't be loaded. Nothing is deleted or overwritten here: the
// broken copy stays in localStorage until Uri decides what to do with it.
function showStateLoadError(err) {
  var raw = err.raw || ''
  document.getElementById('app').innerHTML =
    '<div id="state-load-error" style="padding:56px 20px 40px;min-height:100vh;background:var(--red-soft)">' +
    '<div style="font-size:var(--fs-3xl);font-weight:800;color:#b91c1c;margin-bottom:10px">' + icon('alert-triangle') + ' Fieldy לא הצליח לטעון את הנתונים השמורים</div>' +
    '<div style="font-size:var(--fs-lg);color:var(--t1);line-height:1.7;margin-bottom:14px">' + esc(err.message) + '</div>' +
    '<div style="font-size:var(--fs-base);color:var(--t2);line-height:1.7;margin-bottom:20px">שום דבר לא נמחק ולא נדרס — הנתונים נשארו במכשיר בדיוק כפי שהיו. כדי לא לאבד אותם, קודם הורד עותק, ואז אפשר לנסות שוב או להתחיל מחדש.</div>' +
    '<button id="state-error-download" class="btn-primary" style="margin-bottom:10px">' + icon('download') + ' הורד עותק של הנתונים הגולמיים</button>' +
    '<button id="state-error-retry" class="btn-secondary" style="width:100%;margin-bottom:10px">' + icon('refresh') + ' נסה לטעון שוב</button>' +
    '<button id="state-error-reset" class="btn-secondary" style="width:100%;color:#b91c1c;border-color:#b91c1c66">התחל מחדש עם נתונים ריקים (העותק הפגום יישמר בגיבוי במכשיר)</button>' +
    '<div style="font-size:var(--fs-sm);color:var(--t3);margin-top:18px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px">' + esc(raw.slice(0,600)) + (raw.length > 600 ? '…' : '') + '</div>' +
    '</div>'
  document.getElementById('state-error-download').onclick = function(){
    var blob = new Blob([raw], {type:'text/plain'})
    var url = URL.createObjectURL(blob)
    var a = document.createElement('a'); a.href = url; a.download = 'fieldy-raw-' + getToday() + '.txt'
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url)
  }
  document.getElementById('state-error-retry').onclick = function(){ location.reload() }
  document.getElementById('state-error-reset').onclick = function(){
    if(!confirm('להתחיל מחדש עם נתונים ריקים? העותק הפגום יישמר במכשיר תחת מפתח גיבוי ולא יימחק.')) return
    localStorage.setItem(KEY + '_broken_' + Date.now(), raw)
    localStorage.removeItem(KEY)
    location.reload()
  }
  console.error('Fieldy: state load failed —', err.message)
}

function pickRandom(arr, n) {
  var copy = arr.slice()
  var out = []
  while(out.length < n && copy.length) {
    var i = Math.floor(Math.random()*copy.length)
    out.push(copy.splice(i,1)[0])
  }
  return out
}

function shouldAnalyzePatterns() {
  if(!serverConfigured()) return false
  const pi = state.personalInsights || {basedOnCount:0, updatedAt:null}
  const newCount = (state.brainDumps||[]).length + (state.moods||[]).length + (state.leadershipLog||[]).length

// Looks for a mood that keeps recurring in the same weekday + time-of-day
// slot (morning/afternoon/evening), so patterns like "Sunday afternoons
// tend to be overwhelming" surface on their own instead of staying invisible.
function getMoodPatterns() {
  if(!state.moods || state.moods.length < 5) return []
  var blocks = {}
  state.moods.forEach(function(m) {
    var wd = (m.weekday != null) ? m.weekday : new Date(m.ts).getDay()
    var hr = (m.hour != null) ? m.hour : new Date(m.ts).getHours()
    var block = hr < 12 ? 'morning' : (hr < 17 ? 'afternoon' : 'evening')
    var key = wd + '|' + block
    if(!blocks[key]) blocks[key] = {}
    blocks[key][m.mood] = (blocks[key][m.mood] || 0) + 1
  })
  var insights = []
  Object.keys(blocks).forEach(function(key) {
    var parts = key.split('|'), wd = parseInt(parts[0]), block = parts[1]
    var counts = blocks[key]
    var top = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a] })[0]
    if(top && top !== 'focused' && counts[top] >= 3) {
      insights.push({wd: wd, block: block, mood: top, count: counts[top]})
    }
  })
  return insights.sort(function(a,b){ return b.count - a.count }).slice(0,2)
}

  try {
    const r = await fetch(serverUrl + '/api/insights', {headers:{'Authorization':'Bearer '+serverPasscode}})
    if(r.ok) { latestInsights = await r.json(); if(currentScreen==='home') renderHome() }
  } catch(e) { console.log('insights fetch failed (non-critical):', e) }
}

async function loadStateFromServer() {
  if(!serverConfigured()) return
  const r = await fetch(serverUrl + '/api/state', {headers:{'Authorization':'Bearer '+serverPasscode}})
  if(!r.ok) throw new Error('status '+r.status)
  const d = await r.json()
  if(d.data) {
    // Server already has real data — it becomes the source of truth, but
    // only if it is actually usable: a bad snapshot must never replace the
    // good local copy.
    var problems = validateState(d.data)
    if(problems.length) throw new Error('הנתונים מהשרת לא במבנה הצפוי (הנתונים המקומיים נשמרו): ' + problems.join(' · '))
    state = applyStateDefaults(d.data)
    save()
  } else {
    // First connection: nothing on the server yet. This device's existing
    // local data becomes the seed (the one-time migration).
    syncStateToServer()
  }
}

// Named tr() (not t()) on purpose — `t` is already used everywhere in this
// file as the loop variable for "task" (map(t=>...), function taskCard(t),
// etc.); a global t() would silently shadow-collide with those.
let uiLang = localStorage.getItem('fieldy_ui_lang') || 'he'
function tr(key) {
  const e = TRANSLATIONS[key]
  if(!e) { console.warn('tr(): missing key', key); return key }
  return e[uiLang] || e.he
}
// Updates the one static (non re-rendered) part of the page — the nav bar —
// plus <html dir/lang> and the body's language class. Every dynamic screen
// picks up the new language on its own via renderCurrentScreen().
function applyUiLangDom() {
  document.documentElement.setAttribute('dir', uiLang === 'en' ? 'ltr' : 'rtl')
  document.documentElement.setAttribute('lang', uiLang)
  document.body.classList.toggle('lang-en', uiLang === 'en')
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = tr(el.dataset.i18n) })
}
function setUiLang(lang) {
  if(lang !== 'he' && lang !== 'en') return
  uiLang = lang
  localStorage.setItem('fieldy_ui_lang', lang)
  applyUiLangDom()
  renderCurrentScreen()
}

// ── THEME ─────────────────────────────────────────
// Full reskin for novelty (an ADHD interest-based nervous system likes
// occasional visual change) — surfaces, text, lines and accent all move
// together, so a theme is a different room rather than a different button.
// Every theme MUST declare the same token keys: applyTheme() writes them onto
// the root element, and a key one theme defines but another omits would stay
// stuck on the previous theme's value. A smoke test enforces that.
//
// --green-light is the vivid mint that tints the "resolved" chip and colours its
// status dot; --green-ink is the same family dark enough to READ on that tint
// (the mint itself sat at 1.6:1). Two tokens because one value cannot be both a
// pale background and legible text on itself.
//
// What does NOT move: --red and --stuck. A real alarm has to be recognisable
// the instant it appears, and re-learning "which red means late" per theme is
// exactly the load this app exists to remove. The non-alarm status colours DO
// get retuned, but only where they would otherwise collide with the theme's
// own accent and stop reading as a separate signal:
//   moss  — --green (#1a8f7a "resolved") sat 20° from the moss accent, so two
//           mid greens meant "done" and "ordinary button" looked alike. Moved
//           to a teal that also clears 4.5:1 on white, which the original
//           never did (3.98).
//   aqua  — --blue (site tags) sat 21° from the ocean accent; nudged to indigo.
// Nachal's status hues: real alert colours in the theme's watercolour manner —
// a warm rose-red, an ochre-amber and a soft teal-green. These are the inks
// that read on a light card (borders, ticks, map pins, text); the status tags
// themselves are painted watercolour blobs (assets/watercolor, see the CSS).
// Every status keeps its word, so the hue is never the only signal. The other
// three themes keep the fixed alarm colours above.

// ── CHRONOLOGY ────────────────────────────────────
// The app previously had no concept of "today" resetting: a task or focus
// headline set at 10am would still show as if it were current the next day
// or next week. This keeps the app connected to the actual clock:
// - "now" tasks are, by definition, only relevant on the day they were added.
//   Once the day rolls over, unfinished ones move to "today" instead of
//   staying flagged as urgent-right-now forever.
// - The "focus" headline (e.g. a specific meeting time) is scoped to the
//   day it was generated and clears itself once that day has passed.
// - Individual tasks/events that carry a real time are flagged overdue once
//   that time has passed, instead of silently staying in an "upcoming" state.
function isOverdue(t) {
  if(!t || t.done || !t.time) return false
  var d = t.date || getToday()
  var dt = new Date(d + 'T' + t.time)
  return !isNaN(dt) && dt.getTime() < Date.now()
}
function checkChronology() {
  var today = getToday()
  var changed = false
  if(state.focus && state.focusDate && state.focusDate !== today) {
    state.focus = ''; state.focusDate = null; changed = true
  }
  if(state.lastSeenDate && state.lastSeenDate !== today) {
    var stale = (state.tasks.now || []).filter(t => !t.done)
    if(stale.length) {
      state.tasks.today = [...state.tasks.today, ...stale]
      state.tasks.now = state.tasks.now.filter(t => t.done)
      changed = true
    }
    // Completed tasks used to sit in their bucket forever until deleted one
    // by one. Anything finished 3+ days ago is cleared out automatically.
    var cutoff = Date.now() - 3*24*60*60*1000
    var purge = arr => arr.filter(t => !(t.done && t.completedAt && t.completedAt < cutoff))
    var before = state.tasks.now.length + state.tasks.today.length + state.tasks.later.length
    state.tasks.now = purge(state.tasks.now)
    state.tasks.today = purge(state.tasks.today)
    state.tasks.later = purge(state.tasks.later)
    if(state.tasks.now.length + state.tasks.today.length + state.tasks.later.length !== before) changed = true
  }
  if(state.lastSeenDate !== today) { state.lastSeenDate = today; changed = true }
  if(changed) save()
  return changed
}

function navigateTo(screen, ctx=null) {
  if(ctx) actionCtx = ctx
  try { lokiScreenChange(screen) } catch(e) {}   // Loki goes back to his corner when Home is left (defined further down)
  if(medInterval && screen !== 'tao') { stopMeditation(false) }
  // An un-approved analysis is abandoned on leaving the screen. Nothing was
  // written, so there is nothing to undo — and coming back days later to a
  // stale preview of an old paste would be worse than starting again.
  if(previewPlan && screen !== 'input') previewPlan = null

  // Hide all screens
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'))
  
  // Show target (with a short enter animation, see .screen.enter)
  const target = document.getElementById('screen-' + screen)
  target.classList.remove('hidden')
  if(screen !== currentScreen) {
    target.classList.remove('enter'); void target.offsetWidth
    target.classList.add('enter')
    target.addEventListener('animationend', function(){ target.classList.remove('enter') }, {once:true})
  }
  
  // Update nav
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'))
  const activeBtn = document.querySelector(`.nav-btn[data-screen="${screen}"]`)
  if(activeBtn) activeBtn.classList.add('active')
  
  // Show/hide nav
  document.getElementById('nav').style.display = NAV_SCREENS.includes(screen) ? 'grid' : 'none'
  if(nachalLike()) placeNavInd(true)
  
  currentScreen = screen
  renderCurrentScreen()
  
  // Scroll to top
  const el = document.getElementById('screen-' + screen)
  if(el) el.scrollTop = 0
}

function goBack() {
  navigateTo('home')
}

והשוד\nאך ארבעה עיקרים אלה אין בהם די\nהם רק אומרים מה לא לעשות\nחשובים יותר הם ארבעת העיקרים\nשל מה שחשוב לעשות\nהיה תם לב\nדבק בפשטות\nהמעט עצמך\nצמצם בתאוות", "זנח\nהרגלים\nישנים\nגלה\nאת\nעצמך\nהעירום\nוחבק\nאת\nהאופי\nהראשון\nאני\nקל להסתבך\nבין הגדרות של טוב ורע\nקשה להגדיר באופן מוחלט\nמה חיובי ומה שלילי\nנכון ושגוי\nמה מעט נבדלים השניים\nואולי לא ניגודים הם\nאלא אבני רחיים\nבין כן ובין לא\nמה המרחק\nבין טוב ובין רע\nמי ישער את ההבדל\nאבל האנשים\nמקפצים בחיים\nצוהלים\nכאילו היו במסיבה נהדרת\nכמו ילדים\nשהעפילו ביום אביב\nאל ראש מגדל\nאני לבדי אדיש ושקט\nלא מראה סימנים\nלפעמים אני מרגיש כמו תינוק\nשעדיין אינו מסוגל לחייך\nעצוב אני כמו אחד שאין לו בית\nנראה כמו דחליל זרוק\nלכל האחרים יש יותר מאשר די\nורק אני לבד ואין לאן לחזור\nלבי מבולבל\nמחשבותיי כמו של שוטה", "לעיתים נראה כי סתום לי המוח\nאני לא באמת יודע הרבה\nיש אנשים מבריקים ומלאי בטחון\nואני כה עמום\nעם בטחון של חלזון\nיש אנשים צלולים\nואני\nגם לעצמי חסר שקיפות\nזנוח ללא עוגן\nמיטלטל\nכמו הרוח\nשאינה חדלה לנשוב\nהאנשים\nנדמה כי יש להם מה לעשות\nואני כה חסר תכלית\nלפעמים מגושם\nובשאר הזמן לא מעשי\nכזה אני\nשונה אולי מכל האחרים\nאבל מעריך יותר מכל\nאת החיפוש\nאחר הפלא הקיומי\nכמו בן המחפש\nאת אימא\nטוב ורע נכון ושגוי\nאינם זהים בעיני\nאך אני מפחד משניהם\nמכיוון שהם אינסופיים\nואין לדעת את אחריתם\nואולי כך הוא הדבר\nואיש הטאו שונה יהיה\nמשאר בני האדם\nלא\nמחכה\nבאף\nשולחן\nיונק\nישירות\nמהחזה\nשל\nהטבע\nאכן קל להסתבך\nבין הגדרות של טוב ורע,\nוקשה להגדיר באופן מוחלט\nמה חיובי ומה שלילי.\nלהמר על הטאו\nמידה נעלה היא\nללכת בדרך הטאו\nצריך אומץ רב\nכדי להמר עם הכל\nעל דבר שאין לו דמות\nלא שם ולא צורה\nמימי קדם\nועד עתה\nמבחינת הטאו\nדבר\nלא השתנה\nמהיכן אני יודע כל זאת?\nכך גילה לי הטאו\nמעורפל\nמסתורי\nבלתי מושג\nהאמת\nשם נמצאת\nבתוכה המהות\nועמה\nהנאמנות\nוהאמונה", "כפוף\nהיה צנוע ותישאר גדול\nהיה כפוף ותישאר ישר\nהיה ריק ותישאר מלא\nהיה בלוי ותישאר חדש\nזה אשר מעט לו\nיקבל\nזה אשר הרבה לו\nישועבד\nאין הוא מתרברב\nלמרות שיש לו הישגים\nאין הוא מתנשא\nלכן כבודו מאריך ימים\nאין הוא נאבק\nלכן לא נאבקים בו\nאין הו nאם ישמע אדם בינוני על הטאו\nלשעה ישמרהו ולשעה יאבדהו\nאם ישמע שוטה על הטאו\nיפרוץ בצחוק גדול\nאם לא היה צוחק\nלא היה זה טאו\nעל כן יש האומרים\nהנאור בטאו\nנראה חשוך\nהמתקדם בטאו\nנראה נסוג\nהמישיר בטאו\nנראה אובד דרך", "הטאו\nכמו נהר\nחזק\nרחב\nועמוק\nכמו עיגול\nאבל\nלבן\nיותר\nמהירח\nכמו\nריבוע גדול\nאבל\nבלי זוויות\nכמו תינוק\nהרך מכל\nחווה את הקשה מכל\nיוצא מתוך חום בלי חלל\nאל חלל נטול חום\nמתוך כך למדתי\nאת יתרונה של\nהזרימה הטבעית\nאת כל הנחוץ\nכוח החיים כבר יעשה\nיש הרבה חכמה וכוח\nבמקומות\nשאין בהם מילים\nאבל\nמי יצליח\nלטפל\nבדאגות\nכמו\nתינוק", "יין ויאנג\nטאו הוא אחד\nאחד הוליד\nוהנה שניים\nשניים הם ניגוד\nניגוד שווה שלושה\nכשיש שלושה\nעולים מיד\nעוד רבבה\nאבל היין והיאנג\nכמו הצל והאור\nאחד מלפנים\nשני מאחור\nההרמוניה בין הניגודים\nהיא נשמת החיים\nהמחבל\nבסדר הטוב\nגם\nיחיה\nוימות\nאבל לא\nבסדר\nהנכון", "שלוש שאלות\nשמך או עצמך\nמה קרוב אליך יותר\nעצמך או רכושך\nמה יקר לך יותר\nרכושך או בריאותך\nהיכן כואב לך יותר\nשים לב\nמרבה התלהבות\nמרבה הוצאות\nמרבה אגירה\nמרבה הפסדים\nלכן\nדע לשמוח בחלקך\nולא תדע בושה\nדע מתי די\nולא תדע סכנה\nכך ללא דאגות\nנעים\nלהאריך ימים\nהחכם יו פו הוסיף כאן הערה:", "המליאות הריקה\nהנמרץ אל האושר\nנראה כעצל\nצח הלשון\nנשמע מגמגם\nהשלימות נראית\nכהעדר שלמות\nהישרות העילאית\nרק נראית עקומה\nאם יש בעולם דבר\nשתשתמש בו\nולא יחסר\nהרי זו\nהמלאות\nהריקה\nטוהר\nושלוות רוח\nקובעים\nאת\nסדר\nהעולם", "המכשולים\nכאשר יש טאו בממלכה\nסוסי המרוץ\nנשלחים לזיבול השדות\nכאשר אין הטאו מושל\nלוקחים את הסוסים\nלרעות בגבולות\nאין אסון גדול\nמחוסר שקט פנימי", "אין טפשות גדולה יותר\nמהליכה עיוורת אחר התשוקות\nאין אומללות גדולה\nמהעדרה של מידת ההסתפקות\nאין מכשול גדול יותר\nמאשר החמדנות\nהיודע\nמתי די\nתמיד\nיש לו די\nדעת עולם\nמבלי לצאת מפתח ביתו\nיודע החכם עולם ומלואו", "הממעיט\nהעוסק בלימוד\nמוסיף ידיעה מיום ליום\nהעוסק בטאו\nממעיט עשייה מיום ליום\nממעיט וחוזר וממעיט\nעד שהוא מגיע אל אי-העשיה\nוהעשיה אז זורמת דרכו\nכך\nבאי-עשיה\nאין דבר שאינו נעשה\nבלא מאמץ\nאפשר לכבוש עולם\nמי\nשמתאמץ\nלא יוכל\nלאורך\nזמן\nלהחזיק", "לב ישר\nאני\nאין לי לב שהוא מיוחד ורק שלי\nלב העם הוא לבי\nעם טובים איטיב\nוגם עם רעים איטיב\nעם ישרים אישיר\nואף עם לא ישרים אישיר\nבמאמינים אאמין\nבלא מאמינים\nגם להם אני מאמין\nכי כך עושים\nאנשים ישרים\nהחכם\nחי\nבעולם פשוט\nהוא עוזר\nאינו חושד\nרואה את עצמו\nכתינוק\nואת כולם\nכילדיו", "המוות\nכל הבאים בשער העולם\nמתחילים את דרכם אל המוות\nשליש מתים ממחלות\nואין ברירה\nשליש נוסף מתים\nבגלל שהתאמצו להיות בריאים\nיתר על המידה\nאלה שלא עושים מאמץ מיוחד\nיאריכו יותר ימים\nמאלה החפצים\nבחיים נצחיים\nאם רק רגוע תהיה\nלא יפגע בך הנמר\nלא יתקוף הקרנף\nאפשר להבקיע מחנה צבא\nללא שריון או מלחמה\nהיה שלם\nואין מקום\nלקרן הקרנף\nולא לנמר\nלנעוץ ציפורניו\nמי שלא מתעסק\nעם המוות\nהמוות\nלא מתעסק איתו", "ילדים\nהטאו הוא זה שמוליד אותם\nהוא גם יפרנס ויזין אותם\nמהותו\nמעצבת אותם\nכוחו\nמשלים את שלהם\nכל אחד וצורתו\nכל אחד ושלמותו\nהטאו מקיים אותם\nהטאו מגדל אותם\nהטאו משלים אותם\nהטאו מטפח אותם\nהטאו מגונן עליהם\nהטאו לעולם לא ינטוש אותם\nהטאו ינהל אותם\nאבל לעולם לא ישלוט עליהם\nזו היא הסגולה\nמוליד ולא רוכש\nעושה ולא מתגאה\nמנהל ולא משתלט\nהטאו\nמעולם\nלא שכח\nדבר", "אם העולם\nהעולם יש לו אימא\nאקרא לה\nאם כל חי\nהשג את האם\nובאמצעותה תדע את הבנים\nדע את בניה\nאך חזור ושמור על האם\nאם כזאת תעשה\nלעולם לא תאבד\nהכבר מעשים\nולא תנצל\nסגור שערים\nולא תדע אכזבה\nהכנס\nאל\nהטאו\nהעם\nזוהרך\nולך\nעם\nהאור", "שניים מעקרונות היסוד של הפילוסופיה הסינית אומרים:\nישר\nלו הייתה לי בינה\nולו גם מועטה\nכל חיי הייתי הולך\nבדרך הראשית\nהיא גדולה\nישרה\nרחבה\nומישורית\nהחכם חושש משבילים עקיפים\nאבל דרכים צדדיות\nושבילים צרים ונפתלים\nעדיפים משום מה על ההמונים\nכשהארמון מפואר\nאבל שדות העם יבשים\nכשהעשירים לובשים יקר\nוזוללים מטעמים\nבזמן שהעם רעב\nוחי בין קוצים\nשלא יתפלאו העשירים\nאם יש גנבים ושודדים\nגם זה\nבמסגרת הטאו\nנכסים\nמיותרים\nמשכיחים\nאת החיוני", "לדורי דורות\nהמושרש היטב לא יחמוק\nהשתול עמוק לא יעקר\nהילדים נושאים בחובם\nאת אשר קיבלו מההורים\nמזג ההורים עובר הלאה\nקארמה לדורי דורות\nלכן\nהמטפח טאו בתוך עצמו\nחסדו אמת\nהמכניס טאו למשפחתו\nגבורתו שופעת\nהמלמד טאו בכפרו\nגבורתו מתרבה\nהמטפח טאו בתוך מדינתו\nגבורתו משגשגת\nהמפיץ טאו בתבל\nגבורתו חסד עולם\nחקור את גופך\nולמד מה זה גוף\nחקור עצמך\nודע זולתך\nחקור משפחתך\nולמד מה זו משפחה\nלמד כפר\nותדע מה זו מדינה\nאם תרצה להבין עם שלם\nלמד להכיר את היחיד\nלמד ארץ אחת\nותדע את כל העולם", "שב\nבשקט\nותדע\nמהו\nטאו\nכתב עמוס עוז:\nהסירו דאגה\nתינוק הוא מבורך\nבהשגחה העליונה\nולא יקרה לו כל רע\nלא יעקוץ אותו עקרב\nלא צרעה ולא אפעה\nלא יפחד מחיות פרא\nולא מעופות טרף דורסים\nהתינוק\nעצמותיו חלשות וגידיו רכים\nאך אחיזתו בחיים איתנה\nונטולת חרדה\nשרביטו הקטון ניעור\nעוד בטרם ידע בין נקבה וזכר\nהוא מסוגל כל היום לצרוח\nגרונו חזק ואינו נצרד\nיש בו און\nהוא יודע להתמיד\nוהוא מתואם עם העולם", "דע\nאת הקבוע\nואל\nתדאג\nיתר\nעל\nהמידה\nחלק מטכניקות המדיטציה של מנזרי הזן מלמדות סוג מסויים של התמקדות בנשימות\nובמקביל ,הקשבה אל הנעשה בסביבה.\nבדידות החכמים\nזה שמדבר לא יודע\nזה שיודע לא מדבר\nהוא חוסם פתחיו\nסוגר דלתותיו\nמקהה חודו\nמרכך זוהרו\nשומר על מסתורין\nמתאחד עם אבקו\nבלתי ניתן לקרבה\nאבל לא ניתן לריחוק\nאף אחד\nלא יאמר לו מה לעשות\nאבל גם אין ממנו נזק\nאין הוא מבקש כבוד\nוללא מאמץ\nהוא מוקף בו\nבעיני\nכזה הוא\nאיש טאו", "המלצות למעצבי אומה\nביושר משול במדינה\nבערמה עשה לך מלחמה\nבישוב דעת זכה במנוחה\nככל שירבו האיסורים וההגבלות\nכן ירבה עוניו של העם\nככל שירבו חוקים ותקנות\nכן ירבו שודדי המשפט\nומומחי החוק\nככל שירבו כלי הנשק\nכן תרבה האלימות\nככל שירבו המפעלים\nכך יהיו יותר דברים\nשלא צריכים\nלכן אמר החכם\nנוקט אני באפס מעשה\nוהדברים מסתדרים על הדרך\nלא מתערב\nוהשינוי נעשה מעצמו\nכאשר אני ישר עם עצמי\nגם האחרים\nשומרים איתי על יושר\nגם אם אני בטלן\nולא עושה הרבה\nהברכה תמיד איתי\nועם אלה שסביבי", "בריא\nממחלת\nהקינאה\nהייתי\nרוצה\nשוב\nלהגיד\nשאין\nברכה\nכמו\nהפשטות\nאושר ועצב\nהאושר\nעל גבי העצב נישא\nהצער\nתחת כנפי האושר שוכן\nהמזל הטוב סמוך אל הרע\nבמזל הרע אורב הטוב\nמי ידע גבולם\nלכן החכם תמיד זהיר\nאנשים טועים כל הזמן\nחיים שלמים\nימים ארוכים\nשל טעויות\nישר\nולא פוגע\nצודק\nולא מעליב\nמאיר\nאבל לא\nמסנוור בעין\nגדולה של ממש היא להיות צודק ולא לצעוק.", "מתינות\nעם בני אדם\nכמו בעבודת האדמה\nאין טוב\nממתינות\nבמתינות\nהכל קורה ב // One round-trip to the small-talk coach: shows the "typing" state, appends
// the reply (or the error) as a bubble, and re-renders.
function talkRequest(messages) {
  talkBusy = true
  renderTao()
  callClaude(messages, withContext(TALK_SYSTEM_PROMPT))
    .then(function(reply){ talkMessages.push({role:'assistant', content: reply.trim() || '...'}) })
    .catch(function(e){ talkMessages.push({role:'assistant', content: 'שגיאה: ' + e.message}) })
    .then(function(){ talkBusy = false; renderTao() })
}

function startTalkScenario(scenario) {
  talkScenario = scenario
  talkMessages = []
  talkRequest([{role:'user', content:'בוא נתחיל את התרחיש: ' + scenario.label + ' - ' + scenario.desc + '. תיכנס לדמות ותפתח את השיחה.'}])
}

function sendTalkMessage(forcedText) {
  var input = document.getElementById('talk-msg-input')
  var text = forcedText || (input && input.value.trim())
  if(!text || talkBusy) return
  talkMessages.push({role:'user', content: text})
  talkRequest(talkMessages.map(function(m){ return {role:m.role, content:m.content} }))
}

function getWeeklyFocus() {
  var days = Math.floor(new Date(getToday()).getTime()/86400000)
  var weekNum = Math.floor(days/7)
  return WEEKLY_FOCUS[weekNum % WEEKLY_FOCUS.length]
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

const getAudio = () => { if(!audioCtx) audioCtx = new AudioCtx(); return audioCtx; };

const playTone = (freq, dur, type='sine', vol=0.3) => {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = type;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
};

const playZenBell = () => { playTone(528,2.5); setTimeout(()=>playTone(396,1.5),400); };
const playTibetanBowl = () => { playTone(256,3); setTimeout(()=>playTone(384,2),250); setTimeout(()=>playTone(512,1.5),600); };
const playTaskComplete = () => { playTone(440,0.3); setTimeout(()=>playTone(554,0.3),150); setTimeout(()=>playTone(659,1),300); };
const playTaskAdd = () => playTone(396,0.5,'triangle',0.2);
// Soft two-note chime for "saved" moments (leadership entry) — quieter than
// the task-complete run, so it registers without demanding attention.
const playSaveChime = () => { playTone(523,0.25,'triangle',0.16); setTimeout(()=>playTone(659,0.5,'triangle',0.14),120); };

// ── ACTION SOUND FEEDBACK ─────────────────────────
// Short sounds on key actions (finish a task, save the daily reflection,
// finish a meditation): immediate positive feedback, which matters for an
// ADHD brain. Always optional — the Settings toggle silences all of them for
// meetings and the field, and every action also confirms itself visually
// (ripple, check, "נשמר"), so sound is never the only signal. The Tao
// screen's ambient water and the meditation narration have their own mute.
function soundOn() { return localStorage.getItem('fieldy_sound') !== '0' }
function setSoundOn(on) { localStorage.setItem('fieldy_sound', on ? '1' : '0'); if(on) playFx('save') }
function setHapticsOn(on) { localStorage.setItem('fieldy_haptics', on ? '1' : '0'); if(on) haptic('light') }
const FX = {complete: () => playTaskComplete(), add: () => playTaskAdd(), save: () => playSaveChime(), done: () => playTibetanBowl()}
function playFx(kind) { if(!soundOn()) return; const f = FX[kind]; if(f) f() }

// Water sound (gentle stream)
const playWater = () => {
  try {
    const ctx = getAudio();
    const bufferSize = ctx.sampleRate * 0.8;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    // Pink noise filtered to sound like water
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0; i<bufferSize; i++) {
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.08;
      b6=w*0.115926;
    }
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=800; filter.Q.value=0.5;
    src.buffer=buffer;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
    src.start(); src.stop(ctx.currentTime+0.8);
  } catch(e) {}
};

  medTotal = med.duration * 60;

  if(qcInterval) { clearInterval(qcInterval); qcInterval = null; }   // never both breathing timers at once

  playTibetanBowl();

  const stepsHtml = med.steps.map(function(s, i) {
    return '<div style="font-size:var(--fs-sm);color:var(--tao-t2);padding:4px 0;border-bottom:' +
      (i < med.steps.length - 1 ? '1px solid var(--tao-line)' : 'none') + '">' + s + '</div>';
  }).join('');

  const mins = med.duration.toString();
  openModal(
    '<div style="font-size:var(--fs-md);color:var(--tao-gold2);font-weight:600;margin-bottom:4px">' + icon(med.icon) + ' ' + med.title + '</div>' +
