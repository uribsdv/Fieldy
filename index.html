<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Fieldy"/>
  <title>Fieldy — Uri Field Assistant</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f172a;--bg2:#1e293b;--bg3:#0f172a;--border:#334155;--text:#f1f5f9;--muted:#64748b;--blue:#3b82f6;--cyan:#06b6d4;--red:#ef4444;--orange:#f59e0b;--green:#4ade80}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;direction:rtl;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    button{font-family:inherit;cursor:pointer;border:none}
    textarea,select,input{font-family:inherit}
    #app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
    .screen{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .scrollable{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ── STORAGE ──────────────────────────────────────────────────────
const KEY = 'fieldy_v1'
const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null } catch { return null } }
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)) } catch {} }
const fresh = () => ({ tasks:{now:[],today:[],later:[]}, sites:[], people:[], focus:'', summary:'', updated:null })

// ── STATE ─────────────────────────────────────────────────────────
let state = load() || fresh()
let screen = 'home'
let prevScreen = 'home'
let actionCtx = null
let apiKey = localStorage.getItem('fieldy_key') || ''

const setState = (patch) => { state = {...state,...patch,updated:new Date().toISOString()}; save(state); render() }
const navigate = (to, ctx=null) => { prevScreen=screen; if(ctx) actionCtx=ctx; screen=to; render() }
const goBack = () => { screen=prevScreen; render() }

// ── CLAUDE API ────────────────────────────────────────────────────
const SYSTEM = `You are a field operations assistant for Uri, a Regional Manager at Innovative Agro Industry Philippines (Region II). Uri has ADHD. Engineers: Gio and Kenneth. Contractors: ASC Construction (engineer: Dave) and 11-16 Construction.
Uri sends notes in Hebrew/English/Tagalog mix. Return ONLY valid JSON:
{"now":[{"id":"n1","text":"short task max 8 words","site":null,"assignee":"uri/gio/kenneth/asc/11-16 or null","color":"red/orange/green"}],"today":[...],"later":[...],"sites":[{"name":"site","province":"province","issue":"issue","contractor":"asc/11-16/null","status":"open/pending/resolved"}],"people":[{"name":"name","role":"contractor/engineer/nia/other","company":"","pending":"what is waiting from them"}],"focus":"ONE Hebrew sentence — most important thing today","summary":"2-sentence Hebrew summary"}
Rules: now MAX 3 tasks. color: red=critical, orange=important, green=routine.`

const callClaude = async (messages, system=null) => {
  const body = {model:'claude-sonnet-4-6',max_tokens:1500,messages}
  if(system) body.system = system
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify(body)
  })
  const d = await r.json()
  if(d.error) throw new Error(d.error.message)
  return d.content?.find(b=>b.type==='text')?.text || ''
}

const parseNotes = async (text) => {
  const raw = await callClaude([{role:'user',content:text}], SYSTEM)
  return JSON.parse(raw.replace(/```json|```/g,'').trim())
}

const genAction = async (type, ctx, assignee) => {
  const prompts = {
    whatsapp:`Write a short WhatsApp message in English from Uri (Regional Manager, IAI Philippines) to ${assignee||'team member'} about: ${ctx}. Max 3 sentences, direct.`,
    email:`Write a professional email in English from Uri (Regional Manager, Innovative Agro Industry) about: ${ctx}. Include subject line. Concise.`,
    monday:`Write a Monday.com task update in English for: ${ctx}. Format: Status / Issue / Next Action / Owner.`
  }
  return await callClaude([{role:'user',content:prompts[type]}])
}

// ── HELPERS ────────────────────────────────────────────────────────
const COLORS = {red:{bg:'#ef444418',border:'#ef444460',text:'#ef4444',label:'דחוף'},orange:{bg:'#f59e0b18',border:'#f59e0b60',text:'#f59e0b',label:'חשוב'},green:{bg:'#4ade8018',border:'#4ade8060',text:'#4ade80',label:'שוטף'}}
const ASSIGNEE = {uri:'אני',gio:"ג'יו",kenneth:"קנת'",asc:'ASC','11-16':'11-16'}
const STATUS_COLOR = {open:'#ef4444',pending:'#f59e0b',resolved:'#4ade80'}
const STATUS_LABEL = {open:'פתוח',pending:'ממתין',resolved:'נפתר'}

const h = (tag, attrs={}, ...children) => {
  const el = document.createElement(tag)
  Object.entries(attrs).forEach(([k,v]) => {
    if(k==='style'&&typeof v==='object') Object.assign(el.style,v)
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v)
    else el.setAttribute(k,v)
  })
  children.flat().forEach(c => { if(c!=null) el.appendChild(typeof c==='string'?document.createTextNode(c):c) })
  return el
}

const btn = (text, onClick, style={}) => h('button',{onClick,style:{border:'none',cursor:'pointer',fontFamily:'inherit',...style}},text)
const stamp = () => Date.now()

// ── HOME SCREEN ────────────────────────────────────────────────────
const renderHome = () => {
  const allTasks = [...state.tasks.now,...state.tasks.today,...state.tasks.later]
  const done = allTasks.filter(t=>t.done).length
  const total = allTasks.length
  const urgent = state.tasks.now.filter(t=>!t.done)
  const openSites = state.sites.filter(s=>s.status==='open'||s.status==='pending').length
  const pendingPeople = state.people.filter(p=>p.pending).length

  const el = h('div',{class:'screen'})

  // Header
  const header = h('div',{style:{background:'linear-gradient(180deg,#1e3a5f,#0f172a)',padding:'48px 16px 16px',borderBottom:'1px solid #1e293b'}})
  const topRow = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px'}})
  topRow.appendChild(h('div',{},
    h('div',{style:{fontSize:'12px',color:'#64748b',marginBottom:'4px'}}, new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})),
    h('div',{style:{fontSize:'22px',fontWeight:'800',color:'#f8fafc',letterSpacing:'-0.5px'}},'בוקר טוב, אורי ☀️'),
    h('div',{style:{fontSize:'11px',color:'#475569',marginTop:'2px'}},'Region II · Cagayan Valley')
  ))
  topRow.appendChild(btn('⚙️', ()=>navigate('settings'), {background:'#1e293b',borderRadius:'10px',padding:'8px 10px',color:'#64748b',fontSize:'16px'}))
  header.appendChild(topRow)

  if(!apiKey) {
    const warn = h('div',{style:{padding:'10px 14px',background:'#f59e0b18',border:'1px solid #f59e0b44',borderRadius:'10px',cursor:'pointer'},onClick:()=>navigate('settings')})
    warn.appendChild(h('div',{style:{fontSize:'13px',color:'#f59e0b',fontWeight:'600'}},'⚠️ נדרש API Key'))
    warn.appendChild(h('div',{style:{fontSize:'12px',color:'#78716c',marginTop:'2px'}},'לחץ להגדרות'))
    header.appendChild(warn)
  }

  if(total>0) {
    const prog = h('div',{style:{marginTop:'14px'}})
    const row = h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'#475569',marginBottom:'5px'}})
    row.appendChild(document.createTextNode('התקדמות היום'))
    row.appendChild(h('span',{style:{color:done===total?'#4ade80':'#64748b'}},`${done}/${total}`))
    prog.appendChild(row)
    const bar = h('div',{style:{background:'#1e293b',borderRadius:'99px',height:'5px'}})
    const fill = h('div',{style:{height:'100%',borderRadius:'99px',width:`${total?(done/total)*100:0}%`,background:done===total?'#4ade80':'linear-gradient(90deg,#3b82f6,#06b6d4)',transition:'width 0.4s'}})
    bar.appendChild(fill); prog.appendChild(bar); header.appendChild(prog)
  }
  el.appendChild(header)

  const body = h('div',{class:'scrollable',style:{padding:'14px 16px',paddingBottom:'90px'}})

  if(state.focus) {
    const focus = h('div',{style:{background:'linear-gradient(135deg,#1e3a5f,#1e293b)',borderRadius:'14px',padding:'14px 16px',marginBottom:'14px',border:'1px solid #1e40af33'}})
    focus.appendChild(h('div',{style:{fontSize:'10px',color:'#3b82f6',fontWeight:'700',letterSpacing:'1px',marginBottom:'6px'}},'🎯 הכי חשוב היום'))
    focus.appendChild(h('div',{style:{fontSize:'14px',color:'#f1f5f9',lineHeight:'1.5',fontWeight:'600'}},state.focus))
    body.appendChild(focus)
  }

  if(urgent.length>0) {
    body.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',fontWeight:'700',letterSpacing:'0.5px',marginBottom:'8px'}},'⚡ עכשיו'))
    urgent.slice(0,3).forEach(task => {
      const card = h('div',{style:{background:'#ef444415',border:'1.5px solid #ef444440',borderRadius:'12px',padding:'12px 14px',marginBottom:'8px',cursor:'pointer'},onClick:()=>navigate('tasks')})
      card.appendChild(h('div',{style:{fontSize:'14px',fontWeight:'600',color:'#f1f5f9'}},task.text))
      if(task.site||task.assignee) {
        const tags = h('div',{style:{display:'flex',gap:'8px',marginTop:'5px'}})
        if(task.site) tags.appendChild(h('span',{style:{fontSize:'11px',color:'#64748b'}},`📍 ${task.site}`))
        if(task.assignee) tags.appendChild(h('span',{style:{fontSize:'11px',color:'#64748b'}},`👤 ${ASSIGNEE[task.assignee]||task.assignee}`))
        card.appendChild(tags)
      }
      body.appendChild(card)
    })
  }

  const stats = h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}})
  ;[
    {icon:'⚡',label:'עכשיו',value:state.tasks.now.filter(t=>!t.done).length,color:'#ef4444',screen:'tasks'},
    {icon:'📍',label:'אתרים',value:openSites,color:'#f59e0b',screen:'sites'},
    {icon:'👥',label:'ממתין',value:pendingPeople,color:'#06b6d4',screen:'people'},
  ].forEach(s => {
    const card = h('div',{style:{background:'#1e293b',borderRadius:'12px',padding:'12px 10px',textAlign:'center',cursor:'pointer',border:`1px solid ${s.value>0?s.color+'33':'transparent'}`},onClick:()=>navigate(s.screen)})
    card.appendChild(h('div',{style:{fontSize:'18px'}},s.icon))
    card.appendChild(h('div',{style:{fontSize:'22px',fontWeight:'800',color:s.value>0?s.color:'#475569',lineHeight:'1.2'}},String(s.value)))
    card.appendChild(h('div',{style:{fontSize:'10px',color:'#475569',marginTop:'2px'}},s.label))
    stats.appendChild(card)
  })
  body.appendChild(stats)

  body.appendChild(btn('+ הוסף הודעות מוואטסאפ', ()=>navigate('input'), {
    width:'100%',padding:'16px',borderRadius:'14px',background:'linear-gradient(135deg,#3b82f6,#06b6d4)',
    color:'#fff',fontSize:'15px',fontWeight:'700',display:'block'
  }))

  if(total===0&&!state.focus) {
    const empty = h('div',{style:{textAlign:'center',padding:'40px 0',color:'#334155'}})
    empty.appendChild(h('div',{style:{fontSize:'36px',marginBottom:'8px'}},'📋'))
    empty.appendChild(h('div',{style:{fontSize:'14px'}},'הדבק הודעות מוואטסאפ כדי להתחיל'))
    body.appendChild(empty)
  }

  if(state.updated) {
    body.appendChild(h('div',{style:{textAlign:'center',marginTop:'16px',fontSize:'11px',color:'#334155'}},
      `עודכן ${new Date(state.updated).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}`))
  }

  el.appendChild(body)
  el.appendChild(renderNav())
  return el
}

// ── INPUT SCREEN ───────────────────────────────────────────────────
const renderInput = () => {
  let loading = false
  const el = h('div',{class:'screen',style:{padding:'48px 16px 24px'}})
  const backRow = h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'20px'}})
  backRow.appendChild(btn('←', goBack, {background:'#1e293b',borderRadius:'10px',padding:'10px 14px',color:'#94a3b8',fontSize:'18px'}))
  backRow.appendChild(h('div',{style:{fontSize:'18px',fontWeight:'700'}},'הוסף הודעות'))
  el.appendChild(backRow)

  el.appendChild(h('div',{style:{fontSize:'13px',color:'#475569',marginBottom:'10px',lineHeight:'1.6'}},'הדבק הודעות מוואטסאפ — בכל שפה.'))

  const ta = h('textarea',{placeholder:'Claveria well — Gio to assess\nהחלפת משאבה בדולרס\nDave needs to sign waiver — Upi 3\nפגישה עם נובי ב-NIA יום שני',style:{flex:'1',width:'100%',minHeight:'200px',background:'#1e293b',border:'1px solid #334155',borderRadius:'12px',padding:'14px',color:'#f1f5f9',fontSize:'15px',resize:'none',outline:'none',lineHeight:'1.7',direction:'rtl',display:'block',marginBottom:'10px'}})
  el.appendChild(ta)

  const errEl = h('div',{style:{color:'#ef4444',fontSize:'13px',marginBottom:'8px',display:'none'}})
  el.appendChild(errEl)

  if(!apiKey) el.appendChild(h('div',{style:{color:'#f59e0b',fontSize:'13px',marginBottom:'8px'}},'⚠️ חסר API Key — הגדר בהגדרות'))

  const submitBtn = btn('⚡ ארגן את היום', async () => {
    if(loading||!ta.value.trim()||!apiKey) return
    loading=true; submitBtn.textContent='⚙️ מסדר...'; submitBtn.style.background='#1e293b'; submitBtn.style.color='#475569'
    errEl.style.display='none'
    try {
      const p = await parseNotes(ta.value)
      const s = stamp()
      const tag = (arr,prefix) => (arr||[]).map((t,i)=>({...t,id:`${prefix}${s}${i}`,done:false}))
      const mergeSites = (ex,inc) => { const m={}; ex.forEach(s=>m[s.name]=s); (inc||[]).forEach(s=>m[s.name]={...(m[s.name]||{}), ...s}); return Object.values(m) }
      const mergePeople = (ex,inc) => { const m={}; ex.forEach(p=>m[p.name]=p); (inc||[]).forEach(p=>m[p.name]={...(m[p.name]||{}), ...p}); return Object.values(m) }
      setState({
        tasks:{now:[...state.tasks.now,...tag(p.now,'n')],today:[...state.tasks.today,...tag(p.today,'d')],later:[...state.tasks.later,...tag(p.later,'l')]},
        sites:mergeSites(state.sites,p.sites),
        people:mergePeople(state.people,p.people),
        focus:p.focus||state.focus,
        summary:p.summary||state.summary
      })
      navigate('home')
    } catch(e) { errEl.textContent='שגיאה: '+e.message; errEl.style.display='block' }
    finally { loading=false; submitBtn.textContent='⚡ ארגן את היום'; submitBtn.style.background='linear-gradient(135deg,#3b82f6,#06b6d4)'; submitBtn.style.color='#fff' }
  }, {width:'100%',padding:'16px',borderRadius:'14px',background:'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff',fontSize:'16px',fontWeight:'700',display:'block'})
  el.appendChild(submitBtn)
  return el
}

// ── TASKS SCREEN ───────────────────────────────────────────────────
const renderTasks = () => {
  let bucket = 'now'
  let showAdd = false

  const BUCKETS = [{key:'now',icon:'⚡',label:'עכשיו',color:'#ef4444'},{key:'today',icon:'📅',label:'היום',color:'#f59e0b'},{key:'later',icon:'🕐',label:'אחר כך',color:'#64748b'}]

  const el = h('div',{class:'screen'})

  const header = h('div',{style:{padding:'48px 16px 12px',background:'linear-gradient(180deg,#1e293b,#0f172a)',position:'sticky',top:'0',zIndex:'10'}})
  const topRow = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}})
  topRow.appendChild(h('div',{style:{fontSize:'18px',fontWeight:'700'}},'משימות'))
  topRow.appendChild(btn('+ הוסף', ()=>{ showAdd=true; rerender() }, {background:'#1e40af',borderRadius:'10px',padding:'8px 14px',color:'#fff',fontSize:'13px',fontWeight:'600'}))
  header.appendChild(topRow)

  const tabs = h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px'}})
  const rerender = () => { const newEl = renderTasks(); document.getElementById('app').replaceChild(newEl, el) }

  BUCKETS.forEach(b => {
    const count = state.tasks[b.key].filter(t=>!t.done).length
    const active = bucket===b.key
    const t = h('button',{style:{padding:'10px 4px',borderRadius:'10px',border:`1.5px solid ${active?b.color:'transparent'}`,background:active?b.color+'18':'#1e293b',color:active?b.color:'#64748b',cursor:'pointer',textAlign:'center'},onClick:()=>{bucket=b.key; rerender()}})
    t.appendChild(h('div',{style:{fontSize:'16px'}},b.icon))
    t.appendChild(h('div',{style:{fontSize:'11px',fontWeight:'600',marginTop:'2px'}},b.label))
    if(count>0) t.appendChild(h('div',{style:{fontSize:'13px',fontWeight:'700',color:active?b.color:'#475569'}},String(count)))
    tabs.appendChild(t)
  })
  header.appendChild(tabs)
  el.appendChild(header)

  const body = h('div',{class:'scrollable',style:{padding:'12px 16px',paddingBottom:'90px'}})
  const tasks = state.tasks[bucket]||[]

  if(tasks.length===0) {
    const empty = h('div',{style:{textAlign:'center',padding:'60px 0',color:'#334155'}})
    empty.appendChild(h('div',{style:{fontSize:'36px',marginBottom:'8px'}},'✓'))
    empty.appendChild(h('div',{style:{fontSize:'14px'}},'ריק — כל הכבוד!'))
    body.appendChild(empty)
  }

  tasks.forEach(task => {
    const c = COLORS[task.color]||COLORS.orange
    const card = h('div',{style:{background:task.done?'#0f172a':c.bg,border:`1.5px solid ${task.done?'#1e293b':c.border}`,borderRadius:'14px',padding:'14px',marginBottom:'8px',opacity:task.done?'0.45':'1',transition:'opacity 0.2s'}})
    const row = h('div',{style:{display:'flex',alignItems:'flex-start',gap:'12px'}})

    const cb = h('div',{style:{width:'26px',height:'26px',borderRadius:'8px',flexShrink:'0',cursor:'pointer',background:task.done?c.text:'transparent',border:`2px solid ${c.text}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',color:'#fff',transition:'all 0.15s'},onClick:()=>{
      const toggle = (arr) => arr.map(t=>t.id===task.id?{...t,done:!t.done}:t)
      setState({tasks:{now:toggle(state.tasks.now),today:toggle(state.tasks.today),later:toggle(state.tasks.later)}})
    }})
    if(task.done) cb.appendChild(document.createTextNode('✓'))
    row.appendChild(cb)

    const info = h('div',{style:{flex:'1'}})
    info.appendChild(h('div',{style:{fontSize:'15px',fontWeight:'600',color:'#f1f5f9',textDecoration:task.done?'line-through':'none',lineHeight:'1.4'}},task.text))
    if(task.site||task.assignee) {
      const tags = h('div',{style:{display:'flex',gap:'8px',marginTop:'5px',flexWrap:'wrap'}})
      if(task.site) tags.appendChild(h('span',{style:{fontSize:'11px',color:'#64748b'}},`📍 ${task.site}`))
      if(task.assignee) tags.appendChild(h('span',{style:{fontSize:'11px',color:'#64748b'}},`👤 ${ASSIGNEE[task.assignee]||task.assignee}`))
      info.appendChild(tags)
    }
    row.appendChild(info)

    if(!task.done) {
      row.appendChild(btn('✍️', ()=>navigate('action',{text:task.text,assignee:task.assignee}), {background:'#0f172a',borderRadius:'8px',padding:'7px 9px',color:'#64748b',fontSize:'16px',flexShrink:'0'}))
    }
    card.appendChild(row); body.appendChild(card)
  })
  el.appendChild(body)

  // Add modal
  if(showAdd) {
    let addText='', addAssignee='uri', addBucket='now', addColor='orange'
    const overlay = h('div',{style:{position:'fixed',inset:'0',background:'#000d',zIndex:'100',display:'flex',alignItems:'flex-end'}})
    const modal = h('div',{style:{background:'#1e293b',width:'100%',maxWidth:'430px',margin:'0 auto',borderRadius:'18px 18px 0 0',padding:'22px 16px 40px'}})
    modal.appendChild(h('div',{style:{fontSize:'16px',fontWeight:'700',marginBottom:'14px'}},'+ משימה חדשה'))
    const ta2 = h('textarea',{placeholder:'מה צריך לעשות?',style:{width:'100%',minHeight:'80px',background:'#0f172a',border:'1px solid #334155',borderRadius:'10px',padding:'12px',color:'#f1f5f9',fontSize:'15px',resize:'none',outline:'none',display:'block',marginBottom:'12px'}})
    ta2.oninput = e => addText = e.target.value
    modal.appendChild(ta2)
    const grid = h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}})
    ;[
      {label:'אחראי',opts:[['uri','אני'],['gio',"ג'יו"],['kenneth',"קנת'"],['asc','ASC'],['11-16','11-16']],set:v=>addAssignee=v},
      {label:'מתי',opts:[['now','עכשיו'],['today','היום'],['later','אחר כך']],set:v=>addBucket=v},
      {label:'עדיפות',opts:[['red','דחוף'],['orange','חשוב'],['green','שוטף']],set:v=>addColor=v},
    ].forEach(f => {
      const wrap = h('div',{}); wrap.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},f.label))
      const sel = h('select',{style:{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:'8px',padding:'9px 8px',color:'#f1f5f9',fontSize:'13px',outline:'none'}})
      f.opts.forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; sel.appendChild(o) })
      sel.onchange = e => f.set(e.target.value)
      wrap.appendChild(sel); grid.appendChild(wrap)
    })
    modal.appendChild(grid)
    const btnRow = h('div',{style:{display:'flex',gap:'8px'}})
    btnRow.appendChild(btn('הוסף', ()=>{
      if(!addText.trim()) return
      const task={id:`m${stamp()}`,text:addText.trim(),assignee:addAssignee,color:addColor,done:false,site:null}
      setState({tasks:{...state.tasks,[addBucket]:[...state.tasks[addBucket],task]}})
      showAdd=false; navigate('tasks')
    },{flex:'1',padding:'14px',borderRadius:'12px',background:'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff',fontSize:'15px',fontWeight:'700'}))

// ── SITES SCREEN ───────────────────────────────────────────────────
const renderSites = () => {
  let filter = 'open', showAdd = false
  let form = {name:'',province:'',issue:'',contractor:'',status:'open'}
  const rerender = () => { const newEl = renderSites(); document.getElementById('app').replaceChild(newEl, el) }
  const el = h('div',{class:'screen'})

  const header = h('div',{style:{padding:'48px 16px 12px',background:'linear-gradient(180deg,#1e293b,#0f172a)',position:'sticky',top:'0',zIndex:'10'}})

  topRow.appendChild(h('div',{style:{fontSize:'18px',fontWeight:'700'}},'אתרים'))
  topRow.appendChild(btn('+ הוסף',()=>{showAdd=true;rerender()},{background:'#1e40af',borderRadius:'10px',padding:'8px 14px',color:'#fff',fontSize:'13px',fontWeight:'600'}))
  header.appendChild(topRow)

  const tabs = h('div',{style:{display:'flex',gap:'6px'}})
  ;[['open','פתוחים'],['pending','ממתינים'],['resolved','נפתרו'],['all','הכל']].forEach(([v,l])=>{
    tabs.appendChild(btn(l,()=>{filter=v;rerender()},{flex:'1',padding:'8px 4px',borderRadius:'10px',background:filter===v?'#1e40af':'#1e293b',color:filter===v?'#fff':'#64748b',fontSize:'12px',fontWeight:'600'}))
  })
  header.appendChild(tabs); el.appendChild(header)

  const body = h('div',{class:'scrollable',style:{padding:'12px 16px',paddingBottom:'90px'}})
  const sites = filter==='all'?state.sites:state.sites.filter(s=>s.status===filter)

  if(sites.length===0) {
    const empty=h('div',{style:{textAlign:'center',padding:'60px 0',color:'#334155'}})
    empty.appendChild(h('div',{style:{fontSize:'36px',marginBottom:'8px'}},'📍'))
    empty.appendChild(h('div',{style:{fontSize:'14px'}},'אין אתרים'))
    body.appendChild(empty)
  }

  sites.forEach(site => {
    const sc = STATUS_COLOR[site.status]||'#64748b'
    const card = h('div',{style:{background:'#1e293b',borderRadius:'14px',padding:'14px',marginBottom:'8px',border:`1px solid ${sc}33`}})
    card.appendChild(h('div',{style:{fontSize:'15px',fontWeight:'700',color:'#f1f5f9'}},`📍 ${site.name}`))
    if(site.province) card.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b',marginTop:'2px'}},site.province))
    if(site.issue) card.appendChild(h('div',{style:{fontSize:'13px',color:'#94a3b8',marginTop:'6px',lineHeight:'1.5'}},site.issue))
    const tags = h('div',{style:{display:'flex',gap:'8px',marginTop:'8px',flexWrap:'wrap'}})
    if(site.contractor) tags.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'99px',background:'#0f172a',color:'#64748b'}},site.contractor.toUpperCase()))
    tags.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'99px',background:sc+'22',color:sc,fontWeight:'600'}},STATUS_LABEL[site.status]||site.status))
    card.appendChild(tags)
    const sbRow = h('div',{style:{display:'flex',gap:'6px',marginTop:'10px'}})
    ;['open','pending','resolved'].forEach(s=>{
      sbRow.appendChild(btn(STATUS_LABEL[s],()=>{
        setState({sites:state.sites.map(si=>si.name===site.name?{...si,status:s}:si)})
      },{flex:'1',padding:'7px 4px',borderRadius:'8px',background:site.status===s?STATUS_COLOR[s]+'33':'#0f172a',color:site.status===s?STATUS_COLOR[s]:'#475569',fontSize:'11px',fontWeight:'600'}))
    })
    card.appendChild(sbRow); body.appendChild(card)
  })
  el.appendChild(body)

  if(showAdd) {
    const overlay = h('div',{style:{position:'fixed',inset:'0',background:'#000d',zIndex:'100',display:'flex',alignItems:'flex-end'}})
    const modal = h('div',{style:{background:'#1e293b',width:'100%',maxWidth:'430px',margin:'0 auto',borderRadius:'18px 18px 0 0',padding:'22px 16px 40px',maxHeight:'85vh',overflowY:'auto'}})
    modal.appendChild(h('div',{style:{fontSize:'16px',fontWeight:'700',marginBottom:'14px'}},'+ אתר חדש'))
    ;[{label:'שם אתר',key:'name',ph:'Nambaran Deep Well'},{label:'מחוז',key:'province',ph:'Nueva Vizcaya'},{label:'בעיה',key:'issue',ph:'Lock Rotor A08'}].forEach(f=>{
      modal.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},f.label))
      const inp = h('input',{placeholder:f.ph,style:{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:'10px',padding:'10px 12px',color:'#f1f5f9',fontSize:'14px',outline:'none',display:'block',marginBottom:'10px',direction:'rtl'}})
      inp.oninput = e => form = {...form,[f.key]:e.target.value}
      modal.appendChild(inp)
    })
    const grid2 = h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'14px'}})
    ;[{label:'קבלן',key:'contractor',opts:[['','—'],['asc','ASC'],['11-16','11-16']]},{label:'סטטוס',key:'status',opts:[['open','פתוח'],['pending','ממתין'],['resolved','נפתר']]}].forEach(f=>{
      const wrap=h('div',{})
      wrap.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},f.label))
      const sel=h('select',{style:{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:'8px',padding:'10px 8px',color:'#f1f5f9',fontSize:'13px',outline:'none'}})
      f.opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o)})
      sel.onchange=e=>form={...form,[f.key]:e.target.value}
      wrap.appendChild(sel); grid2.appendChild(wrap)
    })
    modal.appendChild(grid2)
    const btnRow=h('div',{style:{display:'flex',gap:'8px'}})
    btnRow.appendChild(btn('הוסף',()=>{
      if(!form.name.trim()) return
      setState({sites:[...state.sites,{...form,id:stamp()}]})
      showAdd=false; navigate('sites')
    },{flex:'1',padding:'14px',borderRadius:'12px',background:'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff',fontSize:'15px',fontWeight:'700'}))
    btnRow.appendChild(btn('ביטול',()=>{showAdd=false;rerender()},{padding:'14px 18px',borderRadius:'12px',border:'1px solid #334155',background:'transparent',color:'#64748b',fontSize:'14px'}))
    modal.appendChild(btnRow); overlay.appendChild(modal); el.appendChild(overlay)
  }

  el.appendChild(renderNav()); return el
}

// ── PEOPLE SCREEN ──────────────────────────────────────────────────
const renderPeople = () => {
  let showAdd = false
  let form = {name:'',role:'contractor',company:'',pending:''}
  const rerender = () => { const newEl = renderPeople(); document.getElementById('app').replaceChild(newEl, el) }
  const el = h('div',{class:'screen'})
  const header = h('div',{style:{padding:'48px 16px 12px',background:'linear-gradient(180deg,#1e293b,#0f172a)',position:'sticky',top:'0',zIndex:'10'}})
  const topRow = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}})
  topRow.appendChild(h('div',{style:{fontSize:'18px',fontWeight:'700'}},'אנשים'))
  topRow.appendChild(btn('+ הוסף',()=>{showAdd=true;rerender()},{background:'#1e40af',borderRadius:'10px',padding:'8px 14px',color:'#fff',fontSize:'13px',fontWeight:'600'}))
  header.appendChild(topRow); el.appendChild(header)

  const body = h('div',{class:'scrollable',style:{padding:'12px 16px',paddingBottom:'90px'}})
  const withP = state.people.filter(p=>p.pending), withoutP = state.people.filter(p=>!p.pending)

  if(state.people.length===0) {
    const empty=h('div',{style:{textAlign:'center',padding:'60px 0',color:'#334155'}})
    empty.appendChild(h('div',{style:{fontSize:'36px',marginBottom:'8px'}},'👥'))
    empty.appendChild(h('div',{style:{fontSize:'14px'}},'אנשים יתווספו מהודעות'))
    body.appendChild(empty)
  }

  if(withP.length>0) { body.appendChild(h('div',{style:{fontSize:'11px',color:'#f59e0b',fontWeight:'700',letterSpacing:'0.5px',marginBottom:'8px'}},'⏳ ממתין תשובה')); withP.forEach(p=>body.appendChild(personCard(p))) }
  if(withoutP.length>0) { if(withP.length>0) body.appendChild(h('div',{style:{fontSize:'11px',color:'#475569',fontWeight:'700',letterSpacing:'0.5px',margin:'12px 0 8px'}},'אנשי קשר')); withoutP.forEach(p=>body.appendChild(personCard(p))) }

  el.appendChild(body)

  if(showAdd) {
    const overlay=h('div',{style:{position:'fixed',inset:'0',background:'#000d',zIndex:'100',display:'flex',alignItems:'flex-end'}})
    const modal=h('div',{style:{background:'#1e293b',width:'100%',maxWidth:'430px',margin:'0 auto',borderRadius:'18px 18px 0 0',padding:'22px 16px 40px'}})
    modal.appendChild(h('div',{style:{fontSize:'16px',fontWeight:'700',marginBottom:'14px'}},'+ איש קשר'))
    ;[{label:'שם',key:'name',ph:'Dave'},{label:'חברה',key:'company',ph:'ASC Construction'},{label:'ממתין ל...',key:'pending',ph:'חתימה על waiver'}].forEach(f=>{
      modal.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},f.label))
      const inp=h('input',{placeholder:f.ph,style:{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:'10px',padding:'10px 12px',color:'#f1f5f9',fontSize:'14px',outline:'none',display:'block',marginBottom:'10px',direction:'rtl'}})
      inp.oninput=e=>form={...form,[f.key]:e.target.value}; modal.appendChild(inp)
    })
    modal.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'4px'}},'תפקיד'))
    const sel=h('select',{style:{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:'8px',padding:'10px 8px',color:'#f1f5f9',fontSize:'13px',outline:'none',display:'block',marginBottom:'14px'}})
    ;[['contractor','קבלן'],['engineer','מהנדס'],['nia','NIA'],['other','אחר']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o)})
    sel.onchange=e=>form={...form,role:e.target.value}; modal.appendChild(sel)
    const btnRow=h('div',{style:{display:'flex',gap:'8px'}})
    btnRow.appendChild(btn('הוסף',()=>{if(!form.name.trim())return; setState({people:[...state.people,{...form,id:stamp()}]}); showAdd=false; navigate('people')},{flex:'1',padding:'14px',borderRadius:'12px',background:'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff',fontSize:'15px',fontWeight:'700'}))
    btnRow.appendChild(btn('ביטול',()=>{showAdd=false;rerender()},{padding:'14px 18px',borderRadius:'12px',border:'1px solid #334155',background:'transparent',color:'#64748b',fontSize:'14px'}))
    modal.appendChild(btnRow); overlay.appendChild(modal); el.appendChild(overlay)
  }
  el.appendChild(renderNav()); return el
}

const personCard = (person) => {
  const ROLE_COLOR = {engineer:'#3b82f6',contractor:'#f59e0b',nia:'#06b6d4',other:'#64748b'}
  const rc = ROLE_COLOR[person.role]||'#64748b'
  const card = h('div',{style:{background:'#1e293b',borderRadius:'14px',padding:'14px',marginBottom:'8px',border:`1px solid ${person.pending?'#f59e0b33':'transparent'}`}})
  const row = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}})
  const left = h('div',{style:{flex:'1'}})
  const nameRow = h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}})
  const avatar = h('div',{style:{width:'32px',height:'32px',borderRadius:'50%',background:rc+'22',border:`1.5px solid ${rc}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',color:rc,fontWeight:'700',flexShrink:'0'}},person.name[0]?.toUpperCase()||'?')
  nameRow.appendChild(avatar)
  const nameInfo = h('div',{})
  nameInfo.appendChild(h('div',{style:{fontSize:'15px',fontWeight:'700',color:'#f1f5f9'}},person.name))
  if(person.company) nameInfo.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b'}},person.company))
  nameRow.appendChild(nameInfo); left.appendChild(nameRow)
  if(person.pending) {
    const pend=h('div',{style:{marginTop:'10px',padding:'8px 10px',background:'#f59e0b11',borderRadius:'8px',border:'1px solid #f59e0b22'}})
    pend.appendChild(h('div',{style:{fontSize:'10px',color:'#f59e0b',fontWeight:'700',marginBottom:'3px'}},'⏳ ממתין'))
    pend.appendChild(h('div',{style:{fontSize:'13px',color:'#94a3b8',lineHeight:'1.5'}},person.pending))
    left.appendChild(pend)
  }
  row.appendChild(left)
  const actions = h('div',{style:{display:'flex',gap:'6px',marginRight:'8px'}})
  actions.appendChild(btn('✍️',()=>navigate('action',{text:person.pending||person.name,assignee:person.name}),{background:'#0f172a',borderRadius:'8px',padding:'7px 9px',color:'#64748b',fontSize:'16px'}))
  if(person.pending) {
    actions.appendChild(btn('✓',()=>setState({people:state.people.map(p=>p.name===person.name?{...p,pending:''}:p)}),{background:'#4ade8022',border:'1px solid #4ade8044',borderRadius:'8px',padding:'7px 9px',color:'#4ade80',fontSize:'14px',fontWeight:'700'}))
  }
  row.appendChild(actions); card.appendChild(row); return card
}

// ── ACTION SCREEN ──────────────────────────────────────────────────
const renderAction = () => {
  let result = null, loading = false, copied = false
  const el = h('div',{class:'screen',style:{padding:'48px 16px 24px'}})
  const backRow = h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'20px'}})
  backRow.appendChild(btn('←',goBack,{background:'#1e293b',borderRadius:'10px',padding:'10px 14px',color:'#94a3b8',fontSize:'18px'}))
  backRow.appendChild(h('div',{style:{fontSize:'18px',fontWeight:'700'}},'צור תוכן'))
  el.appendChild(backRow)

  if(actionCtx?.text) {
    const preview = h('div',{style:{background:'#1e293b',borderRadius:'12px',padding:'14px',marginBottom:'20px',borderRight:'3px solid #3b82f6'}})
    preview.appendChild(h('div',{style:{fontSize:'14px',color:'#f1f5f9',lineHeight:'1.5'}},actionCtx.text))
    if(actionCtx.assignee) preview.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b',marginTop:'4px'}},`👤 ${actionCtx.assignee}`))
    el.appendChild(preview)
  }

  const content = h('div',{})
  el.appendChild(content)

  const rerender = () => {
    content.innerHTML=''
    if(!result) {
      ;[{type:'whatsapp',icon:'💬',label:'הודעת WhatsApp',sub:"לג'יו / קנת' / קבלן"},
        {type:'email',icon:'📧',label:'מייל',sub:'ASC / 11-16 / NIA'},
        {type:'monday',icon:'📋',label:'עדכון Monday',sub:'סטטוס + פעולה הבאה'}
      ].forEach(a => {
        const b2 = h('div',{style:{padding:'16px',borderRadius:'14px',border:'1px solid #334155',background:'#1e293b',cursor:loading?'default':'pointer',marginBottom:'10px',opacity:loading?'0.6':'1'},onClick:async ()=>{
          if(loading) return
          loading=true; rerender()
          try { result = await genAction(a.type, actionCtx?.text, actionCtx?.assignee) } catch(e) { result='שגיאה: '+e.message }
          loading=false; rerender()
        }})
        b2.appendChild(h('div',{style:{fontSize:'16px',fontWeight:'600'}},`${a.icon} ${a.label}`))
        b2.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b',marginTop:'3px'}},a.sub))
        content.appendChild(b2)
      })
      if(loading) {
        const ld=h('div',{style:{textAlign:'center',padding:'40px 0',color:'#64748b'}})
        ld.appendChild(h('div',{style:{fontSize:'32px',marginBottom:'10px'}},'✍️'))
        ld.appendChild(h('div',{style:{fontSize:'14px'}},'כותב...'))
        content.appendChild(ld)
      }
    } else {
      const res=h('div',{style:{background:'#1e293b',borderRadius:'14px',padding:'16px',fontSize:'14px',color:'#e2e8f0',lineHeight:'1.8',whiteSpace:'pre-wrap',marginBottom:'12px',direction:'ltr',textAlign:'left'}},result)
      content.appendChild(res)
      content.appendChild(btn(copied?'✓ הועתק!':'📋 העתק',()=>{
        navigator.clipboard.writeText(result).then(()=>{copied=true;rerender();setTimeout(()=>{copied=false;rerender()},2000)})
      },{width:'100%',padding:'15px',borderRadius:'14px',background:copied?'#16a34a':'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff',fontSize:'16px',fontWeight:'700',display:'block',marginBottom:'10px'}))
      content.appendChild(btn('← צור משהו אחר',()=>{result=null;rerender()},{width:'100%',padding:'14px',borderRadius:'14px',border:'1px solid #334155',background:'transparent',color:'#64748b',fontSize:'14px',display:'block'}))
    }
  }
  rerender(); return el
}

// ── SETTINGS SCREEN ────────────────────────────────────────────────
const renderSettings = () => {
  const el = h('div',{class:'screen',style:{padding:'48px 16px 24px'}})
  const backRow = h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'24px'}})
  backRow.appendChild(btn('←',goBack,{background:'#1e293b',borderRadius:'10px',padding:'10px 14px',color:'#94a3b8',fontSize:'18px'}))
  backRow.appendChild(h('div',{style:{fontSize:'18px',fontWeight:'700'}},'הגדרות'))
  el.appendChild(backRow)

  const keyCard = h('div',{style:{background:'#1e293b',borderRadius:'14px',padding:'16px',marginBottom:'14px'}})
  keyCard.appendChild(h('div',{style:{fontSize:'14px',fontWeight:'700',marginBottom:'4px'}},'🔑 Anthropic API Key'))
  const link = h('a',{href:'https://console.anthropic.com/settings/keys',target:'_blank',style:{color:'#3b82f6',fontSize:'12px',display:'block',marginBottom:'12px'}},'קבל מפתח כאן ←')
  keyCard.appendChild(link)
  const inp = h('input',{type:'password',placeholder:'sk-ant-...',value:apiKey,style:{width:'100%',background:'#0f172a',border:'1px solid #334155',borderRadius:'10px',padding:'12px',color:'#f1f5f9',fontSize:'13px',outline:'none',direction:'ltr',display:'block',marginBottom:'10px'}})
  keyCard.appendChild(inp)
  let saved=false
  const saveBtn = btn('שמור',()=>{
    apiKey=inp.value.trim(); localStorage.setItem('fieldy_key',apiKey)
    saveBtn.textContent='✓ נשמר!'; saveBtn.style.background='#16a34a'
    setTimeout(()=>{saveBtn.textContent='שמור';saveBtn.style.background='linear-gradient(135deg,#3b82f6,#06b6d4)'},2000)
  },{width:'100%',padding:'12px',borderRadius:'10px',background:'linear-gradient(135deg,#3b82f6,#06b6d4)',color:'#fff',fontSize:'14px',fontWeight:'700',display:'block'})
  keyCard.appendChild(saveBtn); el.appendChild(keyCard)

  const clearCard = h('div',{style:{background:'#1e293b',borderRadius:'14px',padding:'16px'}})
  clearCard.appendChild(h('div',{style:{fontSize:'14px',fontWeight:'700',marginBottom:'4px'}},'🗑 נקה נתוני יום'))
  clearCard.appendChild(h('div',{style:{fontSize:'12px',color:'#64748b',marginBottom:'12px'}},'מחיקת כל המשימות, אתרים ואנשים.'))
  let confirm=false
  const clearBtn = btn('נקה הכל',()=>{
    if(!confirm){confirm=true;clearBtn.textContent='בטוח? לחץ שוב לאישור';clearBtn.style.background='#ef4444';return}
    state=fresh(); save(state); navigate('home')
  },{padding:'10px 16px',borderRadius:'10px',border:'1px solid #ef444444',background:'transparent',color:'#ef4444',fontSize:'13px'})
  clearCard.appendChild(clearBtn); el.appendChild(clearCard)
  return el
}

// ── NAV BAR ────────────────────────────────────────────────────────
const renderNav = () => {
  const urgentCount = state.tasks.now.filter(t=>!t.done).length
  const sitesCount = state.sites.filter(s=>s.status==='open'||s.status==='pending').length
  const peopleCount = state.people.filter(p=>p.pending).length
  const nav = h('nav',{style:{position:'fixed',bottom:'0',right:'0',left:'0',background:'#0f172a',borderTop:'1px solid #1e293b',display:'grid',gridTemplateColumns:'repeat(4,1fr)',padding:'8px 0 20px',maxWidth:'430px',margin:'0 auto',zIndex:'50'}})
  ;[
    {key:'home',icon:'☀️',label:'בית',badge:0},
    {key:'tasks',icon:'⚡',label:'משימות',badge:urgentCount},
    {key:'sites',icon:'📍',label:'אתרים',badge:sitesCount},
    {key:'people',icon:'👥',label:'אנשים',badge:peopleCount},
  ].forEach(t => {
    const active = screen===t.key
    const b = h('button',{style:{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',padding:'4px 0',position:'relative'},onClick:()=>navigate(t.key)})
    const iconWrap = h('div',{style:{position:'relative'}})
    iconWrap.appendChild(h('span',{style:{fontSize:'22px'}},t.icon))
    if(t.badge>0) {
      const badge = h('span',{style:{position:'absolute',top:'-4px',right:'-6px',background:'#ef4444',color:'#fff',borderRadius:'99px',fontSize:'10px',fontWeight:'700',padding:'1px 5px',minWidth:'16px',textAlign:'center'}},String(t.badge))
      iconWrap.appendChild(badge)
    }
    b.appendChild(iconWrap)
    b.appendChild(h('span',{style:{fontSize:'10px',color:active?'#3b82f6':'#475569',fontWeight:active?'700':'400'}},t.label))
    nav.appendChild(b)
  })
  return nav
}

// ── RENDER ─────────────────────────────────────────────────────────
const render = () => {
  const app = document.getElementById('app')
  app.innerHTML=''
  let el
  if(screen==='home') el=renderHome()
  else if(screen==='input') el=renderInput()
  else if(screen==='tasks') el=renderTasks()
  else if(screen==='sites') el=renderSites()
  else if(screen==='people') el=renderPeople()
  else if(screen==='action') el=renderAction()
  else if(screen==='settings') el=renderSettings()
  if(el) app.appendChild(el)
}

render()
</script>
