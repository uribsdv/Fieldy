<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fieldy"/>
<link rel="manifest" href="/Fieldy/manifest.json"/>
<title>Fieldy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#080f0a;color:#e4efe0;direction:rtl;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea,select,input{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.hidden{display:none!important}
/* Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#0f172a;border-top:1px solid #1e293b;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 0 24px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;background:none;border:none;position:relative}
.nav-icon{font-size:22px}
.nav-label{font-size:10px;color:#475569;font-weight:400}
.nav-btn.active .nav-label{color:#3b82f6;font-weight:700}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:#c8a030;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
/* Cards */
.card{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:8px}
.card-red{border:1.5px solid #ef444460;background:#ef444418}
.card-orange{border:1.5px solid #f59e0b60;background:#f59e0b18}
.card-green{border:1.5px solid #4ade8060;background:#4ade8018}
/* Buttons */
.btn-primary{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#3d6e34,#4a7c3f);color:#fff;font-size:15px;font-weight:700;display:block;border:none;cursor:pointer}
.btn-secondary{padding:14px 18px;border-radius:12px;border:1px solid #334155;background:transparent;color:#64748b;font-size:14px;cursor:pointer}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:#000d;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#1e293b;width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:22px 16px 40px;max-height:85vh;overflow-y:auto}
/* Form */
.form-label{font-size:11px;color:#64748b;margin-bottom:4px;display:block}
.form-input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:11px 12px;color:#f1f5f9;font-size:14px;outline:none;display:block;margin-bottom:10px;direction:rtl}
.form-select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 8px;color:#f1f5f9;font-size:13px;outline:none}
/* Tags */
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#0f172a;color:#64748b}
.tag-red{background:#ef444422;color:#ef4444;font-weight:600}
.tag-orange{background:#f59e0b22;color:#f59e0b;font-weight:600}
.tag-green{background:#4ade8022;color:#4ade80;font-weight:600}
.tag-status-open{background:#ef444422;color:#ef4444;font-weight:600}
.tag-status-pending{background:#f59e0b22;color:#f59e0b;font-weight:600}
.tag-status-resolved{background:#4ade8022;color:#4ade80;font-weight:600}
/* Checkbox */
.cb{width:26px;height:26px;border-radius:8px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all 0.15s;border:2px solid}
/* Progress */
.progress-bar{background:#1e293b;border-radius:99px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.4s;background:linear-gradient(90deg,#3b82f6,#06b6d4)}
/* Screens header */
.screen-header{padding:48px 16px 12px;background:linear-gradient(180deg,#111f13,#080f0a);position:sticky;top:0;z-index:10}
/* Empty state */
.empty{text-align:center;padding:60px 0;color:#334155}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-text{font-size:14px}
/* Action result */
.action-result{background:#0f172a;border-radius:14px;padding:16px;font-size:14px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;direction:ltr;text-align:left;max-height:300px;overflow-y:auto}

/* Japanese Earth Palette */
:root{
  --ink:#080f0a;--ink2:#111f13;--ink3:#1a2e1c;
  --washi:#e8f0e4;--warm:#e8ddd0;
  --matcha:#4a6741;--matcha2:#6b8c61;
  --gold:#c4922a;--gold2:#d4a84b;
  --terracotta:#8b4513;--rust:#a0522d;
  --cherry:#c8a030;
  --text2:#b0c8a8;--text3:#7a9a72;
}
.tao-screen{background:linear-gradient(180deg,#060c08 0%,var(--ink) 100%);min-height:100%}
.tao-card{background:linear-gradient(135deg,#111f13,#0d1f0f);border:1px solid #4a7c3f;border-radius:16px;padding:20px;position:relative;overflow:hidden}
.tao-verse{font-size:16px;line-height:2.4;color:#e8f0e4;text-align:center;font-weight:300;letter-spacing:0.5px}
.tao-chapter-num{font-size:11px;color:#c4922a;font-weight:600;letter-spacing:2px;margin-bottom:12px;text-align:center}
.tao-title{font-size:13px;color:#b0c8a8;text-align:center;margin-bottom:16px;font-style:italic}
.med-timer{font-size:48px;font-weight:200;color:#e8f0e4;text-align:center;letter-spacing:4px}
.med-circle{width:180px;height:180px;border-radius:50%;border:2px solid #4a7c3f;display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;background:radial-gradient(circle,rgba(196,146,42,0.08),transparent)}
.breath-text{font-size:18px;color:#8fc87a;text-align:center;margin-top:16px;font-weight:300;letter-spacing:1px}
.brush{position:absolute;opacity:0.06;font-size:120px;pointer-events:none;user-select:none;color:#6a9e5a}
@keyframes ripple{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.5);opacity:0}}
.success-ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:2px solid #4a7c3f;pointer-events:none;z-index:999;animation:ripple 0.7s ease-out forwards}


/* === ZEN SPA ATMOSPHERE === */

/* Subtle bamboo texture via gradient */
body {
  background: #080f0a;
  background-image: 
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 60px,
      rgba(74,124,63,0.015) 60px,
      rgba(74,124,63,0.015) 61px
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 80px,
      rgba(74,124,63,0.01) 80px,
      rgba(74,124,63,0.01) 81px
    );
}

/* Ink wash header effect */
.screen-header {
  background: linear-gradient(180deg, #111f13 0%, rgba(17,31,19,0.95) 100%) !important;
  border-bottom: 1px solid rgba(74,124,63,0.2) !important;
}

/* Glassmorphism cards */
.card {
  background: rgba(17,31,19,0.85) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(74,124,63,0.2) !important;
  transition: border-color 0.2s;
}

/* Zen nav */
#nav {
  background: rgba(8,15,10,0.92) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(74,124,63,0.15) !important;
}

/* Soft glow on active nav */
.nav-btn.active .nav-icon {
  filter: drop-shadow(0 0 6px rgba(143,200,122,0.5));
}

/* Ripple update */
.success-ring {
  border-color: var(--bamboo2) !important;
}

/* Zen modal */
.modal {
  background: rgba(8,15,10,0.97) !important;
  border-top: 2px solid var(--bamboo) !important;
}

/* Screen transitions */
.screen {
  transition: opacity 0.15s ease;
}

/* Tao screen special atmosphere */
#screen-tao {
  background: linear-gradient(180deg, #06100a 0%, #080f0a 100%);
}

/* Form inputs zen style */
.form-input, .form-select {
  background: rgba(8,15,10,0.9) !important;
  border: 1px solid rgba(74,124,63,0.25) !important;
  color: var(--text1) !important;
}

/* Zen scrollbar */
::-webkit-scrollbar { width: 2px; }
::-webkit-scrollbar-thumb { background: rgba(74,124,63,0.3); border-radius: 99px; }

/* Zen background illustrations */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20430%20800%27%20opacity%3D%270.07%27%3E%0A%20%20%3Cstyle%3Eline%2Crect%7Bstroke%3A%236a9e5a%3Bstroke-linecap%3Around%7D%3C/style%3E%0A%20%20%3C%21--%20Bamboo%20stalks%20--%3E%0A%20%20%3Cline%20x1%3D%2760%27%20y1%3D%27800%27%20x2%3D%2755%27%20y2%3D%270%27%20stroke-width%3D%2714%27/%3E%0A%20%20%3Cline%20x1%3D%2762%27%20y1%3D%27750%27%20x2%3D%2757%27%20y2%3D%27-50%27%20stroke-width%3D%271%27%20opacity%3D%270.3%27/%3E%0A%20%20%3Crect%20x%3D%2748%27%20y%3D%27120%27%20width%3D%2720%27%20height%3D%273%27%20rx%3D%271%27%20opacity%3D%270.6%27/%3E%0A%20%20%3Crect%20x%3D%2748%27%20y%3D%27280%27%20width%3D%2720%27%20height%3D%273%27%20rx%3D%271%27%20opacity%3D%270.6%27/%3E%0A%20%20%3Crect%20x%3D%2748%27%20y%3D%27450%27%20width%3D%2720%27%20height%3D%273%27%20rx%3D%271%27%20opacity%3D%270.6%27/%3E%0A%20%20%3Crect%20x%3D%2748%27%20y%3D%27620%27%20width%3D%2720%27%20height%3D%273%27%20rx%3D%271%27%20opacity%3D%270.6%27/%3E%0A%20%20%3C%21--%20Leaves%20left%20stalk%20--%3E%0A%20%20%3Cpath%20d%3D%27M55%20130%20Q20%20110%2010%2080%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%276%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M55%20130%20Q90%20115%20100%2090%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%275%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M55%20290%20Q15%20270%205%20240%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%276%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M55%20460%20Q90%20440%20105%20415%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%275%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M55%20460%20Q20%20445%208%20420%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%276%27%20fill%3D%27none%27/%3E%0A%20%20%3C%21--%20Second%20stalk%20--%3E%0A%20%20%3Cline%20x1%3D%27370%27%20y1%3D%27800%27%20x2%3D%27365%27%20y2%3D%27100%27%20stroke-width%3D%2711%27/%3E%0A%20%20%3Crect%20x%3D%27358%27%20y%3D%27200%27%20width%3D%2716%27%20height%3D%272.5%27%20rx%3D%271%27%20opacity%3D%270.5%27/%3E%0A%20%20%3Crect%20x%3D%27358%27%20y%3D%27380%27%20width%3D%2716%27%20height%3D%272.5%27%20rx%3D%271%27%20opacity%3D%270.5%27/%3E%0A%20%20%3Crect%20x%3D%27358%27%20y%3D%27560%27%20width%3D%2716%27%20height%3D%272.5%27%20rx%3D%271%27%20opacity%3D%270.5%27/%3E%0A%20%20%3Cpath%20d%3D%27M365%20210%20Q395%20195%20408%20170%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%275%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M365%20210%20Q335%20198%20322%20175%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%275%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M365%20390%20Q330%20372%20318%20348%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%275%27%20fill%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M365%20570%20Q400%20552%20415%20528%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%275%27%20fill%3D%27none%27/%3E%0A%20%20%3C%21--%20Third%20thin%20stalk%20--%3E%0A%20%20%3Cline%20x1%3D%27210%27%20y1%3D%27800%27%20x2%3D%27215%27%20y2%3D%27300%27%20stroke-width%3D%278%27%20opacity%3D%270.5%27/%3E%0A%20%20%3Crect%20x%3D%27207%27%20y%3D%27450%27%20width%3D%2712%27%20height%3D%272%27%20rx%3D%271%27%20opacity%3D%270.4%27/%3E%0A%20%20%3Crect%20x%3D%27207%27%20y%3D%27600%27%20width%3D%2712%27%20height%3D%272%27%20rx%3D%271%27%20opacity%3D%270.4%27/%3E%0A%20%20%3Cpath%20d%3D%27M212%20460%20Q235%20445%20242%20422%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%274%27%20fill%3D%27none%27%20opacity%3D%270.7%27/%3E%0A%20%20%3Cpath%20d%3D%27M212%20610%20Q190%20595%20182%20572%27%20stroke%3D%27%236a9e5a%27%20stroke-width%3D%274%27%20fill%3D%27none%27%20opacity%3D%270.7%27/%3E%0A%3C/svg%3E");
  background-size: cover;
  background-position: center;
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
}

/* Tao screen gets water ripple instead */
#screen-tao::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20430%20800%27%20opacity%3D%270.05%27%3E%0A%20%20%3Cstyle%3Eellipse%7Bfill%3Anone%3Bstroke%3A%236a9e5a%3Bstroke-width%3A1%7D%3C/style%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2720%27%20ry%3D%278%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2750%27%20ry%3D%2720%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%2790%27%20ry%3D%2736%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%27140%27%20ry%3D%2756%27/%3E%0A%20%20%3Cellipse%20cx%3D%27215%27%20cy%3D%27680%27%20rx%3D%27200%27%20ry%3D%2780%27/%3E%0A%20%20%3Cellipse%20cx%3D%2760%27%20cy%3D%27200%27%20rx%3D%2712%27%20ry%3D%275%27/%3E%0A%20%20%3Cellipse%20cx%3D%2760%27%20cy%3D%27200%27%20rx%3D%2730%27%20ry%3D%2712%27/%3E%0A%20%20%3Cellipse%20cx%3D%2760%27%20cy%3D%27200%27%20rx%3D%2755%27%20ry%3D%2722%27/%3E%0A%20%20%3Cellipse%20cx%3D%27360%27%20cy%3D%27350%27%20rx%3D%2715%27%20ry%3D%276%27/%3E%0A%20%20%3Cellipse%20cx%3D%27360%27%20cy%3D%27350%27%20rx%3D%2738%27%20ry%3D%2715%27/%3E%0A%20%20%3Cellipse%20cx%3D%27360%27%20cy%3D%27350%27%20rx%3D%2765%27%20ry%3D%2726%27/%3E%0A%20%20%3C%21--%20Misty%20mountain%20silhouette%20--%3E%0A%20%20%3Cpath%20d%3D%27M0%20500%20Q80%20380%20160%20420%20Q215%20360%20260%20400%20Q330%20320%20430%20400%20L430%20800%20L0%20800Z%27%20fill%3D%27rgba%2874%2C124%2C63%2C0.04%29%27%20stroke%3D%27none%27/%3E%0A%20%20%3Cpath%20d%3D%27M0%20560%20Q100%20480%20200%20510%20Q280%20460%20430%20490%20L430%20800%20L0%20800Z%27%20fill%3D%27rgba%2874%2C124%2C63%2C0.03%29%27%20stroke%3D%27none%27/%3E%0A%3C/svg%3E");
  background-size: cover;
  pointer-events: none;
  z-index: 0;
}

#screen-tao > * {
  position: relative;
  z-index: 1;
}

/* ═══ CALENDAR ═══ */
.cal-header{padding:52px 18px 12px;background:linear-gradient(180deg,rgba(13,23,16,.97),rgba(13,23,16,.85));backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{background:rgba(13,23,16,.8);border:1px solid var(--border2);border-radius:10px;padding:8px 14px;color:var(--t2);font-size:18px;cursor:pointer}
.cal-month-title{font-size:18px;font-weight:700;color:var(--t1)}
.cal-view-tabs{display:flex;gap:4px}
.cal-view-tab{flex:1;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--t3);background:transparent;transition:all .2s}
.cal-view-tab.active{background:rgba(61,122,53,.15);color:var(--sprout);border:1px solid rgba(61,122,53,.3)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 2px;gap:2px}
.cal-weekday{font-size:10px;color:var(--t3);text-align:center;font-weight:600;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 8px;gap:2px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.cal-day.today{background:rgba(61,122,53,.2);border-color:var(--bamboo)}
.cal-day.today .cal-dn{color:var(--sprout);font-weight:800}
.cal-day.other-month .cal-dn{color:var(--t4)}
.cal-dn{font-size:13px;font-weight:500;color:var(--t2);line-height:1}
.cal-dots{display:flex;gap:2px;margin-top:2px}
.cal-dot{width:4px;height:4px;border-radius:50%}
.ev-card{background:var(--glass2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-right:3px solid var(--bamboo);cursor:pointer}
.ev-time{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px;letter-spacing:.5px}
.ev-title{font-size:14px;color:var(--t1);font-weight:600;line-height:1.4}
.ev-note{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.5}
.rec-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(200,148,30,.15);color:var(--amber);font-weight:600;margin-top:5px}
.week-row{display:flex;align-items:flex-start;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);min-height:52px;cursor:pointer}
.week-dlabel{width:36px;flex-shrink:0}
.week-dname{font-size:10px;color:var(--t3);font-weight:600}
.week-dnum{font-size:18px;font-weight:700;color:var(--t2);line-height:1}
.week-dnum.today{color:var(--sprout)}
.week-epill{background:rgba(61,122,53,.15);border:1px solid rgba(61,122,53,.25);border-radius:8px;padding:5px 10px;margin-bottom:4px;font-size:12px;color:var(--t1);font-weight:500}
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen"></div>
  <div id="screen-tasks" class="screen hidden"></div>
  <div id="screen-sites" class="screen hidden"></div>
  <div id="screen-people" class="screen hidden"></div>
  <div id="screen-tao" class="screen hidden"></div>

let apiKey = localStorage.getItem('fieldy_key') || ''
let currentScreen = 'home'

const save = () => { localStorage.setItem(KEY, JSON.stringify(state)) }
const setState = (patch) => { Object.assign(state, patch, {updated: new Date().toISOString()}); save(); refreshBadges(); renderCurrentScreen() }

const NAV_SCREENS = ['home','tasks','sites','people','calendar','tao']

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = btn.dataset.screen
    navigateTo(s)
  })
})

function navigateTo(screen, ctx=null) {
  if(ctx) actionCtx = ctx

  // Hide all screens
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'))
  
  // Show target
  document.getElementById('screen-' + screen).classList.remove('hidden')
  
  // Update nav
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');})
  const activeBtn = document.querySelector(`.nav-btn[data-screen="${screen}"]`)
  if(activeBtn) activeBtn.classList.add('active')
  
  // Show/hide nav
  document.getElementById('nav').style.display = NAV_SCREENS.includes(screen) ? 'grid' : 'none'
  
  currentScreen = screen
  renderCurrentScreen()
  
  // Scroll to top
  const el = document.getElementById('screen-' + screen)
  if(el) el.scrollTop = 0
}

function goBack() {
  navigateTo('home')
}

והשוד\nאך ארבעה עיקרים אלה אין בהם די\nהם רק אומרים מה לא לעשות\nחשובים יותר הם ארבעת העיקרים\nשל מה שחשוב לעשות\nהיה תם לב\nדבק בפשטות\nהמעט עצמך\nצמצם בתאוות", "זנח\nהרגלים\nישנים\nגלה\nאת\nעצמך\nהעירום\nוחבק\nאת\nהאופי\nהראשון\nאני\nקל להסתבך\nבין הגדרות של טוב ורע\nקשה להגדיר באופן מוחלט\nמה חיובי ומה שלילי\nנכון ושגוי\nמה מעט נבדלים השניים\nואולי לא ניגודים הם\nאלא אבני רחיים\nבין כן ובין לא\nמה המרחק\nבין טוב ובין רע\nמי ישער את ההבדל\nאבל האנשים\nמקפצים בחיים\nצוהלים\nכאילו היו במסיבה נהדרת\nכמו ילדים\nשהעפילו ביום אביב\nאל ראש מגדל\nאני לבדי אדיש ושקט\nלא מראה סימנים\nלפעמים אני מרגיש כמו תינוק\nשעדיין אינו מסוגל לחייך\nעצוב אני כמו אחד שאין לו בית\nנראה כמו דחליל זרוק\nלכל האחרים יש יותר מאשר די\nורק אני לבד ואין לאן לחזור\nלבי מבולבל\nמחשבותיי כמו של שוטה", "לעיתים נראה כי סתום לי המוח\nאני לא באמת יודע הרבה\nיש אנשים מבריקים ומלאי בטחון\nואני כה עמום\nעם בטחון של חלזון\nיש אנשים צלולים\nואני\nגם לעצמי חסר שקיפות\nזנוח ללא עוגן\nמיטלטל\nכמו הרוח\nשאינה חדלה לנשוב\nהאנשים\nנדמה כי יש להם מה לעשות\nואני כה חסר תכלית\nלפעמים מגושם\nובשאר הזמן לא מעשי\nכזה אני\nשונה אולי מכל האחרים\nאבל מעריך יותר מכל\nאת החיפוש\nאחר הפלא הקיומי\nכמו בן המחפש\nאת אימא\nטוב ורע נכון ושגוי\nאינם זהים בעיני\nאך אני מפחד משניהם\nמכיוון שהם אינסופיים\nואין לדעת את אחריתם\nואולי כך הוא הדבר\nואיש הטאו שונה יהיה\nמשאר בני האדם\nלא\nמחכה\nבאף\nשולחן\nיונק\nישירות\nמהחזה\nשל\nהטבע\nאכן קל להסתבך\nבין הגדרות של טוב ורע,\nוקשה להגדיר באופן מוחלט\nמה חיובי ומה שלילי.\nלהמר על הטאו\nמידה נעלה היא\nללכת בדרך הטאו\nצריך אומץ רב\nכדי להמר עם הכל\nעל דבר שאין לו דמות\nלא שם ולא צורה\nמימי קדם\nועד עתה\nמבחינת הטאו\nדבר\nלא השתנה\nמהיכן אני יודע כל זאת?\nכך גילה לי הטאו\nמעורפל\nמסתורי\nבלתי מושג\nהאמת\nשם נמצאת\nבתוכה המהות\nועמה\nהנאמנות\nוהאמונה", "כפוף\nהיה צנוע ותישאר גדול\nהיה כפוף ותישאר ישר\nהיה ריק ותישאר מלא\nהיה בלוי ותישאר חדש\nזה אשר מעט לו\nיקבל\nזה אשר הרבה לו\nישועבד\nאין הוא מתרברב\nלמרות שיש לו הישגים\nאין הוא מתנשא\nלכן כבודו מאריך ימים\nאין הוא נאבק\nלכן לא נאבקים בו\nאין הו nאם ישמע אדם בינוני על הטאו\nלשעה ישמרהו ולשעה יאבדהו\nאם ישמע שוטה על הטאו\nיפרוץ בצחוק גדול\nאם לא היה צוחק\nלא היה זה טאו\nעל כן יש האומרים\nהנאור בטאו\nנראה חשוך\nהמתקדם בטאו\nנראה נסוג\nהמישיר בטאו\nנראה אובד דרך", "הטאו\nכמו נהר\nחזק\nרחב\nועמוק\nכמו עיגול\nאבל\nלבן\nיותר\nמהירח\nכמו\nריבוע גדול\nאבל\nבלי זוויות\nכמו תינוק\nהרך מכל\nחווה את הקשה מכל\nיוצא מתוך חום בלי חלל\nאל חלל נטול חום\nמתוך כך למדתי\nאת יתרונה של\nהזרימה הטבעית\nאת כל הנחוץ\nכוח החיים כבר יעשה\nיש הרבה חכמה וכוח\nבמקומות\nשאין בהם מילים\nאבל\nמי יצליח\nלטפל\nבדאגות\nכמו\nתינוק", "יין ויאנג\nטאו הוא אחד\nאחד הוליד\nוהנה שניים\nשניים הם ניגוד\nניגוד שווה שלושה\nכשיש שלושה\nעולים מיד\nעוד רבבה\nאבל היין והיאנג\nכמו הצל והאור\nאחד מלפנים\nשני מאחור\nההרמוניה בין הניגודים\nהיא נשמת החיים\nהמחבל\nבסדר הטוב\nגם\nיחיה\nוימות\nאבל לא\nבסדר\nהנכון", "שלוש שאלות\nשמך או עצמך\nמה קרוב אליך יותר\nעצמך או רכושך\nמה יקר לך יותר\nרכושך או בריאותך\nהיכן כואב לך יותר\nשים לב\nמרבה התלהבות\nמרבה הוצאות\nמרבה אגירה\nמרבה הפסדים\nלכן\nדע לשמוח בחלקך\nולא תדע בושה\nדע מתי די\nולא תדע סכנה\nכך ללא דאגות\nנעים\nלהאריך ימים\nהחכם יו פו הוסיף כאן הערה:", "המליאות הריקה\nהנמרץ אל האושר\nנראה כעצל\nצח הלשון\nנשמע מגמגם\nהשלימות נראית\nכהעדר שלמות\nהישרות העילאית\nרק נראית עקומה\nאם יש בעולם דבר\nשתשתמש בו\nולא יחסר\nהרי זו\nהמלאות\nהריקה\nטוהר\nושלוות רוח\nקובעים\nאת\nסדר\nהעולם", "המכשולים\nכאשר יש טאו בממלכה\nסוסי המרוץ\nנשלחים לזיבול השדות\nכאשר אין הטאו מושל\nלוקחים את הסוסים\nלרעות בגבולות\nאין אסון גדול\nמחוסר שקט פנימי", "אין טפשות גדולה יותר\nמהליכה עיוורת אחר התשוקות\nאין אומללות גדולה\nמהעדרה של מידת ההסתפקות\nאין מכשול גדול יותר\nמאשר החמדנות\nהיודע\nמתי די\nתמיד\nיש לו די\nדעת עולם\nמבלי לצאת מפתח ביתו\nיודע החכם עולם ומלואו", "הממעיט\nהעוסק בלימוד\nמוסיף ידיעה מיום ליום\nהעוסק בטאו\nממעיט עשייה מיום ליום\nממעיט וחוזר וממעיט\nעד שהוא מגיע אל אי-העשיה\nוהעשיה אז זורמת דרכו\nכך\nבאי-עשיה\nאין דבר שאינו נעשה\nבלא מאמץ\nאפשר לכבוש עולם\nמי\nשמתאמץ\nלא יוכל\nלאורך\nזמן\nלהחזיק", "לב ישר\nאני\nאין לי לב שהוא מיוחד ורק שלי\nלב העם הוא לבי\nעם טובים איטיב\nוגם עם רעים איטיב\nעם ישרים אישיר\nואף עם לא ישרים אישיר\nבמאמינים אאמין\nבלא מאמינים\nגם להם אני מאמין\nכי כך עושים\nאנשים ישרים\nהחכם\nחי\nבעולם פשוט\nהוא עוזר\nאינו חושד\nרואה את עצמו\nכתינוק\nואת כולם\nכילדיו", "המוות\nכל הבאים בשער העולם\nמתחילים את דרכם אל המוות\nשליש מתים ממחלות\nואין ברירה\nשליש נוסף מתים\nבגלל שהתאמצו להיות בריאים\nיתר על המידה\nאלה שלא עושים מאמץ מיוחד\nיאריכו יותר ימים\nמאלה החפצים\nבחיים נצחיים\nאם רק רגוע תהיה\nלא יפגע בך הנמר\nלא יתקוף הקרנף\nאפשר להבקיע מחנה צבא\nללא שריון או מלחמה\nהיה שלם\nואין מקום\nלקרן הקרנף\nולא לנמר\nלנעוץ ציפורניו\nמי שלא מתעסק\nעם המוות\nהמוות\nלא מתעסק איתו", "ילדים\nהטאו הוא זה שמוליד אותם\nהוא גם יפרנס ויזין אותם\nמהותו\nמעצבת אותם\nכוחו\nמשלים את שלהם\nכל אחד וצורתו\nכל אחד ושלמותו\nהטאו מקיים אותם\nהטאו מגדל אותם\nהטאו משלים אותם\nהטאו מטפח אותם\nהטאו מגונן עליהם\nהטאו לעולם לא ינטוש אותם\nהטאו ינהל אותם\nאבל לעולם לא ישלוט עליהם\nזו היא הסגולה\nמוליד ולא רוכש\nעושה ולא מתגאה\nמנהל ולא משתלט\nהטאו\nמעולם\nלא שכח\nדבר", "אם העולם\nהעולם יש לו אימא\nאקרא לה\nאם כל חי\nהשג את האם\nובאמצעותה תדע את הבנים\nדע את בניה\nאך חזור ושמור על האם\nאם כזאת תעשה\nלעולם לא תאבד\nהכבר מעשים\nולא תנצל\nסגור שערים\nולא תדע אכזבה\nהכנס\nאל\nהטאו\nהעם\nזוהרך\nולך\nעם\nהאור", "שניים מעקרונות היסוד של הפילוסופיה הסינית אומרים:\nישר\nלו הייתה לי בינה\nולו גם מועטה\nכל חיי הייתי הולך\nבדרך הראשית\nהיא גדולה\nישרה\nרחבה\nומישורית\nהחכם חושש משבילים עקיפים\nאבל דרכים צדדיות\nושבילים צרים ונפתלים\nעדיפים משום מה על ההמונים\nכשהארמון מפואר\nאבל שדות העם יבשים\nכשהעשירים לובשים יקר\nוזוללים מטעמים\nבזמן שהעם רעב\nוחי בין קוצים\nשלא יתפלאו העשירים\nאם יש גנבים ושודדים\nגם זה\nבמסגרת הטאו\nנכסים\nמיותרים\nמשכיחים\nאת החיוני", "לדורי דורות\nהמושרש היטב לא יחמוק\nהשתול עמוק לא יעקר\nהילדים נושאים בחובם\nאת אשר קיבלו מההורים\nמזג ההורים עובר הלאה\nקארמה לדורי דורות\nלכן\nהמטפח טאו בתוך עצמו\nחסדו אמת\nהמכניס טאו למשפחתו\nגבורתו שופעת\nהמלמד טאו בכפרו\nגבורתו מתרבה\nהמטפח טאו בתוך מדינתו\nגבורתו משגשגת\nהמפיץ טאו בתבל\nגבורתו חסד עולם\nחקור את גופך\nולמד מה זה גוף\nחקור עצמך\nודע זולתך\nחקור משפחתך\nולמד מה זו משפחה\nלמד כפר\nותדע מה זו מדינה\nאם תרצה להבין עם שלם\nלמד להכיר את היחיד\nלמד ארץ אחת\nותדע את כל העולם", "שב\nבשקט\nותדע\nמהו\nטאו\nכתב עמוס עוז:\nהסירו דאגה\nתינוק הוא מבורך\nבהשגחה העליונה\nולא יקרה לו כל רע\nלא יעקוץ אותו עקרב\nלא צרעה ולא אפעה\nלא יפחד מחיות פרא\nולא מעופות טרף דורסים\nהתינוק\nעצמותיו חלשות וגידיו רכים\nאך אחיזתו בחיים איתנה\nונטולת חרדה\nשרביטו הקטון ניעור\nעוד בטרם ידע בין נקבה וזכר\nהוא מסוגל כל היום לצרוח\nגרונו חזק ואינו נצרד\nיש בו און\nהוא יודע להתמיד\nוהוא מתואם עם העולם", "דע\nאת הקבוע\nואל\nתדאג\nיתר\nעל\nהמידה\nחלק מטכניקות המדיטציה של מנזרי הזן מלמדות סוג מסויים של התמקדות בנשימות\nובמקביל ,הקשבה אל הנעשה בסביבה.\nבדידות החכמים\nזה שמדבר לא יודע\nזה שיודע לא מדבר\nהוא חוסם פתחיו\nסוגר דלתותיו\nמקהה חודו\nמרכך זוהרו\nשומר על מסתורין\nמתאחד עם אבקו\nבלתי ניתן לקרבה\nאבל לא ניתן לריחוק\nאף אחד\nלא יאמר לו מה לעשות\nאבל גם אין ממנו נזק\nאין הוא מבקש כבוד\nוללא מאמץ\nהוא מוקף בו\nבעיני\nכזה הוא\nאיש טאו", "המלצות למעצבי אומה\nביושר משול במדינה\nבערמה עשה לך מלחמה\nבישוב דעת זכה במנוחה\nככל שירבו האיסורים וההגבלות\nכן ירבה עוניו של העם\nככל שירבו חוקים ותקנות\nכן ירבו שודדי המשפט\nומומחי החוק\nככל שירבו כלי הנשק\nכן תרבה האלימות\nככל שירבו המפעלים\nכך יהיו יותר דברים\nשלא צריכים\nלכן אמר החכם\nנוקט אני באפס מעשה\nוהדברים מסתדרים על הדרך\nלא מתערב\nוהשינוי נעשה מעצמו\nכאשר אני ישר עם עצמי\nגם האחרים\nשומרים איתי על יושר\nגם אם אני בטלן\nולא עושה הרבה\nהברכה תמיד איתי\nועם אלה שסביבי", "בריא\nממחלת\nהקינאה\nהייתי\nרוצה\nשוב\nלהגיד\nשאין\nברכה\nכמו\nהפשטות\nאושר ועצב\nהאושר\nעל גבי העצב נישא\nהצער\nתחת כנפי האושר שוכן\nהמזל הטוב סמוך אל הרע\nבמזל הרע אורב הטוב\nמי ידע גבולם\nלכן החכם תמיד זהיר\nאנשים טועים כל הזמן\nחיים שלמים\nימים ארוכים\nשל טעויות\nישר\nולא פוגע\nצודק\nולא מעליב\nמאיר\nאבל לא\nמסנוור בעין\nגדולה של ממש היא להיות צודק ולא לצעוק.", "מתינות\nעם בני אדם\nכמו בעבודת האדמה\nאין טוב\nממתינות\nבמתינות\nהכל קורה ב const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

const getAudio = () => { if(!audioCtx) audioCtx = new AudioCtx(); return audioCtx; };

const playTone = (freq, dur, type='sine', vol=0.3) => {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = type;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
};

const playZenBell = () => { playTone(528,2.5); setTimeout(()=>playTone(396,1.5),400); };
const playTibetanBowl = () => { playTone(256,3); setTimeout(()=>playTone(384,2),250); setTimeout(()=>playTone(512,1.5),600); };
const playTaskComplete = () => { playTone(440,0.3); setTimeout(()=>playTone(554,0.3),150); setTimeout(()=>playTone(659,1),300); };
const playTaskAdd = () => playTone(396,0.5,'triangle',0.2);

// Water sound (gentle stream)
const playWater = () => {
  try {
    const ctx = getAudio();
    const bufferSize = ctx.sampleRate * 0.8;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    // Pink noise filtered to sound like water
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0; i<bufferSize; i++) {
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.08;
      b6=w*0.115926;
    }
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=800; filter.Q.value=0.5;
    src.buffer=buffer;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
    src.start(); src.stop(ctx.currentTime+0.8);
  } catch(e) {}
};

function startMeditation(idx) {
  const med = MEDITATIONS[idx];
  medTotal = med.duration * 60;
  medSeconds = medTotal;

  // Stop any existing timer first
  if(medInterval) { clearInterval(medInterval); medInterval = null; }

  playTibetanBowl();

  const stepsHtml = med.steps.map(function(s, i) {
    return '<div style="font-size:12px;color:#7a9a72;padding:4px 0;border-bottom:' +
      (i < med.steps.length - 1 ? '1px solid #1a2e1c' : 'none') + '">' + s + '</div>';
  }).join('');

  const mins = med.duration.toString();
  const modal = document.getElementById('modal-container');
  modal.innerHTML =
    '<div class="modal-overlay">' +
    '<div class="modal" style="text-align:center">' +
    '<div style="font-size:13px;color:#c4922a;font-weight:600;margin-bottom:4px">' + med.icon + ' ' + med.title + '</div>' +
    '<div style="font-size:12px;color:#7a9a72;margin-bottom:20px">' + med.desc + '</div>' +
    '<div class="med-circle" id="med-circle">' +
    '<canvas id="med-canvas" width="180" height="180" style="position:absolute;inset:0;border-radius:50%"></canvas>' +
    '<div class="med-timer" id="med-timer">' + mins + ':00</div>' +
    '</div>' +
    '<div class="breath-text" id="breath-text">היכון...</div>' +
    '<div style="margin:20px 0;padding:14px;background:#080f0a;border-radius:12px;text-align:right">' +
    stepsHtml +
    '</div>' +
    '<button onclick="stopMeditation(false)" style="width:100%;padding:14px;border-radius:12px;border:1px solid #1a2e1c;background:transparent;color:#7a9a72;font-size:14px">סיים מוקדם</button>' +
    '</div></div>';

  drawMedCircle(1);

  var pattern = ['שאיפה...', 'עצירה...', 'נשיפה...', 'השהייה...'];
  var breathTimes = [4, 4, 6, 2];
  var breathIdx = 0;
  var breathTimer = 0;

  setTimeout(function() {
    var b = document.getElementById('breath-text');
    if (b) b.textContent = pattern[0];
  }, 1500);

  medInterval = setInterval(function() {
    medSeconds--;
    var m = Math.floor(medSeconds / 60);
    var s = medSeconds % 60;
    var timer = document.getElementById('med-timer');
    if (timer) timer.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    drawMedCircle(medSeconds / medTotal);
    breathTimer++;
    if (breathTimer >= breathTimes[breathIdx]) {
      breathTimer = 0;
      breathIdx = (breathIdx + 1) % 4;
      var b = document.getElementById('breath-text');
      if (b) b.textContent = pattern[breathIdx];
    }
    if (medSeconds <= 0) stopMeditation(true);
  }, 1000);
}


function drawMedCircle(ratio) {
  const canvas = document.getElementById('med-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=180, cx=W/2, cy=W/2, r=W/2-4;
  ctx.clearRect(0,0,W,W);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(196,146,42,0.15)'; ctx.lineWidth=3; ctx.stroke();
  if(ratio>0) {
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(1-ratio)*Math.PI*2);
    ctx.strokeStyle='#4a7c3f'; ctx.lineWidth=3; ctx.stroke();
  }
}

function stopMeditation(completed) {
  if(medInterval) { clearInterval(medInterval); medInterval = null; }
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  stopAmbientMusic();
  document.getElementById('modal-container').innerHTML = '';
  if(completed) { playTibetanBowl(); showRipple(); }
}

async function doAnalyze() {

  btn.textContent = '⚙️ מסדר...'

  err.style.display = 'none'
  try {
    const parsed = await callClaude([{role:'user',content:text}], SYSTEM_PROMPT)
    const p = JSON.parse(parsed.replace(/```json|```/g,'').trim())
    const s = Date.now()
    const tag = (arr,pfx) => (arr||[]).map((t,i)=>({...t,id:`${pfx}${s}${i}`,done:false}))

      tasks:{now:[...state.tasks.now,...tag(p.now,'n')],today:[...state.tasks.today,...tag(p.today,'d')],later:[...state.tasks.later,...tag(p.later,'l')]},
      sites: mergeSites(state.sites, p.sites||[]),
      people: mergePeople(state.people, p.people||[]),
      focus: p.focus || state.focus

  } catch(e) {

}

const SYSTEM_PROMPT = `You are a field operations assistant for Uri, a Regional Manager at Innovative Agro Industry Philippines (Region II). Uri has ADHD. Engineers: Gio and Kenneth. Contractors: ASC Construction (engineer: Dave) and 11-16 Construction.
Uri sends notes in Hebrew/English/Tagalog mix. Return ONLY valid JSON (no markdown):
{"now":[{"id":"n1","text":"short task max 8 words","site":null,"assignee":"uri/gio/kenneth/asc/11-16 or null","color":"red/orange/green"}],"today":[...],"later":[...],"sites":[{"name":"site","province":"","issue":"","contractor":"asc/11-16 or null","status":"open/pending/resolved"}],"people":[{"name":"","role":"contractor/engineer/nia/other","company":"","pending":""}],"events":[{"title":"event title","date":"YYYY-MM-DD","time":"HH:MM or empty","note":"","recurring":"daily/weekly/monthly/yearly or empty","color":"var(--bamboo)"}],"focus":"ONE Hebrew sentence"}
Rules:
- now MAX 3 tasks. color: red=critical, orange=important, green=routine.
- Parse ALL date/time references into events: meetings, deadlines, follow-ups, site visits.
- Date parsing: "next week"=+7 days, "in 3 weeks"=+21 days, "tomorrow"=+1 day, "next month"=+30 days. Today is ${new Date().toISOString().slice(0,10)}.
- If a task has a specific date/time, put it in events AND tasks.
- recurring: use "weekly" for weekly meetings, "monthly" for monthly reports, etc.`

async function callClaude(messages, system=null) {
  const body = {model:'claude-sonnet-4-6',max_tokens:1500,messages}
  if(system) body.system = system
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)
  })
  const d = await r.json()
  if(d.error) throw new Error(d.error.message)
  return d.content?.find(b=>b.type==='text')?.text || ''
}

}

}


// ═══ CALENDAR ═══
let calView='month',calDate=new Date(),calSelectedDate=new Date();
const DAYS_HE=['א','ב','ג','ד','ה','ו','ש'];
const DAYS_FULL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const RECUR_HE={daily:'יומי',weekly:'שבועי',monthly:'חודשי',yearly:'שנתי'};

function getEvents(){return state.events||[];}
function dateKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayKey(){return dateKey(new Date());}

function getEventsForDate(dk){
  const [y,m,day]=dk.split('-').map(Number);
  const dow=new Date(y,m-1,day).getDay();
  return getEvents().filter(e=>{
    if(e.date===dk)return true;
    if(!e.recurring)return false;
    const ed=new Date(e.date);
    if(e.recurring==='daily')return true;
    if(e.recurring==='weekly')return ed.getDay()===dow;
    if(e.recurring==='monthly')return ed.getDate()===day;
    if(e.recurring==='yearly')return ed.getMonth()===m-1&&ed.getDate()===day;
    return false;
  });
}

function renderCalendar(){
  const el=document.getElementById('screen-calendar');
  const monthLabel=MONTHS_HE[calDate.getMonth()]+' '+calDate.getFullYear();
  let body='';
  if(calView==='month')body=renderMonthCal();
  else if(calView==='week')body=renderWeekCal();
  else body=renderYearCal();

  el.innerHTML=
    '<div class="cal-header">'+
    '<div class="cal-nav-row">'+
    '<button class="cal-nav-btn" id="cal-prev">‹</button>'+
    '<div class="cal-month-title">'+monthLabel+'</div>'+
    '<button class="cal-nav-btn" id="cal-next">›</button>'+
    '</div>'+
    '<div class="cal-view-tabs">'+
    '<button class="cal-view-tab '+(calView==='week'?'active':'')+'" id="cvw">שבוע</button>'+
    '<button class="cal-view-tab '+(calView==='month'?'active':'')+'" id="cvm">חודש</button>'+
    '<button class="cal-view-tab '+(calView==='year'?'active':'')+'" id="cvy">שנה</button>'+
    '</div></div>'+
    '<div>'+body+'</div>'+
    '<div style="padding:14px 18px">'+
    '<button class="btn-primary" id="cal-add-btn">+ אירוע חדש</button>'+
    '</div>';

  // Bind buttons
  document.getElementById('cal-prev').onclick=calNavPrev;
  document.getElementById('cal-next').onclick=calNavNext;
  document.getElementById('cvw').onclick=function(){setCalView('week');};
  document.getElementById('cvm').onclick=function(){setCalView('month');};
  document.getElementById('cvy').onclick=function(){setCalView('year');};
  document.getElementById('cal-add-btn').onclick=function(){showAddEvent();};

  // Bind day cells
  el.querySelectorAll('.cal-day').forEach(function(d){
    d.addEventListener('click',function(){showDayEvents(d.dataset.date);});
  });
  el.querySelectorAll('.week-row').forEach(function(r){

function renderMonthCal(){
  var y=calDate.getFullYear(),m=calDate.getMonth();
  var first=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var prev=new Date(y,m,0).getDate();
  var tk=todayKey();
  var days='';
  // prev month
  for(var i=first-1;i>=0;i--){
    var d=prev-i,dk=(y)+'-'+(m)+'-'+d;
    days+='<div class="cal-day other-month" data-date="'+dk+'"><span class="cal-dn">'+d+'</span></div>';
  }
  // current month
  for(var d=1;d<=dim;d++){
    var dk=y+'-'+(m+1)+'-'+d;
    var evs=getEventsForDate(dk);
    var cls=dk===tk?' today':'';
    days+='<div class="cal-day'+cls+'" data-date="'+dk+'">'+
      '<span class="cal-dn">'+d+'</span>'+
      (evs.length?'<div class="cal-dots">'+evs.slice(0,3).map(function(e){return '<div class="cal-dot" style="background:'+(e.color||'var(--bamboo)')+'"></div>';}).join('')+'</div>':'')+
      '</div>';
  }
  // next month fill
  var total=first+dim,next=total%7===0?0:7-(total%7);
  for(var d=1;d<=next;d++){
    var dk=y+'-'+(m+2)+'-'+d;
    days+='<div class="cal-day other-month" data-date="'+dk+'"><span class="cal-dn">'+d+'</span></div>';
  }
  var tk=todayKey();
  var todayEvs=getEventsForDate(tk);
  return '<div class="cal-weekdays">'+DAYS_HE.map(function(d){return '<div class="cal-weekday">'+d+'</div>';}).join('')+'</div>'+
    '<div class="cal-grid">'+days+'</div>'+
    '<div style="padding:10px 18px 0">'+
    (todayEvs.length?
      '<div class="ink-divider"><span class="ink-divider-text">📅 היום</span></div>'+todayEvs.map(renderEvCard).join(''):
      '<div class="empty" style="padding:20px 0"><div class="empty-icon" style="font-size:28px">🌿</div><div class="empty-text">אין אירועים היום</div></div>')+
    '</div>';
}

function renderWeekCal(){
  var sw=new Date(calDate);sw.setDate(calDate.getDate()-calDate.getDay());
  var tk=todayKey();var html='';
  for(var i=0;i<7;i++){
    var d=new Date(sw);d.setDate(sw.getDate()+i);
    var dk=dateKey(d);
    var evs=getEventsForDate(dk);
    var isT=dk===tk;
    html+='<div class="week-row" data-date="'+dk+'">'+
      '<div class="week-dlabel"><div class="week-dname">'+DAYS_FULL[d.getDay()].slice(0,2)+'\'</div>'+
      '<div class="week-dnum'+(isT?' today':'')+'">'+(d.getDate())+'</div></div>'+
      '<div style="flex:1">'+
      (evs.length?evs.map(function(e){return '<div class="week-epill">'+(e.time?e.time+' · ':'')+e.title+'</div>';}).join(''):
       (isT?'<div style="font-size:12px;color:var(--t4);padding:4px 0">יום פנוי</div>':''))+
      '</div></div>';
  }
  return html;
}

function renderYearCal(){
  var y=calDate.getFullYear();
  var html='<div style="padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  for(var m=0;m<12;m++){
    var first=new Date(y,m,1).getDay();
    var dim=new Date(y,m+1,0).getDate();
    var tk=todayKey();
    var mini='';
    for(var i=0;i<first;i++)mini+='<div></div>';
    for(var d=1;d<=dim;d++){
      var dk=y+'-'+(m+1)+'-'+d;
      var evs=getEventsForDate(dk);
      var isT=dk===tk;
      mini+='<div style="font-size:9px;text-align:center;color:'+(isT?'var(--sprout)':'var(--t4)')+'('+(evs.length?'background:rgba(61,122,53,.2);border-radius:3px;':'')+';cursor:pointer" data-gdate="'+dk+'">'+d+'</div>';
    }
    var mm=m,yy=y;
    html+='<div style="background:var(--glass2);border:1px solid var(--border);border-radius:10px;padding:8px" data-ym="'+y+'-'+m+'">'+
      '<div style="font-size:10px;font-weight:700;color:var(--t2);margin-bottom:4px;text-align:center">'+MONTHS_HE[m]+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px">'+mini+'</div></div>';
  }
  html+='</div>';
  return html;
}

function setCalView(v){calView=v;renderCalendar();}
function calNavPrev(){
  if(calView==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);
  else if(calView==='week'){calDate=new Date(calDate);calDate.setDate(calDate.getDate()-7);}
  else calDate=new Date(calDate.getFullYear()-1,0,1);
  renderCalendar();
}
function calNavNext(){
  if(calView==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);
  else if(calView==='week'){calDate=new Date(calDate);calDate.setDate(calDate.getDate()+7);}
  else calDate=new Date(calDate.getFullYear()+1,0,1);
  renderCalendar();
}

function doAddEvent(){
  var title=document.getElementById('ev-title').value.trim();
  var date=document.getElementById('ev-date').value;
  if(!title||!date)return;
  var ev={
    id:'ev'+Date.now(),
    title:title,
    date:date,
    time:document.getElementById('ev-time').value,
    note:document.getElementById('ev-note').value,
    recurring:document.getElementById('ev-recurring').value,
    color:'var(--bamboo)',
    notify:document.getElementById('ev-notify').value
  };
  setState({events:[...getEvents(),ev]});
  if(ev.notify!=='')scheduleNotification(ev);
  closeModal();
  renderCalendar();
}

function deleteEvent(id){
  setState({events:getEvents().filter(function(e){return e.id!==id;})});
  closeModal();
  renderCalendar();
}

// ── NOTIFICATIONS ──────────────────────────────────────────────
function requestNotificationPermission(){
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}

function scheduleNotification(ev){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!ev.notify&&ev.notify!==0)return;
  var parts=ev.date.split('-').map(Number);
  var tp=ev.time?ev.time.split(':').map(Number):[9,0];
  var evTime=new Date(parts[0],parts[1]-1,parts[2],tp[0],tp[1]);
  var notTime=new Date(evTime.getTime()-parseInt(ev.notify)*60*1000);
  var delay=notTime.getTime()-Date.now();
  if(delay>0&&delay<7*24*60*60*1000){
    setTimeout(function(){
      if(Notification.permission==='granted'){
        new Notification('Fieldy 📅 '+ev.title,{
          body:ev.notify==='0'?'עכשיו':'בעוד '+ev.notify+' דקות',
          icon:'/Fieldy/icon-192-1.png',tag:ev.id
        });
        playZenBell();
      }
    },delay);
  }
}

function scheduleAllNotifications(){
  getEvents().forEach(function(ev){if(ev.notify)scheduleNotification(ev);});
}

// ── AMBIENT MEDITATION MUSIC ──────────────────────────────────
var ambientNodes = [];
var ambientGain = null;
var musicMuted = false;

function startAmbientMusic() {
  stopAmbientMusic();
  try {
    var ctx = getAudio();
    ambientGain = ctx.createGain();
    ambientGain.gain.setValueAtTime(0, ctx.currentTime);
    ambientGain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 3);
    ambientGain.connect(ctx.destination);

    // Drone frequencies - calm and meditative
    var freqs = [110, 164.8, 220, 329.6];
    freqs.forEach(function(freq) {
      var osc = ctx.createOscillator();
      var oscGain = ctx.createGain();
      var filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.value = freq;
      // Very slow vibrato
      var lfo = ctx.createOscillator();
      var lfoGain = ctx.createGain();
      lfo.frequency.value = 0.08 + Math.random() * 0.05;
      lfoGain.gain.value = 0.3;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start();

      filter.type = 'lowpass';
      filter.frequency.value = 800;
      filter.Q.value = 0.5;

      oscGain.gain.value = freq > 200 ? 0.4 : 0.7;
      osc.connect(filter);
      filter.connect(oscGain);
      oscGain.connect(ambientGain);
      osc.start();

      ambientNodes.push(osc);
      ambientNodes.push(lfo);
    });

    // Add gentle noise layer (like distant wind)
    var bufSize = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    var data = buf.getChannelData(0);
    var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0;
    for(var i=0;i<bufSize;i++){
      var w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5)*0.05;
    }
    var noise = ctx.createBufferSource();
    var noiseGain = ctx.createGain();
    var noiseFilter = ctx.createBiquadFilter();
    noise.buffer = buf;
    noise.loop = true;
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 400;
    noiseFilter.Q.value = 0.3;
    noiseGain.gain.value = 0.06;
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ambientGain);
    noise.start();
    ambientNodes.push(noise);

  } catch(e) { console.log('Audio error:', e); }
}

function stopAmbientMusic() {
  ambientNodes.forEach(function(n) { try { n.stop(); } catch(e) {} });
  ambientNodes = [];
  if(ambientGain) {
    try { ambientGain.disconnect(); } catch(e) {}
    ambientGain = null;
  }
}

function toggleMusicMute() {
  musicMuted = !musicMuted;
  if(ambientGain) {
    var ctx = getAudio();
    ambientGain.gain.linearRampToValueAtTime(
      musicMuted ? 0 : 0.12,
      ctx.currentTime + 0.5
    );
  }
  var btn = document.getElementById('music-toggle-btn');
  if(btn) {
    btn.textContent = musicMuted ? '🔇 מוסיקה' : '🎵 מוסיקה';
    btn.style.color = musicMuted ? 'var(--t4)' : 'var(--sprout)';
  }
}

function toggleVoiceMute() {
  var btn = document.getElementById('voice-toggle-btn');
  if(window.speechSynthesis.speaking || window._voiceEnabled !== false) {
    window._voiceEnabled = false;
    window.speechSynthesis.cancel();
    if(btn) { btn.textContent = '🔇 הדרכה'; btn.style.color = 'var(--t4)'; }
  } else {
    window._voiceEnabled = true;
    if(btn) { btn.textContent = '🎤 הדרכה'; btn.style.color = 'var(--sprout)'; }
  }
}

function speakText(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  var utt=new SpeechSynthesisUtterance(text);
  var voices=window.speechSynthesis.getVoices();
  var v=voices.find(function(v){return v.lang.startsWith('he');})||
        voices.find(function(v){return v.lang.startsWith('en')&&v.name.toLowerCase().includes('female');})||
        voices[0];
  if(v)utt.voice=v;
  utt.rate=0.75;utt.pitch=0.9;utt.volume=0.85;
  window.speechSynthesis.speak(utt);
}

function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}

function startMeditationWithVoice(idx){
  window._voiceEnabled = true;
  musicMuted = false;
  startMeditation(idx);
  startAmbientMusic();

  var scripts = MED_SCRIPTS[idx] || MED_SCRIPTS[0];
  var si = 0;

  // Add music/voice toggle buttons to modal
  setTimeout(function() {
    var modal = document.querySelector('.modal');
    if(!modal) return;
    var controls = document.createElement('div');
    controls.style.cssText = 'display:flex;gap:8px;margin-top:12px;margin-bottom:-4px';
    controls.innerHTML =
      '<button id="music-toggle-btn" onclick="toggleMusicMute()" style="flex:1;padding:10px;border-radius:10px;background:rgba(13,23,16,0.8);border:1px solid var(--border2);color:var(--sprout);font-size:13px;cursor:pointer">🎵 מוסיקה</button>' +
      '<button id="voice-toggle-btn" onclick="toggleVoiceMute()" style="flex:1;padding:10px;border-radius:10px;background:rgba(13,23,16,0.8);border:1px solid var(--border2);color:var(--sprout);font-size:13px;cursor:pointer">🎤 הדרכה</button>';
    modal.appendChild(controls);
  }, 300);

  function speakPhrase() {
    if(si >= scripts.length || !medInterval) return;
    if(window._voiceEnabled === false) {
      setTimeout(function() { if(medInterval) speakPhrase(); }, 15000);
      return;
    }
    var text = scripts[si]; si++;

    window.speechSynthesis.cancel();
    var utt = new SpeechSynthesisUtterance(text);
    var voices = window.speechSynthesis.getVoices();

    // Prefer calm English male voice
    var voice =
      voices.find(function(v){ return v.lang && v.lang.startsWith('en') && /daniel|david|alex|oliver|mark|james|arthur|aaron/i.test(v.name); }) ||
      voices.find(function(v){ return v.lang && v.lang.startsWith('en') && !/female|woman|samantha|karen|moira|tessa|victoria|allison|zoe/i.test(v.name); }) ||
      voices.find(function(v){ return v.lang && v.lang.startsWith('en'); }) ||
      (voices.length ? voices[0] : null);

    if(voice) utt.voice = voice;
    utt.rate = 0.7;
    utt.pitch = 0.85;
    utt.volume = 0.9;

    utt.onend = function() {
      setTimeout(function() { if(medInterval) speakPhrase(); }, 13000);
    };
    utt.onerror = function() {
      setTimeout(function() { if(medInterval) speakPhrase(); }, 13000);
    };

    window.speechSynthesis.speak(utt);
  }

  var voices = window.speechSynthesis.getVoices();
  if(!voices.length) {
    window.speechSynthesis.onvoiceschanged = function() {
      setTimeout(speakPhrase, 2000);
    };
  } else {
    setTimeout(speakPhrase, 2000);
  }
}


function stopVoice(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}


// ── INIT ─────────────────────────────────────────
refreshBadges()
renderHome()
requestNotificationPermission()
scheduleAllNotifications()
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/Fieldy/sw.js')
}
</script>
