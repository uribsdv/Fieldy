<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fieldy"/>
<link rel="manifest" href="/Fieldy/manifest.json"/>
<title>Fieldy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#f1f5f9;direction:rtl;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
textarea,select,input{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.hidden{display:none!important}
/* Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#0f172a;border-top:1px solid #1e293b;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 24px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;background:none;border:none;position:relative}
.nav-icon{font-size:22px}
.nav-label{font-size:10px;color:#475569;font-weight:400}
.nav-btn.active .nav-label{color:#3b82f6;font-weight:700}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:#ef4444;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
/* Cards */
.card{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:8px}
.card-red{border:1.5px solid #ef444460;background:#ef444418}
.card-orange{border:1.5px solid #f59e0b60;background:#f59e0b18}
.card-green{border:1.5px solid #4ade8060;background:#4ade8018}
/* Buttons */
.btn-primary{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;font-size:15px;font-weight:700;display:block;border:none;cursor:pointer}
.btn-secondary{padding:14px 18px;border-radius:12px;border:1px solid #334155;background:transparent;color:#64748b;font-size:14px;cursor:pointer}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:#000d;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#1e293b;width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:22px 16px 40px;max-height:85vh;overflow-y:auto}
/* Form */
.form-label{font-size:11px;color:#64748b;margin-bottom:4px;display:block}
.form-input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:11px 12px;color:#f1f5f9;font-size:14px;outline:none;display:block;margin-bottom:10px;direction:rtl}
.form-select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 8px;color:#f1f5f9;font-size:13px;outline:none}
/* Tags */
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#0f172a;color:#64748b}
.tag-red{background:#ef444422;color:#ef4444;font-weight:600}
.tag-orange{background:#f59e0b22;color:#f59e0b;font-weight:600}
.tag-green{background:#4ade8022;color:#4ade80;font-weight:600}
.tag-status-open{background:#ef444422;color:#ef4444;font-weight:600}
.tag-status-pending{background:#f59e0b22;color:#f59e0b;font-weight:600}
.tag-status-resolved{background:#4ade8022;color:#4ade80;font-weight:600}
/* Checkbox */
.cb{width:26px;height:26px;border-radius:8px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all 0.15s;border:2px solid}
/* Progress */
.progress-bar{background:#1e293b;border-radius:99px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.4s;background:linear-gradient(90deg,#3b82f6,#06b6d4)}
/* Screens header */
.screen-header{padding:48px 16px 12px;background:linear-gradient(180deg,#1e293b,#0f172a);position:sticky;top:0;z-index:10}
/* Empty state */
.empty{text-align:center;padding:60px 0;color:#334155}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-text{font-size:14px}
/* Action result */
.action-result{background:#0f172a;border-radius:14px;padding:16px;font-size:14px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;direction:ltr;text-align:left;max-height:300px;overflow-y:auto}
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen"></div>
  <div id="screen-tasks" class="screen hidden"></div>
  <div id="screen-sites" class="screen hidden"></div>
  <div id="screen-people" class="screen hidden"></div>
  <div id="screen-input" class="screen hidden"></div>
  <div id="screen-action" class="screen hidden"></div>
  <div id="screen-settings" class="screen hidden"></div>
  <nav id="nav">
    <button class="nav-btn active" data-screen="home">
      <span class="nav-icon">☀️</span>
      <span class="nav-label">בית</span>
    </button>
    <button class="nav-btn" data-screen="tasks">
      <span class="nav-icon">⚡</span>
      <span class="nav-label">משימות</span>
      <span class="nav-badge hidden" id="badge-tasks">0</span>
    </button>
    <button class="nav-btn" data-screen="sites">
      <span class="nav-icon">📍</span>
      <span class="nav-label">אתרים</span>
      <span class="nav-badge hidden" id="badge-sites">0</span>
    </button>
    <button class="nav-btn" data-screen="people">
      <span class="nav-icon">👥</span>
      <span class="nav-label">אנשים</span>
      <span class="nav-badge hidden" id="badge-people">0</span>
    </button>
  </nav>
</div>
<div id="modal-container"></div>

<script>
// ── STATE ─────────────────────────────────────────
const KEY = 'fieldy_v2'
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || {tasks:{now:[],today:[],later:[]},sites:[],people:[],focus:'',updated:null}
let apiKey = localStorage.getItem('fieldy_key') || ''
let currentScreen = 'home'
let actionCtx = null

const save = () => { localStorage.setItem(KEY, JSON.stringify(state)) }
const setState = (patch) => { Object.assign(state, patch, {updated: new Date().toISOString()}); save(); refreshBadges(); renderCurrentScreen() }

const ASSIGNEE = {uri:'אני',gio:"ג'יו",kenneth:"קנת'",asc:'ASC','11-16':'11-16'}
const STATUS_COLOR = {open:'red',pending:'orange',resolved:'green'}
const STATUS_LABEL = {open:'פתוח',pending:'ממתין',resolved:'נפתר'}

// ── NAVIGATION ────────────────────────────────────
const NAV_SCREENS = ['home','tasks','sites','people']

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = btn.dataset.screen
    navigateTo(s)
  })
})

function navigateTo(screen, ctx=null) {
  if(ctx) actionCtx = ctx

  // Hide all screens
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'))
  
  // Show target
  document.getElementById('screen-' + screen).classList.remove('hidden')
  
  // Update nav
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'))
  const activeBtn = document.querySelector(`.nav-btn[data-screen="${screen}"]`)
  if(activeBtn) activeBtn.classList.add('active')
  
  // Show/hide nav
  document.getElementById('nav').style.display = NAV_SCREENS.includes(screen) ? 'grid' : 'none'
  
  currentScreen = screen
  renderCurrentScreen()
  
  // Scroll to top
  const el = document.getElementById('screen-' + screen)
  if(el) el.scrollTop = 0
}

function goBack() {
  navigateTo('home')
}

function renderCurrentScreen() {
  switch(currentScreen) {
    case 'home': renderHome(); break
    case 'tasks': renderTasks(); break
    case 'sites': renderSites(); break
    case 'people': renderPeople(); break
    case 'input': renderInput(); break
    case 'action': renderAction(); break
    case 'settings': renderSettings(); break
  }
}

// ── BADGES ───────────────────────────────────────
function refreshBadges() {
  const urgent = state.tasks.now.filter(t=>!t.done).length
  const sites = state.sites.filter(s=>s.status==='open'||s.status==='pending').length
  const people = state.people.filter(p=>p.pending).length

  ;[['tasks',urgent],['sites',sites],['people',people]].forEach(([k,v]) => {
    const b = document.getElementById('badge-'+k)
    if(b) { b.textContent=v; b.classList.toggle('hidden', v===0) }
  })
}

// ── HOME ─────────────────────────────────────────
function renderHome() {
  const el = document.getElementById('screen-home')
  const all = [...state.tasks.now,...state.tasks.today,...state.tasks.later]
  const done = all.filter(t=>t.done).length
  const total = all.length
  const urgent = state.tasks.now.filter(t=>!t.done).slice(0,3)
  const openSites = state.sites.filter(s=>s.status==='open'||s.status==='pending').length
  const pendingPeople = state.people.filter(p=>p.pending).length
  const pct = total ? Math.round((done/total)*100) : 0

  el.innerHTML = `
    <div style="background:linear-gradient(180deg,#1e3a5f,#0f172a);padding:48px 16px 16px;border-bottom:1px solid #1e293b">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-size:12px;color:#64748b;margin-bottom:4px">${new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}</div>
          <div style="font-size:22px;font-weight:800;color:#f8fafc">בוקר טוב, אורי ☀️</div>
          <div style="font-size:11px;color:#475569;margin-top:2px">Region II · Cagayan Valley</div>
        </div>
        <button onclick="navigateTo('settings')" style="background:#1e293b;border-radius:10px;padding:8px 10px;color:#64748b;font-size:16px">⚙️</button>
      </div>
      ${!apiKey ? `<div onclick="navigateTo('settings')" style="padding:10px 14px;background:#f59e0b18;border:1px solid #f59e0b44;border-radius:10px;cursor:pointer;margin-bottom:10px">
        <div style="font-size:13px;color:#f59e0b;font-weight:600">⚠️ נדרש API Key</div>
        <div style="font-size:12px;color:#78716c;margin-top:2px">לחץ להגדרות</div>
      </div>` : ''}
      ${total > 0 ? `<div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#475569;margin-bottom:5px">
          <span>התקדמות היום</span><span style="color:${done===total?'#4ade80':'#64748b'}">${done}/${total}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${done===total?'#4ade80':'linear-gradient(90deg,#3b82f6,#06b6d4)'}"></div></div>
      </div>` : ''}
    </div>
    <div style="padding:14px 16px">
      ${state.focus ? `<div style="background:linear-gradient(135deg,#1e3a5f,#1e293b);border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid #1e40af33">
        <div style="font-size:10px;color:#3b82f6;font-weight:700;letter-spacing:1px;margin-bottom:6px">🎯 הכי חשוב היום</div>
        <div style="font-size:14px;color:#f1f5f9;line-height:1.5;font-weight:600">${state.focus}</div>
      </div>` : ''}
      ${urgent.length > 0 ? `<div style="font-size:11px;color:#64748b;font-weight:700;letter-spacing:0.5px;margin-bottom:8px">⚡ עכשיו</div>
      ${urgent.map(t=>`<div class="card card-red" onclick="navigateTo('tasks')" style="cursor:pointer;margin-bottom:8px">
        <div style="font-size:14px;font-weight:600;color:#f1f5f9">${t.text}</div>
        ${t.site||t.assignee?`<div style="display:flex;gap:8px;margin-top:5px">
          ${t.site?`<span class="tag">📍 ${t.site}</span>`:''}
          ${t.assignee?`<span class="tag">👤 ${ASSIGNEE[t.assignee]||t.assignee}</span>`:''}
        </div>`:''}
      </div>`).join('')}` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="card" onclick="navigateTo('tasks')" style="cursor:pointer;text-align:center;border:1px solid ${urgent.length>0?'#ef444433':'transparent'}">
          <div style="font-size:18px">⚡</div>
          <div style="font-size:22px;font-weight:800;color:${urgent.length>0?'#ef4444':'#475569'}">${urgent.length}</div>
          <div style="font-size:10px;color:#475569;margin-top:2px">עכשיו</div>
        </div>
        <div class="card" onclick="navigateTo('sites')" style="cursor:pointer;text-align:center;border:1px solid ${openSites>0?'#f59e0b33':'transparent'}">
          <div style="font-size:18px">📍</div>
          <div style="font-size:22px;font-weight:800;color:${openSites>0?'#f59e0b':'#475569'}">${openSites}</div>
          <div style="font-size:10px;color:#475569;margin-top:2px">אתרים</div>
        </div>
        <div class="card" onclick="navigateTo('people')" style="cursor:pointer;text-align:center;border:1px solid ${pendingPeople>0?'#06b6d433':'transparent'}">
          <div style="font-size:18px">👥</div>
          <div style="font-size:22px;font-weight:800;color:${pendingPeople>0?'#06b6d4':'#475569'}">${pendingPeople}</div>
          <div style="font-size:10px;color:#475569;margin-top:2px">ממתין</div>
        </div>
      </div>
      <button class="btn-primary" onclick="navigateTo('input')">+ הוסף הודעות מוואטסאפ</button>
      ${total===0&&!state.focus?`<div class="empty" style="margin-top:20px">
        <div class="empty-icon">📋</div>
        <div class="empty-text">הדבק הודעות מוואטסאפ כדי להתחיל</div>
      </div>`:''}
    </div>
  `
}

// ── INPUT ────────────────────────────────────────
function renderInput() {
  const el = document.getElementById('screen-input')
  el.innerHTML = `
    <div style="padding:48px 16px 24px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button onclick="navigateTo('home')" style="background:#1e293b;border-radius:10px;padding:10px 14px;color:#94a3b8;font-size:18px">←</button>
        <div style="font-size:18px;font-weight:700">הוסף הודעות</div>
      </div>
      <div style="font-size:13px;color:#475569;margin-bottom:10px;line-height:1.6">הדבק הודעות מוואטסאפ — בכל שפה.</div>
      <textarea id="input-text" placeholder="Claveria well — Gio to assess&#10;החלפת משאבה בדולרס&#10;Dave needs to sign waiver — Upi 3" style="width:100%;min-height:200px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;color:#f1f5f9;font-size:15px;resize:none;outline:none;line-height:1.7;direction:rtl;display:block;margin-bottom:10px"></textarea>
      <div id="input-error" style="color:#ef4444;font-size:13px;margin-bottom:8px;display:none"></div>
      ${!apiKey?`<div style="color:#f59e0b;font-size:13px;margin-bottom:8px">⚠️ חסר API Key — הגדר בהגדרות</div>`:''}
      <button id="input-btn" class="btn-primary" onclick="doAnalyze()">⚡ ארגן את היום</button>
    </div>
  `
}

async function doAnalyze() {
  const text = document.getElementById('input-text')?.value?.trim()
  const btn = document.getElementById('input-btn')
  const err = document.getElementById('input-error')
  if(!text || !apiKey) return
  btn.textContent = '⚙️ מסדר...'
  btn.style.background = '#1e293b'
  btn.style.color = '#475569'
  err.style.display = 'none'
  try {
    const parsed = await callClaude([{role:'user',content:text}], SYSTEM_PROMPT)
    const p = JSON.parse(parsed.replace(/```json|```/g,'').trim())
    const s = Date.now()
    const tag = (arr,pfx) => (arr||[]).map((t,i)=>({...t,id:`${pfx}${s}${i}`,done:false}))
    setState({
      tasks:{now:[...state.tasks.now,...tag(p.now,'n')],today:[...state.tasks.today,...tag(p.today,'d')],later:[...state.tasks.later,...tag(p.later,'l')]},
      sites: mergeSites(state.sites, p.sites||[]),
      people: mergePeople(state.people, p.people||[]),
      focus: p.focus || state.focus
    })
    navigateTo('home')
  } catch(e) {
    err.textContent = 'שגיאה: ' + e.message
    err.style.display = 'block'
    btn.textContent = '⚡ ארגן את היום'
    btn.style.background = 'linear-gradient(135deg,#3b82f6,#06b6d4)'
    btn.style.color = '#fff'
  }
}

// ── TASKS ────────────────────────────────────────
let taskBucket = 'now'

function renderTasks() {
  const el = document.getElementById('screen-tasks')
  const counts = {now:state.tasks.now.filter(t=>!t.done).length,today:state.tasks.today.filter(t=>!t.done).length,later:state.tasks.later.filter(t=>!t.done).length}
  const tasks = state.tasks[taskBucket] || []
  const BCOLS = {now:'#ef4444',today:'#f59e0b',later:'#64748b'}

  el.innerHTML = `
    <div class="screen-header">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:18px;font-weight:700">משימות</div>
        <button onclick="showAddTask()" style="background:#1e40af;border-radius:10px;padding:8px 14px;color:#fff;font-size:13px;font-weight:600">+ הוסף</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        ${['now','today','later'].map((b,i)=>`
          <button onclick="setTaskBucket('${b}')" style="padding:10px 4px;border-radius:10px;border:1.5px solid ${taskBucket===b?BCOLS[b]:'transparent'};background:${taskBucket===b?BCOLS[b]+'18':'#1e293b'};color:${taskBucket===b?BCOLS[b]:'#64748b'};cursor:pointer">
            <div style="font-size:16px">${['⚡','📅','🕐'][i]}</div>
            <div style="font-size:11px;font-weight:600;margin-top:2px">${['עכשיו','היום','אחר כך'][i]}</div>
            ${counts[b]>0?`<div style="font-size:13px;font-weight:700">${counts[b]}</div>`:''}
          </button>`).join('')}
      </div>
    </div>
    <div style="padding:12px 16px">
      ${tasks.length===0?`<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">ריק — כל הכבוד!</div></div>`:''}
      ${tasks.map(t=>taskCard(t)).join('')}
    </div>
  `
}

function taskCard(t) {
  const colors = {red:['#ef444418','#ef444460','#ef4444'],orange:['#f59e0b18','#f59e0b60','#f59e0b'],green:['#4ade8018','#4ade8060','#4ade80']}
  const c = colors[t.color] || colors.orange
  return `
    <div style="background:${t.done?'#0f172a':c[0]};border:1.5px solid ${t.done?'#1e293b':c[1]};border-radius:14px;padding:14px;margin-bottom:8px;opacity:${t.done?'0.45':'1'};transition:opacity 0.2s">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div onclick="toggleTask('${t.id}')" style="width:26px;height:26px;border-radius:8px;flex-shrink:0;cursor:pointer;background:${t.done?c[2]:'transparent'};border:2px solid ${c[2]};display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff">${t.done?'✓':''}</div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:600;color:#f1f5f9;text-decoration:${t.done?'line-through':'none'};line-height:1.4">${t.text}</div>
          <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
            ${t.site?`<span class="tag">📍 ${t.site}</span>`:''}
            ${t.assignee?`<span class="tag">👤 ${ASSIGNEE[t.assignee]||t.assignee}</span>`:''}
          </div>
        </div>
        ${!t.done?`<button onclick="openAction({text:'${t.text.replace(/'/g,"\\'")}',assignee:'${t.assignee||''}'})" style="background:#0f172a;border-radius:8px;padding:7px 9px;color:#64748b;font-size:16px;flex-shrink:0">✍️</button>`:''}
      </div>
    </div>`
}

function setTaskBucket(b) { taskBucket=b; renderTasks() }

function toggleTask(id) {
  const toggle = arr => arr.map(t=>t.id===id?{...t,done:!t.done}:t)
  setState({tasks:{now:toggle(state.tasks.now),today:toggle(state.tasks.today),later:toggle(state.tasks.later)}})
}

function showAddTask() {
  const modal = document.getElementById('modal-container')
  modal.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px">+ משימה חדשה</div>
        <textarea id="add-task-text" placeholder="מה צריך לעשות?" class="form-input" style="min-height:80px;resize:none"></textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
          <div><label class=
