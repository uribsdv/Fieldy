<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nachal Nav Lab</title>
<style>
/* Fieldy · Nachal · navigation lab (mockup, not part of the app).
   Layout: one phone-sized stage, a teal river room behind glass surfaces, the
   floating nav at the bottom. Two nav variants share one surface and one reward
   system. Everything that moves is transform or opacity on a small element;
   the only backdrop blur on the page is the nav's; two looping animations at
   most (the light sweep on the nav, and in variant B the active icon's float). */
:root{
  --room:#0A4640; --room-deep:#06302C; --teal:#0E8479; --mist:#E2EEE7; --ink:#0B1A12; --ink2:#2C3E35;
  --sage:#4A7760; --sage-deep:#3A6149; --amber:#D4922C; --rose:#C8424A; --river:#3C7FA0; --lotus:#E897B8;
  --glass-a:.72; --glass-rgb:226,238,231;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--room-deep);color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#stage{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;isolation:isolate;background:var(--room)}
@media (min-width:600px){body{display:grid;place-items:center}#stage{height:min(100%,880px);border-radius:34px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}}
/* recording mode (?rec=1): a phone-sized page rendered at 2x, for crisp screen captures */
html.rec{zoom:2}
html.rec body{display:block}
html.rec #stage{height:100%;border-radius:0;box-shadow:none}

/* the room: the river photograph, tinted teal with the colour blend (it keeps its light and shade,
   takes teal's hue), under a green-teal darkening */
#room{position:absolute;inset:0;z-index:-1;
  background-image:
    linear-gradient(180deg,rgba(3,40,38,.52) 0%,rgba(3,36,34,.60) 55%,rgba(2,30,29,.70) 100%),
    radial-gradient(70% 26% at 86% 14%,rgba(72,214,190,.26),rgba(72,214,190,0) 72%),
    radial-gradient(60% 24% at 6% 58%,rgba(54,190,168,.18),rgba(54,190,168,0) 72%),
    linear-gradient(#0E8479,#0E8479),
    var(--photo,none);
  background-blend-mode:normal,normal,normal,color,normal;
  background-size:auto,auto,auto,auto,cover;background-position:0 0,0 0,0 0,0 0,center top;background-repeat:no-repeat;background-color:#0A4640}

/* top strip: which variant, and the demo sheet */
#lab{position:absolute;z-index:50;top:max(10px,env(safe-area-inset-top,0px));inset-inline:16px;display:flex;gap:8px;align-items:center}
#seg{flex:1;display:flex;padding:3px;border-radius:99px;background:rgba(8,46,42,.62);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#seg button{flex:1;min-height:38px;border-radius:99px;font-size:13px;font-weight:600;color:#DCEAE3;padding:0 6px;line-height:1.15}
#seg button[aria-pressed="true"]{background:#CFE6DC;color:#0F2E27}
#gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(8,46,42,.62);border:1px solid rgba(255,255,255,.18);font-size:20px}

/* screens */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:68px 16px 150px;opacity:0;visibility:hidden;transition:opacity .18s}
.screen.on{opacity:1;visibility:visible}
h1{margin:0 0 4px;font-size:27px;font-weight:800;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(4,14,10,.6)}
.sub{margin:0 0 14px;font-size:14px;color:#E1EEE8;text-shadow:0 1px 3px rgba(4,14,10,.6)}
.card{background:rgba(var(--glass-rgb),.78);color:var(--ink);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 26px -18px rgba(0,0,0,.6)}
.card h2{margin:0 0 6px;font-size:17px}
.card p{margin:0;font-size:14px;color:var(--ink2);line-height:1.5}
.row{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid rgba(27,46,36,.1)}
.row:first-of-type{border-top:0}
.row span{flex:1;font-size:16px;color:var(--ink);font-weight:600}
.row small{font-size:12px;color:var(--ink2)}
.tick{width:44px;height:44px;margin-inline-start:-8px;display:grid;place-items:center;flex:none}
.tick i{width:28px;height:28px;border-radius:50%;border:2px solid var(--sage-deep);display:grid;place-items:center;background:rgba(255,255,255,.6);transition:background .15s}
.tick i svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.row.done .tick i{background:var(--sage-deep)}
.row.done .tick i svg{opacity:1}
.row.done span{text-decoration:line-through;color:var(--ink2);font-weight:500}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-height:48px;border-radius:99px;border:1px solid #5E8A72;background:rgba(255,255,255,.7);padding:0 18px;font:inherit;font-size:16px;color:var(--ink)}
.add button{min-width:48px;min-height:48px;border-radius:99px;background:linear-gradient(135deg,#4A7760,#3A6149);color:#fff;font-weight:700;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:99px;background:linear-gradient(135deg,#4A7760,#3A6149);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid rgba(74,119,96,.4)}
.back{display:inline-flex;align-items:center;min-height:44px;gap:6px;font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;text-shadow:0 1px 3px rgba(4,14,10,.6)}

/* ── the nav surface: glass, a thin light line along the edge, a slow sweep of light ── */
#nav{position:absolute;z-index:40;inset-inline:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));height:67px;border-radius:99px;
  display:grid;grid-template-columns:repeat(6,1fr);align-items:center;overflow:hidden;--lvl:0;
  background:linear-gradient(180deg,rgba(236,246,241,calc(var(--glass-a) + .04)),rgba(214,232,224,calc(var(--glass-a) - .04)));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.2),0 18px 34px -14px rgba(0,0,0,.55)}
#nav::after{content:"";position:absolute;inset:0 auto 0 0;width:36%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.4) 50%,rgba(255,255,255,0));
  transform:translateX(-130%) skewX(-14deg);animation:sweep 11s ease-in-out 2.5s infinite}
@keyframes sweep{0%,62%{transform:translateX(-130%) skewX(-14deg)}100%{transform:translateX(340%) skewX(-14deg)}}
.tab{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.ico{position:relative;width:24px;height:24px;display:block;transition:transform .22s cubic-bezier(.34,1.5,.5,1)}
.ico svg{width:24px;height:24px;display:block;overflow:visible}
.lb{font-size:10.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.tab[aria-current="page"] .lb{font-weight:800}
.tab:active .ico{transform:scale(.84)}
.badge{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#A3333D;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.badge[hidden]{display:none}
.badge.pop{animation:pop .24s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* the sliding indicator */
#ind{position:absolute;z-index:1;top:7px;left:0;height:53px;border-radius:99px;pointer-events:none;will-change:transform}
/* variant A: a drop of glass */
.va #ind{border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 30%),
    linear-gradient(170deg,rgba(207,230,220,.95),rgba(150,198,182,.78));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -6px 10px -4px rgba(24,98,84,.35),0 6px 14px -6px rgba(8,60,50,.55),0 0 0 1px rgba(255,255,255,.55)}
/* variant B: a milky, see-through capsule with a line of light */
.vb #ind{border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.2) 62%,rgba(255,255,255,.34));
  box-shadow:inset 0 1px 0 #fff,inset 0 -10px 14px -10px rgba(255,255,255,.5),0 0 0 1px rgba(255,255,255,.46),0 8px 18px -8px rgba(10,70,60,.5)}
.vb #ind::before{content:"";position:absolute;top:3px;inset-inline:16px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0))}
.rip{position:absolute;z-index:1;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(14,132,121,.25);pointer-events:none;animation:rip .62s ease-out forwards}
@keyframes rip{from{transform:scale(.35);opacity:.8}to{transform:scale(2.3);opacity:0}}

/* icons: A = outline, B = filled in river colours; the active one in colour */
.ico .ia,.ico .ib{display:none}
.va .ico .ia{display:block}
.vb .ico .ib{display:block}
.ia *:not(.wave){fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.ia .wave{stroke:none}
.va .tab[aria-current="page"] .ia *:not(.wave){stroke:#0A5A4E}
.va .tab:not([aria-current="page"]) .ico{transform:scale(.92)}
.va .tab[aria-current="page"] .ico{transform:scale(1.06)}
.ib{--c1:#234A41;--c2:#4A6A5F;--c3:#8EA89C}
.ib *{transition:fill .2s,stroke .2s}
.vb .tab[aria-current="page"] .ib{--c1:var(--a1);--c2:var(--a2);--c3:var(--a3)}
.vb .tab[aria-current="page"] .ico{transform:translateY(-3px) scale(1.12);animation:float 3.4s ease-in-out .3s infinite alternate}
@keyframes float{from{transform:translateY(-3px) scale(1.12)}to{transform:translateY(-5.5px) scale(1.12)}}
.ib .f1{fill:var(--c1)}.ib .f2{fill:var(--c2)}.ib .f3{fill:var(--c3)}
.ib .s1{fill:none;stroke:var(--c1);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[data-tab="home"]{--a1:#17715F;--a2:#3E9A82;--a3:#D9902B}
[data-tab="tasks"]{--a1:#14584E;--a2:#3E9A92;--a3:#0F3D36}
[data-tab="sites"]{--a1:#2F6F93;--a2:#6FA6C2;--a3:#EAF5F8}
[data-tab="people"]{--a1:#1F7A5F;--a2:#D9902B;--a3:#5DB59B}
[data-tab="people"] .ib .f1{fill:var(--c1)}
[data-tab="calendar"]{--a1:#17715F;--a2:#D9902B;--a3:#F4FAF7}
[data-tab="tao"]{--a1:#14584E;--a2:#6FCDBB;--a3:#F4FAF7}

/* the tasks icon holds water; the level is today's finished share */
.water{transform:translateY(calc((1 - var(--lvl)) * 19px));transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.wave{fill:#2FA6A0;opacity:.9}
.va .wave{fill:#3DB7AE;opacity:.85}
.vb .wave{fill:#A9E8DF;opacity:1}
.water.run .wave{animation:slosh 1.1s ease-out 1}
@keyframes slosh{from{transform:translateX(-6px)}to{transform:translateX(0)}}
.ico.glow1{animation:glow1 1.1s ease-in-out 1}
@keyframes glow1{0%,100%{filter:none}45%{filter:drop-shadow(0 0 6px rgba(90,214,184,.95))}}
#nav.full .water{transform:translateY(0)}

/* the effects layer: a falling drop, a found item, a stone on its way home */
#fx{position:absolute;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.drop{position:absolute;width:22px;height:32px;margin:-16px 0 0 -11px;will-change:transform}
.drop img{width:100%;height:100%;display:block}
.splash{position:absolute;width:26px;height:10px;margin:-5px 0 0 -13px;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:splash .5s ease-out forwards}
@keyframes splash{from{transform:scale(.3);opacity:.9}to{transform:scale(1.7);opacity:0}}
.rw{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;will-change:transform,opacity}
.rw>*{width:100%;height:100%;display:block;object-fit:contain}
.rw.rare::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(160,255,235,.8),rgba(160,255,235,0) 68%)}
.cap{position:absolute;padding:6px 12px;border-radius:99px;background:rgba(8,46,42,.78);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.22);transform:translate(-50%,0)}
.rw .lt path.p{transform-origin:24px 36px;animation:openp .55s ease-out both}
@keyframes openp{from{transform:scale(.15)}to{transform:scale(1)}}
.rw .wg{transform-origin:28px 26px;animation:flap .14s steps(2,jump-none) infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
.rw .tl{transform-origin:9px 24px;animation:wag .22s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.rw .rg{transform-origin:24px 24px;animation:ringp .7s ease-out infinite}
@keyframes ringp{from{transform:scale(.7);opacity:1}to{transform:scale(1.15);opacity:.35}}

/* the garden */
.cairn{position:relative;height:150px}
.cairn img{position:absolute;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.cairn img.new{animation:settle .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes settle{from{transform:translateY(-70px) rotate(var(--rot,0deg));opacity:0}to{transform:translateY(0) rotate(var(--rot,0deg));opacity:1}}
.pond{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;border:1px solid rgba(255,255,255,.3);
  background:linear-gradient(180deg,rgba(3,40,38,.3),rgba(3,36,34,.55)),radial-gradient(circle at 70% 30%,rgba(120,230,210,.35),rgba(120,230,210,0) 60%),#0C5C54;padding:14px 16px 6px}
.pond .count{font-size:14px;color:#E6F1EB;margin:0 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:rgba(var(--glass-rgb),.78);color:var(--ink);border-radius:20px;padding:12px 10px;text-align:center;border:1px solid rgba(255,255,255,.3)}
.tile .art{height:76px;display:grid;place-items:center}
.tile .art>*{max-height:72px;max-width:84px}
.tile.locked .art>*{filter:brightness(0);opacity:.22}
.tile b{display:block;font-size:15px;margin-top:2px}
.tile small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.tile .n{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;background:rgba(58,97,73,.14);font-size:13px;font-weight:700}
.rar{font-size:11px;font-weight:700;color:#3A2A08}
.preview{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.preview button{min-height:40px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:600}

/* a finger-touch dot, only for recordings (?touch=1) */
.touch{position:absolute;z-index:90;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);pointer-events:none;animation:touch .5s ease-out forwards}
@keyframes touch{from{transform:scale(.5);opacity:1}to{transform:scale(1.25);opacity:0}}
/* demo sheet */
#sheet{position:absolute;z-index:70;inset:0;display:none;background:rgba(2,24,22,.55)}
#sheet.open{display:block}
#sheet .pane{position:absolute;inset-inline:0;bottom:0;max-height:88%;overflow-y:auto;padding:18px 16px max(22px,env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:#E9F3EE;color:var(--ink)}
#sheet h3{margin:14px 0 8px;font-size:15px}
#sheet h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid #9DB8AB;font-size:14px;font-weight:600;color:var(--ink)}
.chips button[aria-pressed="true"]{background:#CFE6DC;border-color:#3A6149}
#sheet ul{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px;line-height:1.65;color:var(--ink2)}
#sheet .stat{font-size:13px;color:var(--ink2);margin:8px 0 0}

/* reduced motion: nothing moves (also when switched on in the demo sheet) */
@media (prefers-reduced-motion:reduce){
  #nav::after{animation:none;opacity:0}
  .ico,.water,.screen,.tick i,.ia *,.ib *{transition:none!important}
  .vb .tab[aria-current="page"] .ico{animation:none}
  .badge.pop,.rip,.splash,.water.run .wave,.ico.glow1,.cairn img.new,.rw .lt path.p,.rw .wg,.rw .tl,.rw .rg{animation:none}
}
html.rm #nav::after{animation:none;opacity:0}
html.rm .ico,html.rm .water,html.rm .screen,html.rm .tick i,html.rm .ia *,html.rm .ib *{transition:none!important}
html.rm .vb .tab[aria-current="page"] .ico{animation:none}
html.rm .badge.pop,html.rm .rip,html.rm .splash,html.rm .water.run .wave,html.rm .ico.glow1,html.rm .cairn img.new,html.rm .rw .lt path.p,html.rm .rw .wg,html.rm .rw .tl,html.rm .rw .rg{animation:none}
/* reduced transparency, or no backdrop-filter: a dense, opaque surface */
@media (prefers-reduced-transparency:reduce){:root{--glass-a:.97}#nav,#seg,#gear{-webkit-backdrop-filter:none;backdrop-filter:none}#nav{background:#DCE9E2}}
html.rt{--glass-a:.97}
html.rt #nav,html.rt #seg,html.rt #gear{-webkit-backdrop-filter:none;backdrop-filter:none}
html.rt #nav{background:#DCE9E2}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass-a:.95}}
</style>
</head>
<body>
<div id="stage" class="va">
  <div id="room"></div>

  <div id="lab">
    <div id="seg" role="group" aria-label="וריאנט ניווט">
      <button id="vA" aria-pressed="true">א׳ · טיפה נוזלית</button>
      <button id="vB" aria-pressed="false">ב׳ · אייקונים עשירים</button>
    </div>
    <button id="gear" aria-label="הדגמות והגדרות" aria-haspopup="dialog">⚙</button>
  </div>

  <section class="screen on" id="s-home" aria-label="בית"></section>
  <section class="screen" id="s-tasks" aria-label="משימות"></section>
  <section class="screen" id="s-sites" aria-label="אתרים"></section>
  <section class="screen" id="s-people" aria-label="אנשים"></section>
  <section class="screen" id="s-calendar" aria-label="לוח"></section>
  <section class="screen" id="s-tao" aria-label="טאו"></section>
  <section class="screen" id="s-garden" aria-label="גן הנחל"></section>

  <nav id="nav" class="" aria-label="ניווט ראשי">
    <span id="ind" aria-hidden="true"></span>
  </nav>

  <div id="fx" aria-hidden="true"></div>

  <div id="sheet" role="dialog" aria-label="הדגמות" aria-modal="true"><div class="pane" id="pane"></div></div>
</div>

<script>
'use strict'
const A = '../assets/'   // asset base (the published copy uses 'assets/')
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)]
const stage = $('#stage'), nav = $('#nav'), ind = $('#ind'), fx = $('#fx'), root = document.documentElement
stage.style.setProperty('--photo', 'url(' + A + 'backgrounds/bg-water-ripple.webp)')
const Z = () => root.classList.contains('rec') ? 2 : 1   // recording mode renders the page zoomed; rectangles come back zoomed
const rm = () => root.classList.contains('rm') || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
const sleep = ms => new Promise(r => setTimeout(r, ms))
const store = {
  get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
}

/* ───────── rules (every number here is a knob) ───────── */
const CONFIG = {
  minAgeMs: 20000,      // a task closed sooner than this after it was created is never rewarded
  dailyCap: 5,          // rewards a day, at most
  pAfterFirst: 0.40,    // the first valid close of the day always rewards; later ones with this chance
  dayMinTasks: 2,       // a day counts as closed when its list is empty and at least this many valid tasks were closed
  weekMinDays: 3        // a week (Sun–Sat) earns a leaf when at least this many of its days were closed
}
const TYPES = {
  pebble:    {name: 'חלוק נחל',    w: 45, rar: 0},
  leaf:      {name: 'עלה',         w: 20, rar: 1},
  lotus:     {name: 'פרח מים',     w: 14, rar: 1},
  dragonfly: {name: 'שפירית',      w: 10, rar: 2},
  fish:      {name: 'דג קטן',      w: 8,  rar: 2},
  ripple:    {name: 'אדווה זוהרת', w: 3,  rar: 3}
}
const RAR = ['נפוץ', 'לא שכיח', 'נדיר', 'נדיר מאוד']
function pickWeighted(rnd) {

function weekRollover() {
  const cur = weekKey(); let any = false
  const wk = {}
  Object.keys(G.days).forEach(k => { if (G.days[k].closed) { const w = weekKey(new Date(k + 'T00:00:00')); wk[w] = (wk[w] || 0) + 1 } })
  Object.keys(wk).forEach(w => { if (w < cur && !(G.weeks[w] && G.weeks[w].leaf) && wk[w] >= CONFIG.weekMinDays) { G.weeks[w] = {leaf: true}; G.leaves++; any = true } })
  if (any) saveG()

}

  const ic = tasksIco(); ic.classList.remove('glow1')
  if (nav.classList.contains('full')) { void ic.offsetWidth; ic.classList.add('glow1'); ic.addEventListener('animationend', () => ic.classList.remove('glow1'), {once: true}) }
  await sleep(180)
}
async function flyItem(el, caption, rare) {
  const from = relc(tasksIco()), home = relc(homeIco())
  el.style.left = from.x + 'px'; el.style.top = from.y + 'px'; fx.appendChild(el)
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = caption; cap.style.fontSize = '15px'
  cap.style.left = Math.max(125, Math.min(from.x, stage.clientWidth / Z() - 125)) + 'px'; cap.style.top = (from.y - 190) + 'px'; fx.appendChild(cap)
  if (rm()) { await sleep(1900); el.remove(); cap.remove(); return }
  const dx = home.x - from.x, dy = home.y - from.y
  const a = el.animate([
    {transform: 'translate(0,0) scale(.3)', opacity: 0, easing: 'cubic-bezier(.3,1.4,.5,1)'},
    {transform: 'translate(0,-100px) scale(1)', opacity: 1, offset: .3},
    {transform: 'translate(0,-106px) scale(1)', opacity: 1, offset: .72, easing: 'cubic-bezier(.5,0,.8,.6)'},
    {transform: 'translate(' + dx + 'px,' + (dy - 4) + 'px) scale(.3)', opacity: 0}
  ], {duration: 1700})
  cap.animate([{opacity: 0}, {opacity: 1, offset: .2}, {opacity: 1, offset: .72}, {opacity: 0}], {duration: 1700})
  await a.finished.catch(() => {}); el.remove(); cap.remove()
}
const playReward = k => { const el = document.createElement('div'); el.className = 'rw' + (TYPES[k].rar >= 3 ? ' rare' : ''); el.innerHTML = ART[k](); return flyItem(el, 'נמצא: ' + TYPES[k].name + (TYPES[k].rar >= 2 ? ' · ' + RAR[TYPES[k].rar] : ''), TYPES[k].rar >= 3) }
const playStone = (cap) => { const el = document.createElement('div'); el.className = 'rw'; el.innerHTML = ART.pebble(); return flyItem(el, cap || 'היום נסגר · אבן חדשה בערימה') }
const playLeaf = () => { const el = document.createElement('div'); el.className = 'rw'; el.innerHTML = ART.leaf(); return flyItem(el, 'השבוע נסגר · עלה חדש') }
let chain = Promise.resolve(); const enqueue = fn => { chain = chain.then(fn).catch(e => console.error(e)); return chain }

/* ───────── the rules, applied ───────── */
function rollReward(task, now) {
  const d = dayRec(); now = now || Date.now()
  if (now - task.created < CONFIG.minAgeMs) return null          // closed too soon after creation: nothing, silently
  d.valid++
  if (task.counted) return null                                   // un-ticked and ticked again: no second reward
  task.counted = true
  if (d.rewards >= CONFIG.dailyCap) return null
  if (d.rewards > 0 && Math.random() >= CONFIG.pAfterFirst) return null
  d.rewards++; const k = window.__force || pickWeighted(); window.__force = null
  G.counts[k] = (G.counts[k] || 0) + 1; return k
}
function toggleTask(id) {
  const t = tasks.find(x => x.id === id); if (!t) return
  t.done = !t.done
  renderTasks(); badges()
  if (!t.done) { setLevel(); saveG(); return }                      // un-ticking costs nothing and takes nothing away
  const d = dayRec(); d.done++
  enqueue(async () => {
    await dropToTasks()
    const k = rollReward(t); saveG()
    if (k) await playReward(k)
    const open = tasks.filter(x => !x.done).length
    if (!open && d.valid >= CONFIG.dayMinTasks && !d.closed) await closeDay(true)
  })
}
async function closeDay(fly) {
  const d = dayRec(); d.closed = true; G.cairn.push(stone()); G.fresh = 'last'; saveG()
  if (fly) await playStone()
  if (screen === 'home') renderHome()
}
async function closeWeek() { G.leaves++; saveG(); await playLeaf(); if (screen === 'home') renderHome() }

/* ───────── events ───────── */
document.addEventListener('click', e => {
  const tk = e.target.closest('#s-tasks .tick'); if (tk) toggleTask(+tk.closest('.row').dataset.id)
})
document.addEventListener('submit', e => {
  if (e.target.id !== 'addf') return
  e.preventDefault(); const v = $('#addt').value.trim(); if (!v) return
  tasks.push({id: nextId++, t: v, done: false, created: Date.now()}); renderTasks(); setLevel(); badges()
})

/* ───────── demo sheet ───────── */
function sheet() {
  const todayRec = dayRec()
  $('#pane').innerHTML =
    '<h3>תן פרס עכשיו (הדגמה)</h3><div class="chips">' + Object.keys(TYPES).map(k => '<button data-give="' + k + '">' + TYPES[k].name + '</button>').join('') + '</div>' +
    '<h3>סגירות</h3><div class="chips"><button data-act="day">סגור יום · אבן לערימה</button><button data-act="week">סגור שבוע · עלה</button></div>' +
    '<h3>משימות</h3><div class="chips"><button data-act="fresh">הוסף משימה חדשה (גיל 0)</button><button data-act="aged">הוסף משימה ישנה</button><button data-act="undo">פתח את כל המשימות</button></div>' +
    '<h3>נגישות (תצוגה מקדימה)</h3><div class="chips"><button id="tgRM" aria-pressed="' + root.classList.contains('rm') + '">תנועה מופחתת</button><button id="tgRT" aria-pressed="' + root.classList.contains('rt') + '">שקיפות מופחתת</button></div>' +
    '<p class="stat" id="stat">היום: ' + todayRec.rewards + ' פרסים מתוך ' + CONFIG.dailyCap + ' · ' + todayRec.valid + ' משימות נספרו · ' + (todayRec.closed ? 'היום נסגר' : 'היום עוד פתוח') + '</p>' +
    '<h3>הכללים</h3><ul>' +
    '<li>הסגירה הראשונה התקפה ביום מתגמלת תמיד. אחריה, בהסתברות ' + Math.round(CONFIG.pAfterFirst * 100) + '%, ועד ' + CONFIG.dailyCap + ' ביום.</li>' +
    '<li>משימה שנסגרה פחות מ-' + (CONFIG.minAgeMs / 1000) + ' שניות אחרי שנוצרה: בלי פרס ובלי שום הודעה. ביטול סימון וסימון חוזר: בלי פרס נוסף.</li>' +
    '<li>משקלות: ' + Object.keys(TYPES).map(k => TYPES[k].name + ' ' + TYPES[k].w).join(' · ') + '.</li>' +
    '<li>אבן בערימה: יום שנסגר (לפחות ' + CONFIG.dayMinTasks + ' משימות תקפות, רשימה ריקה). הערימה לא יורדת אף פעם.</li>' +
    '<li>עלה: שבוע (א׳–ש׳) שנסגרו בו לפחות ' + CONFIG.weekMinDays + ' ימים. אין סטריק ואין עונש.</li>' +
    '<li>הכול נשמר ב-localStorage במפתח ' + KEY + '. אין שינוי ב-worker או ב-D1.</li></ul>' +
    '<div class="chips" style="margin-top:14px"><button data-act="reset">אפס גן (נתוני הדגמה)</button><button data-act="close">סגור</button></div>'
}
$('#gear').onclick = () => { sheet(); $('#sheet').classList.add('open') }
$('#sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet') return $('#sheet').classList.remove('open')
  const g = e.target.closest('[data-give]'), a = e.target.closest('[data-act]')
  if (g) { $('#sheet').classList.remove('open'); window.__force = g.dataset.give; enqueue(async () => { const k = window.__force; window.__force = null; G.counts[k]++; dayRec().rewards++; saveG(); await playReward(k); if (screen === 'garden') renderGarden() }) }
  if (a) {
    const act = a.dataset.act
    if (act === 'close') $('#sheet').classList.remove('open')
    if (act === 'day') { $('#sheet').classList.remove('open'); enqueue(() => closeDay(true)) }
    if (act === 'week') { $('#sheet').classList.remove('open'); enqueue(closeWeek) }
    if (act === 'fresh') { tasks.push({id: nextId++, t: 'משימה חדשה ' + (nextId - 6), done: false, created: Date.now()}); setLevel(); badges(); if (screen === 'tasks') renderTasks(); sheet() }
    if (act === 'aged') { tasks.push({id: nextId++, t: 'משימה ישנה ' + (nextId - 6), done: false, created: ago(300)}); setLevel(); badges(); if (screen === 'tasks') renderTasks(); sheet() }
    if (act === 'undo') { tasks.forEach(x => x.done = false); setLevel(); badges(); if (screen === 'tasks') renderTasks(); sheet() }
    if (act === 'reset') { G = seedGarden(); saveG(); show(screen); sheet() }
  }
  if (e.target.id === 'tgRM') { root.classList.toggle('rm'); e.target.setAttribute('aria-pressed', root.classList.contains('rm')) }
  if (e.target.id === 'tgRT') { root.classList.toggle('rt'); e.target.setAttribute('aria-pressed', root.classList.contains('rt')) }
})
// previews of the reward animations, from the garden (they change nothing)
document.addEventListener('click', e => { const b = e.target.closest('[data-prev]'); if (b) enqueue(() => playReward(b.dataset.prev)) })

if (new URLSearchParams(location.search).get('rec') === '1') root.classList.add('rec')
if (new URLSearchParams(location.search).get('touch') === '1')
  document.addEventListener('pointerdown', e => { const s = stage.getBoundingClientRect(), t = document.createElement('div'); t.className = 'touch'; t.style.left = ((e.clientX - s.left) / Z()) + 'px'; t.style.top = ((e.clientY - s.top) / Z()) + 'px'; t.addEventListener('animationend', () => t.remove()); stage.appendChild(t) }, true)

/* ───────── boot ───────── */
function boot() {
  setVariant(variant); go('home', true); setLevel(); badges()
  window.addEventListener('resize', () => { indX = null; placeInd(false) })
}
boot()
window.NAVLAB = {CONFIG, TYPES, get G() { return G }, set G(v) { G = v }, tasks: () => tasks, pickWeighted, rollReward, toggleTask, closeDay, closeWeek, go, show, setVariant, weekRollover, dayRec, enqueue, saveG, KEY, seedGarden, queueIdle: () => chain}
</script>
</body>
